function _fmtDate(ts){

const WORLDS=[

const ARMOR=[{p:"🥋",n:"Belt of Truth"},{p:"🛡",n:"Breastplate"},{p:"👟",n:"Shoes of Peace"},{p:"🔰",n:"Shield of Faith"},{p:"⛑",n:"Helm of Salvation"},{p:"⚔",n:"Sword of Spirit"}];
// Distractors organized by grammatical category for context-matching
const DISTRACTOR_POOL={
  verbs_s:["loves","hates","rules","creates","saves","judges","sees","hears","knows","forgives","commands","blesses","sends","dwells","reigns","speaks","forms","guides","calls","keeps"],
  verbs_base:["love","hate","rule","create","save","judge","see","hear","know","forgive","command","bless","send","dwell","reign","speak","form","guide","call","keep"],
  verbs_past:["loved","hated","ruled","created","saved","judged","saw","heard","knew","forgave","commanded","blessed","sent","dwelt","reigned","spoke","formed","guided","called","kept"],
  verbs_ing:["loving","hating","ruling","creating","saving","judging","seeing","hearing","knowing","forgiving","commanding","blessing","sending","dwelling","reigning","speaking","forming","guiding","calling","keeping"],
  adj:["righteous","wicked","faithful","sinful","blameless","corrupt","merciful","worthy","glorious","sovereign","almighty","just","gracious","perfect","broken","fallen","chosen","unworthy","defiled","redeemed"],
  nouns:["grace","faith","glory","wrath","covenant","righteousness","spirit","truth","mercy","salvation","redemption","judgment","creation","sacrifice","atonement","sanctification","justification","obedience","transgression","condemnation"],
  nouns_concrete:["soul","body","heart","flesh","law","word","blood","fire","bread","water","stone","light","darkness","temple","altar","throne","cross","tomb","crown","serpent"],
  other:["one","three","many","all","none","eternal","mortal","infinite","finite","divine"]
};
function detectWordCategory(word){
  const w=word.toLowerCase().trim();
  if(/ing$/.test(w))return 'verbs_ing';
  if(/ed$/.test(w)&&w.length>4)return 'verbs_past';
  if(/[^s]s$/.test(w)&&w.length>3&&!/ness|ious|eous|ous|ss$/.test(w))return 'verbs_s';
  if(DISTRACTOR_POOL.adj.some(d=>d===w))return 'adj';
  return 'nouns';
}
function buildWordBank(blanks,currentBlankIdx){
  const correctWord=blanks[currentBlankIdx];
  const pool=[correctWord];
  const cat=detectWordCategory(correctWord);
  const catPool=shuffle([...(DISTRACTOR_POOL[cat]||DISTRACTOR_POOL.nouns)]
    .filter(d=>!blanks.some(b=>b.toLowerCase()===d.toLowerCase())&&d.toLowerCase()!==correctWord.toLowerCase()));
  const nounPool=shuffle([...DISTRACTOR_POOL.nouns,...DISTRACTOR_POOL.nouns_concrete]
    .filter(d=>!blanks.some(b=>b.toLowerCase()===d.toLowerCase())&&d.toLowerCase()!==correctWord.toLowerCase()&&!catPool.includes(d)));
  let added=0;
  for(let i=0;i<catPool.length&&added<3;i++){pool.push(catPool[i]);added++;}
  for(let i=0;i<nounPool.length&&added<3;i++){pool.push(nounPool[i]);added++;}
  return shuffle(pool.slice(0,4));
}

function save(){
  const saves=JSON.parse(localStorage.getItem('cq3s')||'{}');
  saves[G.name]={score:G.score,lives:G.lives,worldsDone:G.worldsDone,armorEarned:G.armorEarned,totalAnswered:G.totalAnswered,gender:G.gender,diff:G.diff,ts:Date.now()};
  localStorage.setItem('cq3s',JSON.stringify(saves));
  const lb=JSON.parse(localStorage.getItem('cq3lb')||'[]');
  const ei=lb.findIndex(e=>e.name===G.name);
  const ent={name:G.name,score:G.score,worlds:G.worldsDone.length,armor:G.armorEarned.length,ts:Date.now(),date:_fmtDate(Date.now())};
  if(ei>=0){if(G.score>lb[ei].score)lb[ei]=ent;}else lb.push(ent);
  lb.sort((a,b)=>b.score-a.score);
  localStorage.setItem('cq3lb',JSON.stringify(lb.slice(0,25)));
  if(_fbDb){
    _fbDb.ref('cq3lb').orderByChild('name').equalTo(G.name).once('value',snap=>{
      const data=snap.val();
      if(data){const key=Object.keys(data)[0];if(G.score>data[key].score)_fbDb.ref('cq3lb/'+key).set(ent);}
      else _fbDb.ref('cq3lb').push(ent);
    });
  }
}

// ===============================
let titleMusicPlaying=false;
function playTitleMusic(){
  if(titleMusicPlaying)return;
  titleMusicPlaying=true;
  try{
    const c=ac();
    // Zelda-inspired melody: upbeat, heroic
    const melody=[
      [392,0.12],[440,0.12],[494,0.12],[523,0.25],[0,0.08],
      [523,0.12],[587,0.12],[659,0.12],[698,0.25],[0,0.08],
      [784,0.18],[698,0.12],[659,0.12],[587,0.12],[523,0.25],[0,0.1],
      [494,0.12],[523,0.12],[587,0.18],[523,0.12],[440,0.12],[392,0.35],[0,0.15],
      [523,0.1],[523,0.1],[587,0.1],[659,0.2],[0,0.06],
      [659,0.1],[698,0.1],[784,0.1],[880,0.3],[0,0.1],
      [784,0.1],[698,0.1],[659,0.1],[587,0.1],[523,0.1],[440,0.1],[392,0.4]
    ];
    // Bass line
    const bass=[
      [196,0.5],[220,0.5],[247,0.5],[261,0.5],
      [294,0.5],[261,0.5],[220,0.5],[196,1.0]
    ];
    let t=c.currentTime+0.1;
    melody.forEach(([freq,dur])=>{
      if(freq>0){
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='square';o.frequency.value=freq;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.09,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.9);
        o.start(t);o.stop(t+dur);
        // Harmony (fifth below)
        const o2=c.createOscillator(),g2=c.createGain();
        o2.connect(g2);g2.connect(c.destination);
        o2.type='triangle';o2.frequency.value=freq*0.667;
        g2.gain.setValueAtTime(0,t);
        g2.gain.linearRampToValueAtTime(0.04,t+0.01);
        g2.gain.exponentialRampToValueAtTime(0.001,t+dur*0.9);
        o2.start(t);o2.stop(t+dur);
      }
      t+=dur;
    });
    // Bass
    let tb=c.currentTime+0.1;
    bass.forEach(([freq,dur])=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='triangle';o.frequency.value=freq;
      g.gain.setValueAtTime(0.06,tb);
      g.gain.exponentialRampToValueAtTime(0.001,tb+dur*0.8);
      o.start(tb);o.stop(tb+dur);
      tb+=dur;
    });
    // Schedule next loop
    setTimeout(()=>{titleMusicPlaying=false;if(document.getElementById('titleScr').classList.contains('on'))playTitleMusic();},t*1000-c.currentTime*1000+200);
  }catch(e){titleMusicPlaying=false;}
}

// ==================== NEW DETAILED PILGRIM (Boy + Girl with Brown Hair) ====================
function drawPilgrimCanvas(ctx, ox, oy, armor, scale = 2.5, frame = 0) {
  const s = scale;
  const belt = armor.includes(0);
  const breast = armor.includes(1);
  const shoes = armor.includes(2);
  const shield = armor.includes(3);
  const helm = armor.includes(4);
  const sword = armor.includes(5);
  const gender = G.gender || 'boy';

  const bob = (frame % 2 === 1) ? 1 : 0;

  function px(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(ox + x*s), Math.round(oy + y*s), Math.round(w*s), Math.round(h*s));
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(ox + 14*s, oy + 26*s, 11*s, 3*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Feet
  const boot = shoes ? '#b86a2a' : '#3a2a1a';
  px(4, 19 + bob, 8, 6, boot);
  px(13, 19 - bob, 8, 6, boot);

  // Body / Dress
  if (gender === 'girl') {
    px(5, 6, 15, 14, '#c04070');
    px(6, 7, 13, 12, '#e06090');
    px(7, 15, 11, 3, '#a02050');
  } else {
    const tunic = breast ? '#a0a0b8' : '#2a6a2a';
    const tunicHi = breast ? '#c0c0d8' : '#3a9a3a';
    px(5, 6, 15, 10, tunic);
    px(6, 7, 13, 7, tunicHi);
  }

  // Belt
  if (belt) {
    px(5, 11, 15, 3, '#d8a030');
    px(6, 11, 13, 2, '#f0c040');
    px(10, 10, 5, 3, '#b08020');
  }

  // Arms
  const armCol = gender === 'girl' ? '#c04070' : '#2a6a2a';
  px(3, 8, 4, 9, armCol);
  px(17, 8, 4, 9, armCol);

  if (shield) {
    px(-1, 5, 9, 12, '#b8a050');
    px(1, 6, 7, 10, '#d0c070');
    px(3, 8, 3, 6, '#c04020');
  } else {
    px(3, 13, 4, 4, '#c0906a');
  }

  if (sword) {
    ctx.save();
    ctx.translate(ox + 21*s, oy + 13*s);
    ctx.rotate(-0.75);
    ctx.fillStyle = '#d0d8e0'; ctx.fillRect(-1.5*s, -22*s, 3*s, 24*s);
    ctx.fillStyle = '#b88030'; ctx.fillRect(-4*s, -5*s, 9*s, 5*s);
    ctx.fillStyle = '#f0f8ff'; ctx.fillRect(-1*s, -25*s, 3*s, 4*s);
    ctx.restore();
  } else {
    px(18, 13, 4, 4, '#c0906a');
  }

  // Brown Hair
  const hairDark = '#2a1a10';
  const hairMid  = '#3a2a18';
  if (gender === 'girl') {
    px(4, -6, 17, 13, hairDark);
    px(5, -7, 15, 11, hairMid);
    px(16, -3, 6, 13, hairDark);
    px(17, -2, 4, 10, hairMid);
  } else {
    px(6, -4, 13, 9, hairDark);
    px(7, -5, 11, 7, hairMid);
  }

  // Face
  px(7, 1, 11, 8, '#f0c090');
  px(8, 2, 9, 6, '#ffd0a8');

  px(9, 4, 2, 2, '#1a1a1a');
  px(13, 4, 2, 2, '#1a1a1a');
  px(9, 4, 1, 1, '#ffffff');
  px(13, 4, 1, 1, '#ffffff');
  px(11, 5, 1, 2, '#d8a878');
  px(10, 7, 4, 1, gender === 'girl' ? '#e07080' : '#c06048');

  if (gender === 'girl') {
    px(11, 8, 3, 1, '#ffd040');
    px(12, 9, 1, 1, '#ffd040');
  }

  if (helm) {
    px(5, -6, 15, 10, '#8888a0');
    px(6, -5, 13, 7, '#a0a0b8');
    px(7, -9, 11, 4, '#b8b8d0');
  }
}

function buildWM(){
  stopLoop();
  const cv=document.getElementById('wmCv');
  if(!cv)return;
  wmFrame=0;
  if(wmLoopId){cancelAnimationFrame(wmLoopId);wmLoopId=null;}
  function wmLoop(){wmFrame++;drawWM();wmLoopId=requestAnimationFrame(wmLoop);}
  wmLoop();
  // Click handling
  cv.onclick=function(e){
    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(640/rect.width);
    const my=(e.clientY-rect.top)*(480/rect.height);
    WORLDS.forEach((w,i)=>{
      const done=G.worldsDone.includes(i);
      const locked=i>0&&!G.worldsDone.includes(i-1)&&!done;
      if(locked)return;
      const pos=WM_WORLD_POS[i];
      const dx=mx-pos.x,dy=my-pos.y;
      if(dx*dx+dy*dy<28*28){sfxMenu();beginWorld(i);}
    });
    // Buttons
    if(mx>10&&mx<110&&my>446&&my<470){sfxMenu();buildParent();show('parentScr');}
    if(mx>118&&mx<198&&my>446&&my<470){sfxMenu();goTitle();}
  };
}

function beginWorld(wIdx){
  sfxMenu();stopLoop();
  G.wIdx=wIdx;
  const r=WRANGES[wIdx];
  G.wQs=[];for(let i=r[0];i<=r[1];i++)G.wQs.push(i);
  G.qIdx=0;G.correct=0;G.wrong=0;G.streak=0;G.bossHP=100;
  G.altarsLit=0;G.nearAltar=null;G.activeAltarIdx=-1;
  // Setup altars — assign questions round-robin from non-boss range
  const D=DENSE[wIdx],TS=D?8:16;
  const positions=D?D.altars:(ALTAR_POSITIONS[wIdx]||ALTAR_POSITIONS[0]);
  const nonBossQs=G.wQs.slice(0,G.wQs.length-1); // last Q reserved for boss
  G.altarData=positions.map((pos,i)=>({
    tx:pos[1],ty:pos[0],
    x:pos[1]*TS+TS/2,y:pos[0]*TS+TS/2,
    qIdx:nonBossQs[i%nonBossQs.length],
    lit:false,animT:0,required:i<10
  }));
  // Shuffle altar question order so adjacent altars ask different questions
  const shuffledQs=shuffle(nonBossQs);
  G.altarData.forEach((a,i)=>{a.qIdx=shuffledQs[i%shuffledQs.length];});
  // Player starts near bottom center of map
  G.px=320;G.py=376;G.dir='up';G.frame=0;
  if(wIdx===0)G.burden=100; // reset burden only at start of game, not per world
  G.companion={px:320,py:396,frame:0,animT:0};
  G.trail=[];G.chestOpen=G.armorEarned.includes(wIdx);G.nearChest=false;
  if(D){G.px=D.start[0];G.py=D.start[1];G.companion.px=D.comp[0];G.companion.py=D.comp[1];}
  // Keep path data for tile rendering (path tiles render as cobblestone)
  const path=PATHS[wIdx]||PATHS[0];
  G.pathData=path;G.coins=[];G.pillar={pathIdx:0,px:path[0][1]*16,py:path[0][0]*16,frame:0};
  G.phase='walk';
  document.getElementById('qDlg').style.display='none';
  document.getElementById('bqDlg').style.display='none';
  show('owScr');
  startMapLoop();
}

// ===============================
// MAP TILES — rich world-specific layouts
// Tile codes:
//   G = grass  P = path  W = tree/obstacle
//   R = river/special fluid  S = stone/rock patch
//   F = farm/crop field  B = bush cluster anchor
//   H = house anchor (draws multi-tile building)
//   X = landmark anchor (cross, ruin, well, pillar etc.)
//   (anchors mark top-left; draw functions paint multiple tiles)
// ===============================
function buildTiles(wIdx){
  const rows=26,cols=40,m=[];
  for(let r=0;r<rows;r++)m.push(Array(cols).fill('G'));

  // ── 2-wide path ──────────────────────────────────────────
  const path=PATHS[wIdx]||PATHS[0];
  path.forEach(([r,c])=>{
    if(r>=0&&r<rows&&c>=0&&c<cols)m[r][c]='P';
    if(r>=0&&r<rows&&c+1>=0&&c+1<cols)m[r][c+1]='P';
  });

  // ── World-specific river row ──────────────────────────────
  const riverRow={0:13,1:11,2:14,3:10,4:12,5:9}[wIdx]??13;
  for(let c=0;c<cols;c++){
    if(m[riverRow][c]!=='P'&&m[riverRow+1]&&m[riverRow+1][c]!=='P'){
      m[riverRow][c]='R';
      if(riverRow+1<rows)m[riverRow+1][c]='R';
    }
  }

  // ── World-specific landmark placements ───────────────────
  const lm=WORLD_LANDMARKS[wIdx]||[];
  lm.forEach(([r,c,type])=>{
    if(r>=0&&r<rows-3&&c>=0&&c<cols-5){
      // Only place if area is clear grass
      if(m[r][c]==='G')m[r][c]=type;
    }
  });

  // ── Stone/rock patches ────────────────────────────────────
  const stones=WORLD_STONES[wIdx]||[];
  stones.forEach(([r,c])=>{
    for(let dr=0;dr<2;dr++)for(let dc=0;dc<2;dc++){
      if(r+dr<rows&&c+dc<cols&&m[r+dr][c+dc]==='G')m[r+dr][c+dc]='S';
    }
  });

  // ── Farm/crop patches ────────────────────────────────────
  const farms=WORLD_FARMS[wIdx]||[];
  farms.forEach(([r,c])=>{
    for(let dr=0;dr<3;dr++)for(let dc=0;dc<4;dc++){
      if(r+dr<rows&&c+dc<cols&&m[r+dr][c+dc]==='G')m[r+dr][c+dc]='F';
    }
  });

  // ── Bush cluster anchors ──────────────────────────────────
  const bushes=WORLD_BUSHES[wIdx]||[];
  bushes.forEach(([r,c])=>{
    if(r<rows&&c<cols&&m[r][c]==='G')m[r][c]='B';
  });

  return m;
}

function dwHouse(wT,hT,seed,home){
  const W=wT*8,H=hT*8,TOP=14;

  const pal=home?{top:'#d8885a',mid:'#b8603e',bot:'#94482e',ridge:'#743422'}:DW_ROOFS[seed%DW_ROOFS.length];
  const stone=!home&&seed%5===3;
  const F=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  // chimney (behind roof top)
  const chx=ox+Math.round(seed%2?W*0.2:W*0.68);
  F(chx,oy-10,8,18,'#8a4a34');
  for(let i=0;i<4;i++){F(chx,oy-8+i*4,8,1,'#6a3424');F(chx+(i%2?4:1),oy-10+i*4,1,3,'#6a3424');}

    for(let xx=(i%2)*3+1;xx<W+4;xx+=6)F(xx,yy,2,1,pal.top);

  F(0,oy,2,R,pal.ridge);F(W+2,oy,2,R,pal.ridge);
  if(!home&&seed%3===0){
    const dx=ox+8+(seed%(Math.max(1,W-24))),dy=oy+6;

  }
  // wall
  const wy=oy+R;
  F(ox,wy,W,wallH,stone?'#a49a8a':'#e0d0a8');
  if(stone){for(let yy=wy+3;yy<oy+H-3;yy+=4){F(ox,yy,W,1,'#857b6d');for(let xx=ox+((yy/4)%2?2:6);xx<ox+W;xx+=8)F(xx,yy-3,1,3,'#857b6d');}}
  else{
    F(ox,wy,W,wallH,'#e0d0a8');
    F(ox,wy+wallH-6,W,3,'#d0be94');
    const beam='#5a3a22';
    F(ox,wy,W,2,beam);F(ox,wy+Math.floor(wallH/2)-1,W,2,beam);
    for(let xx=ox;xx<ox+W;xx+=20)F(xx,wy,3,wallH-3,beam);
    F(ox+W-3,wy,3,wallH-3,beam);
    for(let xx=ox+3;xx+17<=ox+W;xx+=20){if((seed+xx)%3===0)pline(g,xx,wy+Math.floor(wallH/2)-2,xx+16,wy+2,beam,1);}
    if(!home&&seed%2===1){pline(g,ox+W-14,wy+4,ox+W-10,wy+9,'#a08c68');pline(g,ox+W-10,wy+9,ox+W-12,wy+14,'#a08c68');}
  }
  // eave shadow
  F(ox,wy,W,2,'rgba(30,20,10,0.45)');
  // foundation
  F(ox,oy+H-3,W,3,'#8a8276');for(let xx=ox+3;xx<ox+W;xx+=6)F(xx,oy+H-3,1,3,'#6a6258');F(ox,oy+H-3,W,1,'#a49c90');
  // door
  const dw=10,dh=Math.min(16,wallH-3),dx=ox+Math.floor(W/2)-5,dy=oy+H-3-dh;
  F(dx-1,dy-1,dw+2,dh+1,'#3e2614');
  F(dx,dy,dw,dh,home?'#8a5a2e':'#6a4426');
  for(let xx=dx+2;xx<dx+dw;xx+=3)F(xx,dy,1,dh,home?'#6a4220':'#4e301a');
  F(dx+dw-3,dy+Math.floor(dh/2),1,1,'#e0c060');
  F(dx-1,oy+H-1,dw+2,1,'#b4ac9e');

  const slots=[];for(let xx=ox+6;xx+8<=dx-3;xx+=16)slots.push(xx);for(let xx=dx+dw+5;xx+8<=ox+W-5;xx+=16)slots.push(xx);
  slots.forEach((xx,k)=>{
    const boarded=!home&&((seed+k)%4===0);
    F(xx-1,wyy-1,10,9,'#3e2614');
    if(boarded){F(xx,wyy,8,7,'#2a1c14');F(xx,wyy+1,8,2,'#8a5a30');F(xx,wyy+4,8,2,'#7a4e28');}
    else{

      F(xx,wyy,8,2,lit?'#fff0b0':'#b4d8ec');
      F(xx+3,wyy,1,7,'#3e2614');F(xx,wyy+3,8,1,'#3e2614');
      F(xx+1,wyy+1,1,1,'#ffffff');
      const sh=home?'#3a6a9a':['#4a6a3a','#7a3a2a','#3a5a7a'][seed%3];
      F(xx-3,wyy,2,7,sh);F(xx+9,wyy,2,7,sh);

    }
  });
  return{cv,chim:[chx+4,oy-12]};
}

// ── Build City of Destruction ───────────────────────────────
function dwBuildCity(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('g'));
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(r>=0&&r<rows&&c>=0&&c<cols)g[r][c]=ch;};
  // north fields, moat, walls
  set(0,0,119,21,'f');
  set(0,22,119,24,'w');
  set(0,25,119,28,'W');set(0,25,2,87,'W');set(117,25,119,87,'W');set(0,85,119,87,'W');
  set(56,25,63,28,'c');set(57,22,62,24,'b');
  // yard texture (smooth noise)
  for(let r=29;r<85;r++)for(let c=3;c<117;c++){
    const n=vnoise(c,r,6),n2=vnoise(c+50,r+50,4);
    if(n>0.7)g[r][c]='d';else if(n2>0.82)g[r][c]='r';
  }
  // back lane along south wall
  set(3,81,116,84,'d');
  // streets + square
  set(56,29,63,84,'c');set(3,44,116,49,'c');set(3,64,116,69,'c');set(20,29,25,84,'c');set(94,29,99,84,'c');
  set(46,40,73,53,'p');
  // road from the city gate to the Wicket Gate
  for(let r=8;r<=21;r++){const o=Math.round(Math.sin(r*0.45)*2);set(58+o,r,61+o,r,'d');}
  set(0,6,119,7,'h');set(57,6,62,7,'G');

  // houses [col,row,w,h]
  const HOUSES=[
    [4,30,12,10],[27,30,12,10],[41,30,12,9],[67,30,12,10],[81,31,11,9],[102,30,13,10],
    [5,52,12,10],[27,52,12,10],[41,55,11,8],[77,51,13,10],[101,52,13,10],
    [4,71,11,10],[28,71,13,10],[44,72,10,9],[66,71,13,10,1],[82,71,11,10],[101,71,13,10]
  ];
  // dirt path from each door down to the next street/lane
  HOUSES.forEach(([c,r,w,h])=>{
    const dc=c+Math.floor(w/2)-1;
    for(let rr=r+h;rr<rows;rr++){const t=g[rr][dc];if(t==='c'||t==='p'||t==='W'||(t==='d'&&rr>=81))break;set(dc,rr,dc+1,rr,'d');}
  });

  // solid map: 0 walkable, 1 solid, 2 gate (solid until 10 altars lit)
  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(r>=0&&r<rows&&c>=0&&c<cols)solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='W'||t==='h')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  // paint ground
  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dwPaintTile(gx,g,c,r);
  gx.fillStyle='rgba(20,15,10,0.28)';gx.fillRect(56*8,25*8,64,22);

  const objects=[],chimneys=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  // houses
  HOUSES.forEach(([c,r,w,h,home],i)=>{
    const hs=dwHouse(w,h,tHash(c,r)%97+i,!!home);
    const x=c*8-2,y=r*8-14;
    add(hs.cv,x,y,(r+h)*8);
    if(home||i%2===0)chimneys.push([x+hs.chim[0],y+hs.chim[1]]);
    S(c,r+2,c+w-1,r+h-1);
    gx.fillStyle='rgba(20,15,10,0.22)';gx.fillRect((c+w)*8+2,(r+3)*8,5,(h-3)*8+3);gx.fillRect(c*8+5,(r+h)*8,w*8,3);
  });
  // trees
  const treeAt=(c,r,cv,w)=>{add(cv,c*8+4-w/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  [[17,34],[39,42],[92,43],[113,42],[115,60],[16,82],[92,83],[52,62]].forEach(([c,r],i)=>treeAt(c,r,dwDeadTree(i),28));
  [[10,12],[22,17],[30,10],[48,14],[70,15],[96,10],[106,17],[112,11],[6,19],[78,19],[90,17],[18,9],[34,19],[102,13],[116,19],[2,10]].forEach(([c,r],i)=>treeAt(c,r,dwGreenTree(i),32));
  // props
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  const barrel=dwBarrel(),crate=dwCrate(),lamp=dwLamp();
  [[16,40],[53,41],[79,41],[100,62],[26,82],[42,63],[115,50],[3,62]].forEach(([c,r])=>prop(barrel,c,r));
  [[17,41],[80,41],[100,63],[55,82],[114,50],[3,63]].forEach(([c,r])=>prop(crate,c,r));
  [[55,33],[64,36],[55,58],[64,62],[55,76],[45,47],[74,47]].forEach(([c,r])=>prop(lamp,c,r));
  prop(dwCart(),72,61,4);
  prop(dwSign('WICKET GATE'),64,20,2);
  prop(dwSign('TO THE GATE'),64,80,2);
  // well in the square
  add(dwWell(),458,356,392);S(57,47,62,48);
  S(65,40,68,41);
  // gatehouse
  const tower=dwTower();
  add(tower,52*8,232-72,232);add(tower,64*8,232-72,232);
  add(dwArch(),56*8,25*8-14,233);

  const water=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c]==='w')water.push([c,r]);
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys,water,smoke:[]};
}

function dwSolidAt(x,y){
  const c=Math.floor(x/8),r=Math.floor(y/8);
  if(c<0||r<0||c>=DWS.cols||r>=DWS.rows)return true;
  const v=DWS.solid[r*DWS.cols+c];
  return v===1||(v===2&&(G.altarsLit<10||!dwHasBelt()));
}
function dwBlocked(px,py){return dwSolidAt(px-4,py-3)||dwSolidAt(px+4,py-3)||dwSolidAt(px-4,py+2)||dwSolidAt(px+4,py+2);}

function dwUpdateCompanion(){
  const c=G.companion;c.animT++;
  const t=G.trail;
  if(t.length>16&&Math.hypot(G.px-c.px,G.py-c.py)>22){
    const p=t[Math.max(0,t.length-16)],dx=p[0]-c.px,dy=p[1]-c.py,d=Math.hypot(dx,dy);
    if(d>0.5){const sp=Math.min(d,2.4);c.px+=dx/d*sp;c.py+=dy/d*sp;}
  }
}

function dwAnimWater(ctx,camX,camY){
  const ph=mapFrame*0.06;
  DWS.water.forEach(([c,r])=>{
    const sx=c*8-camX,sy=r*8-camY;
    if(sx<-8||sx>640||sy<-8||sy>480)return;
    const k=Math.sin(ph+c*0.7+r*1.3);
    if(k>0.55){ctx.fillStyle=`rgba(${DWS.ripple||'170,210,235'},0.55)`;ctx.fillRect(sx+((c*3)&5),sy+3+(k>0.8?1:0),3,1);}

  });
}

function dwSmoke(ctx,camX,camY){
  const sm=DWS.smoke;
  DWS.chimneys.forEach(([x,y],i)=>{if((mapFrame+i*7)%16===0)sm.push({x:x+(Math.random()*2-1),y,t:0});});
  for(let i=sm.length-1;i>=0;i--){
    const p=sm[i];p.t++;p.y-=0.32;p.x+=0.16+Math.sin(p.t*0.06)*0.12;
    if(p.t>120){sm.splice(i,1);continue;}
    const a=0.42*(1-p.t/120),s=2+Math.floor(p.t/24);
    ctx.fillStyle=`rgba(96,90,86,${a})`;ctx.fillRect(Math.round(p.x-camX-s/2),Math.round(p.y-camY-s/2),s,s);
  }
}

function dsDrawLight(ctx,camX,camY){
  const lift=Math.min(1,G.altarsLit/10);
  const lx=480-camX,ly=10-camY;
  if(ly>-220){
    const gr=ctx.createRadialGradient(lx,ly,6,lx,ly,140+80*lift);
    gr.addColorStop(0,`rgba(255,250,215,${0.6+0.3*lift})`);gr.addColorStop(0.3,`rgba(255,236,160,${0.25+0.25*lift})`);gr.addColorStop(1,'rgba(255,230,140,0)');
    ctx.fillStyle=gr;ctx.fillRect(lx-240,ly-40,480,300);
    pcirc(ctx,lx,ly,7,'#fff8d8');
  }
  // mud bubbles
  const B=DWS.bubbles;
  if(mapFrame%3===0)for(let k=0;k<5;k++){const t=DWS.mud[(Math.random()*DWS.mud.length)|0];if(!t)break;const sx=t[0]*8-camX,sy=t[1]*8-camY;if(sx>0&&sx<640&&sy>0&&sy<480)B.push({x:t[0]*8+1+((Math.random()*5)|0),y:t[1]*8+1+((Math.random()*5)|0),t:0});}
  for(let i=B.length-1;i>=0;i--){
    const b=B[i];b.t++;if(b.t>44){B.splice(i,1);continue;}
    const sx=b.x-camX,sy=b.y-camY;
    if(b.t<34){const r=1+Math.floor(b.t/13);ctx.fillStyle='rgba(120,100,74,0.9)';ctx.fillRect(sx-r,sy-r,r*2,r*2);ctx.fillStyle='rgba(200,190,160,0.8)';ctx.fillRect(sx-r+1,sy-r,1,1);}
    else{ctx.fillStyle='rgba(170,150,120,0.7)';ctx.fillRect(sx-3,sy,1,1);ctx.fillRect(sx+3,sy,1,1);ctx.fillRect(sx,sy-3,1,1);}
  }
  // the fog of despond thins as altars are lit
  const fa=0.08+0.32*(1-lift);
  ctx.save();ctx.globalAlpha=fa;
  for(let i=0;i<18;i++){
    const x=((i*211+mapFrame*(0.12+0.05*(i%3)))%(DWS.W+400))-200-camX,y=((i*137)%(DWS.H-80))+20-camY;
    if(x>-260&&x<640&&y>-150&&y<480)ctx.drawImage(fogBlob(),Math.round(x),Math.round(y),260,150);
  }
  ctx.restore();
  ctx.fillStyle=`rgba(30,46,34,${0.2*(1-lift)})`;ctx.fillRect(0,0,640,480);
}

function dsBuildSlough(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('g'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))g[r][c]=ch;};
  const disc=(cc,rr,rad,ch)=>{for(let r=rr-rad-2;r<=rr+rad+2;r++)for(let c=cc-rad-3;c<=cc+rad+3;c++){if(!inb(c,r))continue;const d=Math.hypot((c-cc)*0.85,r-rr)+(vnoise(c,r,3)-0.5)*1.8;if(d<=rad)g[r][c]=ch;}};
  set(0,0,119,5,'f');
  set(0,6,119,7,'h');set(57,6,62,7,'G');
  // the bog
  for(let r=15;r<=74;r++)for(let c=0;c<cols;c++){
    const edge=Math.min(r-15,74-r);
    if(edge<3&&vnoise(c,r*0.6,5)<0.25+edge*0.12)continue;
    g[r][c]=vnoise(c,r,9)<0.36?'w':'m';
  }
  // firm islands
  [[30,62,5],[88,64,5],[18,44,5],[60,46,7],[100,40,6],[36,28,5],[82,24,5],[110,58,4]].forEach(([c,r,rad])=>disc(c,r,rad,'g'));
  // the steps: stepping stones through the slough
  const path=pts=>{for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c2,d]=pts[i+1],n=Math.max(Math.abs(c2-a),Math.abs(d-b));for(let k=0;k<=n;k++){const cc=Math.round(a+(c2-a)*k/n),rr=Math.round(b+(d-b)*k/n);for(let dc=0;dc<2;dc++)for(let dr=0;dr<2;dr++){if(!inb(cc+dc,rr+dr))continue;const t=g[rr+dr][cc+dc];if(t==='m'||t==='w')g[rr+dr][cc+dc]='s';}}}};
  path([[59,76],[56,70],[50,64],[54,56],[59,52]]);
  path([[60,39],[64,34],[70,28],[66,20],[60,15],[60,12]]);
  path([[50,64],[36,62]]);path([[56,70],[80,66],[88,64]]);path([[53,46],[30,44],[20,44]]);path([[67,46],[90,42],[98,40]]);
  path([[64,34],[46,30],[38,28]]);path([[70,28],[80,24]]);path([[88,64],[104,60],[108,58]]);
  set(59,75,60,80,'b');
  for(let r=8;r<=14;r++){const o=Math.round(Math.sin(r*0.5)*1.5);set(59+o,r,61+o,r,'d');}
  set(57,81,62,84,'d');

  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='h')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dsPaintTile(gx,g,c,r);

  const objects=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  const treeAt=(c,r,cv,solidTrunk=true)=>{add(cv,c*8+4-cv.width/2,(r+1)*8-cv.height,(r+1)*8);if(solidTrunk)S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  // dead trees on islands, willows on the banks
  [[27,59],[92,61],[15,41],[64,42],[103,37],[33,25],[85,21],[112,56],[54,49]].forEach(([c,r],i)=>treeAt(c,r,dwDeadTree(i)));
  [[8,80],[24,84],[96,82],[112,79],[40,78],[78,84],[10,10],[26,12],[100,9],[114,12],[44,9],[80,11]].forEach(([c,r],i)=>treeAt(c,r,dsWillow(i)));
  // reeds along every shore (decoration only)
  for(let r=15;r<75;r++)for(let c=1;c<cols-1;c++){
    if(g[r][c]!=='g')continue;
    const wet=['m','w'].includes(g[r+1]&&g[r+1][c])||['m','w'].includes(g[r][c+1]);
    if(wet&&tHash(c,r)%6===0){const cv=dsReeds(tHash(r,c)%7);add(cv,c*8+1,(r+1)*8-cv.height+2,(r+1)*8+2);}
  }
  for(let r=15;r<75;r++)for(let c=2;c<cols-2;c++){if(g[r][c]==='m'&&tHash(c+5,r)%61===0){const cv=dsReeds(tHash(c,r)%5);add(cv,c*8,(r+1)*8-cv.height,(r+1)*8);}}
  const log=dsLog();
  [[44,58],[74,52],[24,36],[92,30],[52,22],[104,48]].forEach(([c,r])=>{if(g[r][c]==='m')add(log,c*8-10,r*8,r*8+8);});
  // signs
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  prop(dwSign('SLOUGH OF DESPOND',84),50,80,4);
  prop(dwSign('STAY ON THE STEPS',84),63,77,4);
  prop(dwSign('FIRM GROUND',54),64,13,2);
  S(64,10,64,11); // Help stands here

  const water=[],mud=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(g[r][c]==='w')water.push([c,r]);else if(g[r][c]==='m')mud.push([c,r]);}
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys:[],water,mud,bubbles:[],smoke:[],ripple:'150,190,160'};
}

function dhPaintTile(ctx,g,c,r){

  const at=(dc,dr)=>(g[r+dr]&&g[r+dr][c+dc])||'';

    case 'L':{R(0,0,8,8,'#b8b0a0');R(0,0,8,2,'#d4ccbc');R(0,6,8,2,'#8a8274');R(3,2,1,4,'#9a9284');if(r%2)R(6,2,1,4,'#9a9284');if(h%7===0)R(1,6,2,1,'#6a9a4a');break;}
    case 't':{R(0,0,8,8,'#3c5a24');R(0,3,8,4,'#2e4a1c');sp(3,'#22361a',h);
      for(let i=0;i<3;i++){const px=(h>>(i*4))&7,py=(h>>(i*4+2))&7;R(px,py,1,1,'#b08a50');}if(h2%5===0)R(3,1,2,2,'#c02040');break;}

    default:dwPaintTile(ctx,g,c,r);

function dhTomb(){

function dhBuildHill(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('f'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))g[r][c]=ch;};
  const disc=(cc,rr,rad,ch)=>{for(let r=rr-rad-2;r<=rr+rad+2;r++)for(let c=cc-rad-3;c<=cc+rad+3;c++){if(!inb(c,r))continue;const d=Math.hypot((c-cc)*0.85,r-rr)+(vnoise(c,r,3)-0.5)*1.6;if(d<=rad)g[r][c]=ch;}};
  // Hill Difficulty
  for(let r=12;r<=36;r++)for(let c=18;c<=102;c++){const d=((c-60)/40)**2+((r-24)/12)**2+(vnoise(c,r,5)-0.5)*0.5;if(d<1)g[r][c]='k';}
  // palace courtyard and boundary
  set(0,6,39,7,'h');set(80,6,119,7,'h');set(40,6,79,13,'p');set(57,6,62,7,'G');
  // the highway, walled on either side (the wall called Salvation)
  set(57,36,62,84,'c');
  for(let r=36;r<=84;r++){if((r>=46&&r<=49)||(r>=79&&r<=82))continue;g[r][56]='L';g[r][63]='L';}
  // stairs up Hill Difficulty
  let topC=60,botC=60;
  for(let r=14;r<=35;r++){const cc=60+Math.round(Math.sin(r*0.4)*6);set(cc-1,r,cc+1,r,'S');if(r===14)topC=cc;if(r===35)botC=cc;}
  set(Math.min(botC,59)-1,35,Math.max(botC,62)+1,35,'S');
  // the Danger and Destruction paths (dead ends)
  set(36,34,56,35,'d');set(63,34,88,35,'d');
  set(32,31,35,38,'t');set(89,31,92,38,'t');
  // the Cross on its hill, with the open tomb below
  disc(30,48,8,'k');
  set(38,47,55,48,'d');set(31,46,38,47,'S');
  // the stream
  for(let c=0;c<cols;c++){const r0=61+Math.round(Math.sin(c*0.12)*1.5);for(let k=0;k<3;k++)g[r0+k][c]=(c>=57&&c<=62)||(c>=18&&c<=21)?'B':'w';}
  // paths to the Interpreter's house and the east meadow

  const solid=new Uint8Array(cols*rows);

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='h'||t==='t'||t==='L')solid[r*cols+c]=1;}
  S(0,0,119,5);S(40,6,79,7);S(57,6,62,7,2);

  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dhPaintTile(gx,g,c,r);

  const objects=[],chimneys=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  add(dhPalace(),320,64-120,63);
  const lion=dhLion(),lionR=flipCv(lion);
  add(lion,416,70,96);S(52,9,54,11);
  add(lionR,514,70,96);S(64,9,66,11);
  const hs=dwHouse(13,10,7,true);add(hs.cv,34*8-2,70*8-14,80*8);chimneys.push([34*8-2+hs.chim[0],70*8-14+hs.chim[1]]);S(34,72,46,79);
  gx.fillStyle='rgba(20,15,10,0.2)';gx.fillRect(47*8+2,73*8,5,7*8);
  S(29,44,31,45);
  add(dhTomb(),37*8+4-23,53*8-34,53*8);S(35,51,40,52);
  add(dhArbor(),68*8-19,25*8-36,25*8);S(66,24,66,24);S(70,24,70,24);
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  prop(dwSign('DANGER',46),48,33,2);prop(dwSign('DESTRUCTION',66),68,33,3);
  prop(dwSign('HILL DIFFICULTY',76),64,37,4);prop(dwSign('THE CROSS',54),50,45,2);prop(dwSign('INTERPRETER',62),48,79,2);
  const thorn=dhThorn();[[33,30],[34,39],[90,30],[91,39],[31,35],[93,34]].forEach(([c,r])=>add(thorn,c*8-5,(r+1)*8-16,(r+1)*8));
  const treeAt=(c,r,cv)=>{add(cv,c*8+4-cv.width/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  [[6,20],[14,10],[26,8],[98,10],[108,22],[114,8],[8,40],[16,52],[44,56],[50,40],[74,44],[86,52],[100,46],[112,40],[106,70],[96,86],[78,74],[70,86],[12,84],[26,76],[50,70],[112,84],[4,64],[118,60]].forEach(([c,r],i)=>treeAt(c,r,dwGreenTree(i)));

  const water=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c]==='w')water.push([c,r]);
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys,water,smoke:[]};

function startDenseLoop(){
  stopLoop();
  const D=DENSE[G.wIdx];
  if(!D.built)D.built=D.build();
  DWS=D.built;
  CHEST=D.chest||null;
  const owCtx=document.getElementById('owCv').getContext('2d'),spCtx=document.getElementById('spCv').getContext('2d');
  owCtx.imageSmoothingEnabled=false;spCtx.imageSmoothingEnabled=false;
  keys.up=keys.down=keys.left=keys.right=false;
  const SPEED=1.9,TOP=30;
  let last=0;
  function loop(now){
    loopId=requestAnimationFrame(loop);
    if(now&&now-last<15.5)return;
    last=now||0;
    if(G.paused)return;
    mapFrame++;
    if(G.phase==='walk'){
      const dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
      if(dx||dy){
        const tF=dwTileAt(G.px,G.py),sl=tF==='m'?0.5:(D.slow&&tF===D.slow?0.6:1),len=Math.hypot(dx,dy),mx=dx/len*SPEED*sl,my=dy/len*SPEED*sl,ox=G.px,oy=G.py;
        if(!dwBlocked(G.px+mx,G.py))G.px+=mx;
        else if(!dy){for(let o=1;o<=7;o++){if(!dwBlocked(G.px+mx,G.py-o)){if(!dwBlocked(G.px,G.py-SPEED))G.py-=SPEED;break;}if(!dwBlocked(G.px+mx,G.py+o)){if(!dwBlocked(G.px,G.py+SPEED))G.py+=SPEED;break;}}}
        if(!dwBlocked(G.px,G.py+my))G.py+=my;
        else if(!dx){for(let o=1;o<=7;o++){if(!dwBlocked(G.px-o,G.py+my)){if(!dwBlocked(G.px-SPEED,G.py))G.px-=SPEED;break;}if(!dwBlocked(G.px+o,G.py+my)){if(!dwBlocked(G.px+SPEED,G.py))G.px+=SPEED;break;}}}
        const moved=G.px!==ox||G.py!==oy;
        if(Math.abs(dy)>Math.abs(dx))G.dir=dy>0?'down':'up';else G.dir=dx>0?'right':'left';
        G.frame=Math.floor(mapFrame/8)%4;
        if(mapFrame%16===0)sfxStep();
        if(moved){G.trail.push([G.px,G.py]);if(G.trail.length>80)G.trail.shift();}
      }else G.frame=0;
      dwUpdateCompanion();
      checkAltarProximity();
      G.nearNpc=!!D.npc&&Math.hypot(G.px-D.npc.x,G.py-D.npc.y)<36;
      G.nearChest=!!CHEST&&!G.chestOpen&&Math.hypot(G.px-CHEST.x,G.py-(CHEST.y+6))<30;
      if(G.altarsLit>=10&&dwHasBelt()&&G.py<D.gateY){G.phase='bossIntro';stopLoop();triggerBossIntro();return;}
    }else if(G.phase==='itemGet'){G.itemT++;}
    const camX=Math.round(Math.max(0,Math.min(DWS.W-640,G.px-320)));
    const camY=Math.round(Math.max(-TOP,Math.min(DWS.H-480,G.py-TOP-225)));
    owCtx.clearRect(0,0,640,480);
    owCtx.drawImage(DWS.ground,-camX,-camY);
    dwAnimWater(owCtx,camX,camY);
    (D.light||dwDrawLight)(owCtx,camX,camY);

    spCtx.clearRect(0,0,640,480);
    const list=[];
    DWS.objects.forEach(o=>{const sx=o.x-camX,sy=o.y-camY;if(sx>-o.cv.width&&sx<640&&sy>-o.cv.height&&sy<480)list.push({base:o.base,draw:()=>spCtx.drawImage(o.cv,sx,sy)});});
    G.altarData.forEach((a,i)=>{const sx=a.x-camX,sy=a.y-camY;if(sx>-40&&sx<680&&sy>-40&&sy<520)list.push({base:a.y+6,draw:()=>drawAltarAt(spCtx,a,i,sx,sy)});});
    list.push({base:64,draw:()=>dwDrawWicket(spCtx,456-camX,48-camY)});
    if(D.npc)list.push({base:D.npc.y,draw:()=>dwDrawHelp(spCtx,D.npc.x-camX,D.npc.y-camY,mapFrame,D.npc.robe)});
    if(CHEST)list.push({base:CHEST.y,draw:()=>(CHEST.draw||dwDrawChest)(spCtx,CHEST.x-camX,CHEST.y-camY,mapFrame)});
    list.push({base:G.companion.py,draw:()=>drawCompanionSprite(spCtx,Math.round(G.companion.px-camX)-7,Math.round(G.companion.py-camY)-8)});
    list.push({base:G.py+0.5,draw:()=>dwDrawPlayer(spCtx,Math.round(G.px-camX),Math.round(G.py-camY))});
    list.sort((a,b)=>a.base-b.base).forEach(o=>o.draw());
    dwSmoke(spCtx,camX,camY);
    const psy=G.py-camY,touch='ontouchstart' in window;
    if(G.phase==='itemGet')dwDrawItemGet(spCtx,Math.round(G.px-camX),Math.round(psy),G.itemT);
    else if(G.nearAltar&&!G.nearAltar.lit)drawPrayPrompt(spCtx,psy);
    else if(G.nearChest){
      if(G.altarsLit>=CHEST_NEED)drawPromptBox(spCtx,psy,CHEST.label||'A treasure chest!',CHEST.text||'Something shines inside…',(touch?'TAP':'SPACE')+' '+(CHEST.action||'to open ▶'));
      else drawPromptBox(spCtx,psy,'Evangelist says:',(CHEST.locked||'"Light '+CHEST_NEED+' altars to open this chest."')+' ('+G.altarsLit+'/'+CHEST_NEED+')','');
    }
    else if(G.nearNpc)drawPromptBox(spCtx,psy,D.npc.name+' says:',D.npc.line,'');
    else if(D.item&&G.altarsLit>=10&&!dwHasBelt()&&G.py<120)drawPromptBox(spCtx,psy,'Evangelist says:',D.item.gateMsg,'');
    drawMapHUDNew(spCtx);
  }
  loop();
}

// ===============================
// MAP LOOP
// ===============================
function stopLoop(){if(loopId){cancelAnimationFrame(loopId);loopId=null;}}

function startMapLoop(){
  if(DENSE[G.wIdx]){startDenseLoop();return;}
  tiles=buildTiles(G.wIdx);
  stopLoop();
  const owCv=document.getElementById('owCv'),spCv=document.getElementById('spCv');
  const owCtx=owCv.getContext('2d'),spCtx=spCv.getContext('2d');
  owCtx.imageSmoothingEnabled=false;spCtx.imageSmoothingEnabled=false;
  const T=16,SPEED=2.2,w=WORLDS[G.wIdx];
  // Clear held keys on start
  keys.up=keys.down=keys.left=keys.right=false;
  let last=0;
  function loop(now){
    loopId=requestAnimationFrame(loop);
    if(now&&now-last<15.5)return;
    last=now||0;
    if(G.paused)return;
    mapFrame++;
    if(G.phase==='walk'){
      // Movement
      const dx=(keys.right?1:0)-(keys.left?1:0);
      const dy=(keys.down?1:0)-(keys.up?1:0);
      if(dx!==0||dy!==0){
        const len=Math.sqrt(dx*dx+dy*dy);
        const mx=dx/len*SPEED,my=dy/len*SPEED;
        // X axis movement with collision
        const nx=G.px+mx;
        if(!isSolid(nx,G.py,T))G.px=nx;
        // Y axis movement with collision
        const ny=G.py+my;
        if(!isSolid(G.px,ny,T))G.py=ny;
        // Direction from dominant axis
        if(Math.abs(dy)>Math.abs(dx))G.dir=dy>0?'down':'up';
        else G.dir=dx>0?'right':'left';
        G.frame=Math.floor(mapFrame/8)%4;
        if(mapFrame%16===0)sfxStep();
      }else{G.frame=0;}
      // Clamp to map
      G.px=Math.max(10,Math.min(630,G.px));
      G.py=Math.max(36,Math.min(408,G.py));
      updateCompanion();
      checkAltarProximity();
      // Boss gate trigger: altarsLit >= 10 and walk to top
      if(G.altarsLit>=10&&G.py<40){
        G.phase='bossIntro';stopLoop();triggerBossIntro();return;
      }
    }
    // Camera: map is 640×416, viewport 640×480, center map vertically (+32)
    const camX=0,camY=-32;
    owCtx.clearRect(0,0,640,480);
    drawTiles(owCtx,w,camX,camY,T);
    drawAltarsOnMap(owCtx,camX,camY);
    drawBossGate(owCtx,camX,camY);
    spCtx.clearRect(0,0,640,480);
    drawMapHUDNew(spCtx);
    drawCompanionSprite(spCtx,G.companion.px-camX,G.companion.py-camY);
    drawPilgrimMapDir(spCtx,G.px-camX,G.py-camY,G.armorEarned,G.frame,G.dir,G.burden);
    drawPrayPrompt(spCtx,G.py-camY);
  }
  loop();
}

// ── 16-BIT LTTP TILE RENDERER ────────────────────────────────
function tHash(x,y){return((x*73856093)^(y*19349663))>>>0;}

function drawTiles(ctx,w,cx,cy,T){
  const rows=tiles.length,cols=tiles[0].length;
  // Pass 1: ground layer (G, P, R, S, F)
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const tx=c*T-cx,ty=r*T-cy;
      if(tx<-T*2||tx>640+T||ty<-T*2||ty>480+T)continue;
      const t=tiles[r][c],h=tHash(c,r);
      if(t==='G')tGrass(ctx,tx,ty,w,h);
      else if(t==='P')tPath(ctx,tx,ty,w,h);
      else if(t==='R')tRiver(ctx,tx,ty,w,h);
      else if(t==='S')tStone(ctx,tx,ty,w,h);
      else if(t==='F')tFarm(ctx,tx,ty,w,h);
      else if(t==='B'||t==='H'||t==='X')tGrass(ctx,tx,ty,w,h); // grass under
    }
  }
  // Pass 2: landmarks (draw big sprites at anchor tiles only)
  const drawn=new Set();
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const tx=c*T-cx,ty=r*T-cy;
      if(tx<-T*6||tx>640+T*6||ty<-T*6||ty>480+T*6)continue;
      const t=tiles[r][c];
      const key=`${r},${c}`;
      if(drawn.has(key))continue;
      if(t==='B'){drawn.add(key);tBushCluster(ctx,tx,ty,w,tHash(c,r));}
      else if(t==='H'){drawn.add(key);tHouse(ctx,tx,ty,w);}
      else if(t==='X'){drawn.add(key);tLandmark(ctx,tx,ty,w,tHash(c,r));}
      // Single trees on remaining grass borders
      else if(t==='G'&&tHash(c,r)%11===0){tTree(ctx,tx,ty,w,tHash(c,r));}
    }
  }
}

function shiftCol(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,((n>>16)&255)+amt));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  const b=Math.max(0,Math.min(255,(n&255)+amt));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ── GRASS ─────────────────────────────────────────────────────
function tGrass(ctx,x,y,w,h){
  const base=w.ground,lite=shiftCol(base,28),mid=shiftCol(base,10),dark=shiftCol(base,-20),xdark=shiftCol(base,-38);
  ctx.fillStyle=base;ctx.fillRect(x,y,16,16);
  const pat=h%6;
  if(pat===0){ctx.fillStyle=mid;ctx.fillRect(x,y,8,8);ctx.fillStyle=dark;ctx.fillRect(x+8,y+8,8,8);}
  else if(pat===1){ctx.fillStyle=lite;ctx.fillRect(x+2,y+2,5,4);ctx.fillStyle=dark;ctx.fillRect(x+9,y+10,5,4);}
  else if(pat===2){ctx.fillStyle=mid;ctx.fillRect(x+4,y,8,16);}
  else if(pat===3){ctx.fillStyle=lite;ctx.fillRect(x,y,16,5);ctx.fillStyle=dark;ctx.fillRect(x,y+13,16,3);}
  else if(pat===4){ctx.fillStyle=mid;ctx.fillRect(x,y,8,16);ctx.fillStyle=dark;ctx.fillRect(x+8,y,8,8);}
  else{ctx.fillStyle=lite;ctx.fillRect(x+6,y+6,5,5);ctx.fillStyle=dark;ctx.fillRect(x+1,y+11,4,4);}
  // highlights/shadows
  ctx.fillStyle=lite;ctx.fillRect(x,y,16,1);ctx.fillRect(x,y,1,16);
  ctx.fillStyle=xdark;ctx.fillRect(x,y+15,16,1);ctx.fillRect(x+15,y,1,16);
  // cross detail (like screenshot)
  if(h%5===0){ctx.fillStyle=dark;ctx.fillRect(x+7,y+4,2,8);ctx.fillRect(x+4,y+7,8,2);}
  // grass blades
  const bl=shiftCol(base,18);
  if(h%4===0){ctx.fillStyle=bl;ctx.fillRect(x+3,y+5,1,3);ctx.fillRect(x+8,y+2,1,4);ctx.fillRect(x+13,y+7,1,3);}
  // world-flavored flower dot
  if(h%9===0){const fc=w.id===0?'#f0e040':w.id===1?'#402808':w.id===2?'#e07020':w.id===3?'#c0a030':w.id===4?'#20d870':'#ffe040';ctx.fillStyle=fc;ctx.fillRect(x+6,y+7,2,2);ctx.fillRect(x+7,y+5,1,2);ctx.fillRect(x+5,y+8,2,1);ctx.fillRect(x+8,y+8,2,1);}
}

// ── PATH (2-tile wide, rich stone) ────────────────────────────
function tPath(ctx,x,y,w,h){
  const base=w.path,lite=shiftCol(base,32),mid=shiftCol(base,14),dark=shiftCol(base,-28),xdark=shiftCol(base,-48);
  ctx.fillStyle=base;ctx.fillRect(x,y,16,16);
  // offset brick pattern
  if(h%2===0){
    ctx.fillStyle=mid;ctx.fillRect(x+1,y+1,7,6);ctx.fillRect(x+9,y+9,6,5);
    ctx.fillStyle=dark;ctx.fillRect(x+9,y+1,6,6);ctx.fillRect(x+1,y+9,7,5);
  }else{
    ctx.fillStyle=mid;ctx.fillRect(x+1,y+9,7,5);ctx.fillRect(x+9,y+1,6,6);
    ctx.fillStyle=dark;ctx.fillRect(x+1,y+1,7,6);ctx.fillRect(x+9,y+9,6,5);
  }
  // mortar lines
  ctx.fillStyle=xdark;ctx.fillRect(x,y+7,16,2);ctx.fillRect(x+7,y,2,7);ctx.fillRect(x+8,y+9,2,7);
  // edge highlights
  ctx.fillStyle=lite;ctx.fillRect(x,y,16,1);ctx.fillRect(x,y,1,16);
  ctx.fillStyle=xdark;ctx.fillRect(x,y+15,16,1);ctx.fillRect(x+15,y,1,16);
  // pebble
  if(h%5===0){ctx.fillStyle=shiftCol(base,-12);ctx.fillRect(x+3,y+3,2,2);ctx.fillRect(x+11,y+11,3,2);}
  if(h%7===0){ctx.fillStyle=lite;ctx.fillRect(x+10,y+4,2,2);}
}

// ── RIVER (world-specific fluid) ──────────────────────────────
function tRiver(ctx,x,y,w,h){
  const wv=mapFrame%40<20?0:1;
  let base,lite,dark,foam;
  switch(w.id){
    case 0:base='#2868d0';lite='#5090f0';dark='#1848a0';foam='rgba(200,220,255,0.55)';break; // blue river
    case 1:base='#8c1400';lite='#cc3010';dark='#500800';foam='rgba(255,120,60,0.45)';break;  // lava
    case 2:base='#2868d0';lite='#60a0ff';dark='#1848a0';foam='rgba(200,230,255,0.55)';break; // river
    case 3:base='#404848';lite='#606870';dark='#202828';foam='rgba(180,200,200,0.4)';break;  // chasm/void
    case 4:base='#1878d8';lite='#40a8f8';dark='#0848a8';foam='rgba(180,220,255,0.6)';break;  // deep water
    default:base='#d0a820';lite='#f0d040';dark='#907010';foam='rgba(255,240,150,0.5)';        // golden river
  }
  ctx.fillStyle=base;ctx.fillRect(x,y,16,16);
  // depth bands
  ctx.fillStyle=dark;ctx.fillRect(x,y+12,16,4);
  ctx.fillStyle=shiftCol(base,-8);ctx.fillRect(x,y+8,16,4);
  // animated ripples
  ctx.fillStyle=lite;
  const r1y=y+2+wv*3,r2y=y+10-wv*2;
  ctx.fillRect(x+1,r1y,5,1);ctx.fillRect(x+8,r1y,4,1);ctx.fillRect(x+13,r1y,2,1);
  ctx.fillRect(x+3,r2y,4,1);ctx.fillRect(x+10,r2y,5,1);
  // foam edge top
  ctx.fillStyle=foam;ctx.fillRect(x,y,16,3);
  // shimmer
  if((h+mapFrame)%6<2){ctx.fillStyle='rgba(255,255,255,0.65)';ctx.fillRect(x+(h%10)+2,y+5,1,1);}
  // lava glow for world 1
  if(w.id===1&&mapFrame%20<10){ctx.fillStyle='rgba(255,180,0,0.18)';ctx.fillRect(x,y,16,16);}
}

// ── STONE PATCH ───────────────────────────────────────────────
function tStone(ctx,x,y,w,h){
  const base=w.id===3?'#504840':w.id===1?'#2a1818':'#707880';
  const lite=shiftCol(base,22),dark=shiftCol(base,-22);
  ctx.fillStyle=base;ctx.fillRect(x,y,16,16);
  // cobblestone pattern
  if(h%3===0){
    ctx.fillStyle=lite;ctx.fillRect(x+1,y+1,6,6);ctx.fillRect(x+9,y+9,6,5);
    ctx.fillStyle=dark;ctx.fillRect(x+9,y+1,6,6);ctx.fillRect(x+1,y+9,6,5);
  }else if(h%3===1){
    ctx.fillStyle=lite;ctx.fillRect(x+1,y+1,14,6);
    ctx.fillStyle=dark;ctx.fillRect(x+1,y+9,14,5);
  }else{
    ctx.fillStyle=lite;ctx.fillRect(x+1,y+1,6,14);
    ctx.fillStyle=dark;ctx.fillRect(x+9,y+1,6,14);
  }
  ctx.fillStyle=dark;ctx.fillRect(x,y+7,16,2);ctx.fillRect(x+7,y,2,16);
  ctx.fillStyle=lite;ctx.fillRect(x,y,16,1);ctx.fillRect(x,y,1,16);
  ctx.fillStyle=shiftCol(base,-35);ctx.fillRect(x,y+15,16,1);ctx.fillRect(x+15,y,1,16);
}

// ── FARM/CROP FIELD ───────────────────────────────────────────
function tFarm(ctx,x,y,w,h){
  const base1=shiftCol(w.ground,-18),base2=shiftCol(w.ground,8);
  // alternating dark/light row stripes
  const row=Math.floor(y/16);
  ctx.fillStyle=row%2===0?base1:base2;ctx.fillRect(x,y,16,16);
  ctx.fillStyle=row%2===0?base2:base1;
  ctx.fillRect(x,y,16,3);ctx.fillRect(x,y+5,16,3);ctx.fillRect(x,y+11,16,3);
  // crop dots
  ctx.fillStyle=shiftCol(w.ground,30);
  if(h%3===0){ctx.fillRect(x+2,y+1,2,2);ctx.fillRect(x+7,y+7,2,2);ctx.fillRect(x+12,y+13,2,2);}
  if(h%4===0){ctx.fillRect(x+5,y+3,2,2);ctx.fillRect(x+11,y+9,2,2);}
}

// ── BUSH CLUSTER (3-tile wide round blob) ────────────────────
function tBushCluster(ctx,x,y,w,h){
  // Use world canopy colors
  let c1,c2,c3,c4;
  switch(w.id){
    case 0:c1='#1a6010';c2='#28901c';c3='#3ab828';c4='#58e040';break;
    case 1:c1='#0a1a06';c2='#101e08';c3='#182810';c4='#203018';break;
    case 2:c1='#2a5808';c2='#408010';c3='#58a818';c4='#78d020';break;
    case 3:c1='#404018';c2='#585820';c3='#707030';c4='#909050';break;
    case 4:c1='#086028';c2='#108838';c3='#18b050';c4='#30d068';break;
    default:c1='#207030';c2='#30a040';c3='#40c850';c4='#60e870';
  }
  const T=16;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();ctx.ellipse(x+T*1.4,y+T*1.8,T*1.3,T*0.45,0,0,Math.PI*2);ctx.fill();

  // Three overlapping round blobs forming the cluster
  function blob(bx,by,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();}

  // Back blobs (darker)
  blob(x+T*0.9, y+T*1.1, T*0.75, c1);
  blob(x+T*2.0, y+T*1.1, T*0.75, c1);
  blob(x+T*1.45,y+T*0.7, T*0.72, c1);
  // Mid blobs
  blob(x+T*0.85,y+T*1.0, T*0.70, c2);
  blob(x+T*1.98,y+T*1.0, T*0.70, c2);
  blob(x+T*1.42,y+T*0.65,T*0.68, c2);
  // Front highlight blobs
  blob(x+T*0.82,y+T*0.92,T*0.58, c3);
  blob(x+T*1.95,y+T*0.92,T*0.58, c3);
  blob(x+T*1.40,y+T*0.58,T*0.56, c3);
  // Top sheen
  blob(x+T*0.78,y+T*0.82,T*0.34, c4);
  blob(x+T*1.90,y+T*0.82,T*0.34, c4);
  blob(x+T*1.38,y+T*0.50,T*0.32, c4);

  // Gold flower dots on bush
  ctx.fillStyle='#f8c840';
  ctx.beginPath();ctx.arc(x+T*0.7, y+T*1.1,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+T*1.4, y+T*0.55,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+T*2.1, y+T*1.0, 3,0,Math.PI*2);ctx.fill();
  // Tiny trunk stubs
  ctx.fillStyle='#6a3810';
  ctx.fillRect(x+T*0.78,y+T*1.65,5,6);
  ctx.fillRect(x+T*1.88,y+T*1.65,5,6);
}

// ── TREE (single, sparse) ────────────────────────────────────
function tTree(ctx,x,y,w,h){
  let c1,c2,c3,c4,tr1,tr2;
  switch(w.id){
    case 0:c1='#145210';c2='#1e7018';c3='#30a020';c4='#50c838';tr1='#6a3810';tr2='#885020';break;
    case 1:c1='#0a1a06';c2='#142808';c3='#1e3a10';c4='#284e18';tr1='#2a1808';tr2='#3a2010';break;
    case 2:c1='#486010';c2='#608018';c3='#88a820';c4='#a8c828';tr1='#604020';tr2='#805030';break;
    case 3:c1='#505020';c2='#707030';c3='#909040';c4='#b0b050';tr1='#604830';tr2='#806040';break;
    case 4:c1='#086030';c2='#108840';c3='#18b050';c4='#30d868';tr1='#205030';tr2='#308040';break;
    default:c1='#188028';c2='#28b040';c3='#40d060';c4='#60e880';tr1='#806040';tr2='#a08050';
  }
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+8,y+15,7,2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=tr1;ctx.fillRect(x+5,y+10,6,7);ctx.fillStyle=tr2;ctx.fillRect(x+6,y+10,3,6);
  ctx.fillStyle=c1;ctx.fillRect(x,y+10,16,4);
  ctx.fillStyle=c2;ctx.fillRect(x+1,y+7,14,5);ctx.fillStyle=c1;ctx.fillRect(x+1,y+7,1,4);ctx.fillRect(x+14,y+7,1,4);
  ctx.fillStyle=c3;ctx.fillRect(x+2,y+4,12,5);ctx.fillStyle=c2;ctx.fillRect(x+2,y+4,1,4);ctx.fillRect(x+13,y+4,1,4);
  ctx.fillStyle=c3;ctx.fillRect(x+4,y+1,8,5);ctx.fillStyle=c4;ctx.fillRect(x+5,y+1,6,4);ctx.fillStyle=c4;ctx.fillRect(x+6,y,4,3);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(x+4,y+2,4,3);
}

// ── HOUSE (multi-tile building, 5×3 tiles) ────────────────────
function tHouse(ctx,x,y,w){
  const T=16;
  const W=5*T, H=3*T; // 80×48 px

  // World-specific house style
  let wallC,wallH,roofC,roofH,roofD,winC,doorC,trimC;
  switch(w.id){
    case 0:wallC='#c8b070';wallH='#e0c888';roofC='#882018';roofH='#b02820';roofD='#601010';winC='#90c8f0';doorC='#603010';trimC='#a08040';break;
    case 1:wallC='#302820';wallH='#402e24';roofC='#180c08';roofH='#281408';roofD='#100806';winC='#ff6020';doorC='#180c06';trimC='#241808';break;
    case 2:wallC='#c8b888';wallH='#e0d0a0';roofC='#506030';roofH='#708040';roofD='#304020';winC='#a0c8e0';doorC='#5a3818';trimC='#908060';break;
    case 3:wallC='#807060';wallH='#a09080';roofC='#504038';roofH='#685448';roofD='#382820';winC='#c0d8e0';doorC='#3a2818';trimC='#605040';break;
    case 4:wallC='#a8b870';wallH='#c0d080';roofC='#205840';roofH='#288050';roofD='#103828';winC='#80e0f0';doorC='#183020';trimC='#608050';break;
    default:wallC='#e0d090';wallH='#f0e0a8';roofC='#c0a020';roofH='#e0c030';roofD='#908010';winC='#ffffa0';doorC='#806000';trimC='#c0a828';
  }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x+4,y+H-2,W,6);

  // Foundation
  ctx.fillStyle=shiftCol(wallC,-30);ctx.fillRect(x,y+H-8,W,8);

  // Walls
  ctx.fillStyle=wallC;ctx.fillRect(x,y+T,W,H-T-8);
  ctx.fillStyle=wallH;ctx.fillRect(x+2,y+T+2,W-4,8);// highlight band

  // Roof (triangular, 2 slopes)
  // Left slope
  ctx.fillStyle=roofH;
  for(let i=0;i<T+4;i++){
    const rw=W-i*2;
    ctx.fillRect(x+i,y+T-i,rw,2);
  }
  ctx.fillStyle=roofC;
  for(let i=0;i<T+4;i++){
    const rw=W-i*2;
    ctx.fillRect(x+i+rw/2-2,y+T-i,2,2);// ridge
  }
  // Roof dark underside / eave
  ctx.fillStyle=roofD;ctx.fillRect(x-2,y+T,W+4,4);
  ctx.fillStyle=shiftCol(roofD,20);ctx.fillRect(x,y+T,W,2);

  // Chimney
  ctx.fillStyle=shiftCol(wallC,-20);ctx.fillRect(x+W-20,y+T-22,10,20);
  ctx.fillStyle=shiftCol(wallC,-35);ctx.fillRect(x+W-22,y+T-24,14,4);
  // smoke puff
  ctx.fillStyle='rgba(180,180,190,0.5)';ctx.beginPath();ctx.arc(x+W-15,y+T-28,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+W-12,y+T-34,3,0,Math.PI*2);ctx.fill();

  // Windows (2)
  const winY=y+T+10;
  function window_(wx){
    ctx.fillStyle=shiftCol(trimC,-10);ctx.fillRect(wx-2,winY-2,18,18);
    ctx.fillStyle=winC;ctx.fillRect(wx,winY,14,14);
    ctx.fillStyle='rgba(255,255,200,0.3)';ctx.fillRect(wx+1,winY+1,6,6);// glare
    ctx.fillStyle=shiftCol(winC,-30);ctx.fillRect(wx+7,winY,1,14);ctx.fillRect(wx,winY+7,14,1);
    // sill
    ctx.fillStyle=trimC;ctx.fillRect(wx-2,winY+14,18,3);
  }
  window_(x+8);window_(x+W-26);

  // Door (centered)
  const dx=x+Math.floor(W/2)-8;
  ctx.fillStyle=shiftCol(trimC,-10);ctx.fillRect(dx-2,y+H-28,20,28);
  ctx.fillStyle=doorC;ctx.fillRect(dx,y+H-26,16,26);
  ctx.fillStyle=shiftCol(doorC,30);ctx.fillRect(dx+1,y+H-25,7,12);// highlight panel
  ctx.fillStyle='#f8c840';ctx.beginPath();ctx.arc(dx+13,y+H-14,2,0,Math.PI*2);ctx.fill();// knob
  // door arch
  ctx.fillStyle=shiftCol(trimC,10);
  ctx.beginPath();ctx.arc(dx+8,y+H-26,10,Math.PI,0);ctx.fill();
  ctx.fillStyle=doorC;ctx.beginPath();ctx.arc(dx+8,y+H-26,8,Math.PI,0);ctx.fill();

  // Wall texture lines
  ctx.fillStyle=shiftCol(wallC,-12);
  for(let wy=y+T+6;wy<y+H-8;wy+=8)ctx.fillRect(x+2,wy,W-4,1);
}

// ── LANDMARK (world-specific: cross/ruin/well/altar/pillar) ──
function tLandmark(ctx,x,y,w,h){
  const T=16;
  switch(w.id){
    case 0: tLandmarkWell(ctx,x,y,T); break;
    case 1: tLandmarkRuin(ctx,x,y,T,h); break;
    case 2: tLandmarkCross(ctx,x,y,T); break;
    case 3: tLandmarkAltar(ctx,x,y,T); break;
    case 4: tLandmarkWell(ctx,x,y,T); break;
    case 5: tLandmarkPillar(ctx,x,y,T); break;
    default: tLandmarkCross(ctx,x,y,T);
  }
}

function tLandmarkCross(ctx,x,y,T){
  // Large stone cross, 2×3 tiles
  const cx=x+T,cy=y;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(cx+4,cy+3*T-6,24,8);
  // base
  ctx.fillStyle='#807060';ctx.fillRect(cx,cy+2*T+4,24,16);
  ctx.fillStyle='#a09080';ctx.fillRect(cx+2,cy+2*T+4,20,6);
  // vertical beam
  ctx.fillStyle='#909888';ctx.fillRect(cx+8,cy,8,2*T+8);
  ctx.fillStyle='#b0b8a8';ctx.fillRect(cx+9,cy+2,5,2*T+4);
  ctx.fillStyle='#707868';ctx.fillRect(cx+14,cy,2,2*T+8);
  // horizontal beam
  ctx.fillStyle='#909888';ctx.fillRect(cx,cy+T-4,24,10);
  ctx.fillStyle='#b0b8a8';ctx.fillRect(cx+2,cy+T-3,20,5);
  ctx.fillStyle='#707868';ctx.fillRect(cx,cy+T+3,24,3);
}

function tLandmarkWell(ctx,x,y,T){
  // Stone well, 2×2 tiles
  const cx=x+4,cy=y+6;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(cx+2,cy+T+16,28,6);
  // well base (stone ring)
  ctx.fillStyle='#909090';ctx.fillRect(cx,cy+12,28,16);
  ctx.fillStyle='#b0b0b0';ctx.fillRect(cx+2,cy+12,24,6);
  ctx.fillStyle='#707070';ctx.fillRect(cx,cy+20,28,8);
  // stone blocks
  ctx.fillStyle='#808080';ctx.fillRect(cx+7,cy+12,2,16);ctx.fillRect(cx+14,cy+12,2,16);ctx.fillRect(cx+21,cy+12,2,16);
  // roof posts
  ctx.fillStyle='#6a4020';ctx.fillRect(cx+2,cy,4,14);ctx.fillRect(cx+22,cy,4,14);
  // roof
  ctx.fillStyle='#882018';ctx.fillRect(cx-2,cy-2,32,6);
  ctx.fillStyle='#b02820';ctx.fillRect(cx,cy-2,28,4);
  // crossbar + rope
  ctx.fillStyle='#a06030';ctx.fillRect(cx+4,cy+2,20,3);
  ctx.fillStyle='#604010';ctx.fillRect(cx+13,cy+5,2,8);
  // bucket
  ctx.fillStyle='#806040';ctx.fillRect(cx+10,cy+11,6,5);
  ctx.fillStyle='#a08060';ctx.fillRect(cx+11,cy+11,4,3);
}

function tLandmarkRuin(ctx,x,y,T,h){
  // Crumbling ruin wall, 3×2 tiles
  const cx=x,cy=y+4;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(cx+4,cy+2*T-4,40,8);
  // rubble on ground
  ctx.fillStyle='#302820';
  for(let i=0;i<6;i++)ctx.fillRect(cx+i*7+2,cy+2*T-8,(h+i)%4+3,(h+i)%3+2);
  // left broken wall section
  ctx.fillStyle='#3a2818';ctx.fillRect(cx,cy,14,2*T);
  ctx.fillStyle='#4a3020';ctx.fillRect(cx+2,cy+2,10,8);
  ctx.fillStyle='#2a1810';ctx.fillRect(cx,cy,14,3);
  // cracks
  ctx.fillStyle='#1a1008';ctx.fillRect(cx+5,cy+8,1,16);ctx.fillRect(cx+9,cy+4,1,12);
  // right broken stub
  ctx.fillStyle='#3a2818';ctx.fillRect(cx+28,cy+T-4,18,T+4);
  ctx.fillStyle='#2a1810';ctx.fillRect(cx+28,cy+T-4,18,3);
  ctx.fillStyle='#1a1008';ctx.fillRect(cx+35,cy+T,1,T);
  // vine/moss
  ctx.fillStyle='#1a3808';ctx.fillRect(cx+2,cy+T,3,T-4);ctx.fillRect(cx+30,cy+T+4,3,8);
}

function tLandmarkAltar(ctx,x,y,T){
  // Stone altar with flame, 2×2 tiles
  const cx=x+4,cy=y+8;
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(cx,cy+T+14,28,7);
  // altar base
  ctx.fillStyle='#706050';ctx.fillRect(cx,cy+T-2,28,18);
  ctx.fillStyle='#908070';ctx.fillRect(cx+2,cy+T-2,24,6);
  ctx.fillStyle='#504038';ctx.fillRect(cx,cy+T+10,28,6);
  // step blocks
  ctx.fillStyle='#807060';ctx.fillRect(cx+7,cy+T-2,2,18);ctx.fillRect(cx+19,cy+T-2,2,18);
  // top slab
  ctx.fillStyle='#c0a878';ctx.fillRect(cx-2,cy+T-8,32,8);
  ctx.fillStyle='#d8c090';ctx.fillRect(cx,cy+T-6,28,4);
  // flame
  ctx.fillStyle='#ff8020';ctx.fillRect(cx+9,cy+T-22,10,16);
  ctx.fillStyle='#ffb030';ctx.fillRect(cx+11,cy+T-24,6,16);
  ctx.fillStyle='#ffe060';ctx.fillRect(cx+13,cy+T-26,4,14);
  ctx.fillStyle='rgba(255,160,0,0.3)';ctx.beginPath();ctx.arc(cx+14,cy+T-18,10,0,Math.PI*2);ctx.fill();
}

function tLandmarkPillar(ctx,x,y,T){
  // Two golden pillars with arch, 3×3 tiles
  const cx=x,cy=y;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(cx+4,cy+3*T-4,40,8);
  // Left pillar
  function pillar(px){
    ctx.fillStyle='#a08020';ctx.fillRect(px,cy+8,14,3*T-12);
    ctx.fillStyle='#c8a030';ctx.fillRect(px+2,cy+8,9,3*T-12);
    ctx.fillStyle='#e8c840';ctx.fillRect(px+3,cy+10,5,3*T-16);
    // capital
    ctx.fillStyle='#b09028';ctx.fillRect(px-2,cy+4,18,6);
    ctx.fillStyle='#d8b838';ctx.fillRect(px,cy+4,14,4);
    // base
    ctx.fillStyle='#b09028';ctx.fillRect(px-2,cy+3*T-12,18,8);
    ctx.fillStyle='#d8b838';ctx.fillRect(px,cy+3*T-10,14,4);
  }
  pillar(cx+4);pillar(cx+30);
  // Arch connecting
  ctx.fillStyle='#a08020';
  for(let i=0;i<22;i++){
    const ay=cy+4-Math.round(Math.sqrt(Math.max(0,11*11-(i-11)*(i-11)))*0.6);
    ctx.fillRect(cx+16+i,ay,2,6);
  }
  ctx.fillStyle='#e8c840';
  for(let i=2;i<20;i++){
    const ay=cy+4-Math.round(Math.sqrt(Math.max(0,10*10-(i-11)*(i-11)))*0.6);
    ctx.fillRect(cx+16+i,ay+2,2,2);
  }
  // Stars/glow
  ctx.fillStyle='rgba(255,240,80,0.35)';
  ctx.beginPath();ctx.arc(cx+23,cy-4,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,180,0.6)';ctx.fillRect(cx+22,cy-5,2,2);
}

function drawAltarsOnMap(ctx,camX,camY){
  G.altarData.forEach((alt,i)=>{
    if(!alt)return;
    const sx=alt.x-camX,sy=alt.y-camY;
    if(sx<-40||sx>680||sy<-40||sy>520)return;
    drawAltarAt(ctx,alt,i,sx,sy);
  });
}
function drawAltarAt(ctx,alt,i,sx,sy){
  {
    alt.animT=(alt.animT||0)+0.06;
    const bob=Math.sin(alt.animT)*2;
    // Glow
    if(alt.lit){
      ctx.fillStyle='rgba(255,255,100,0.3)';ctx.beginPath();ctx.arc(sx,sy-6+bob,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,180,0.15)';ctx.beginPath();ctx.arc(sx,sy-6+bob,28,0,Math.PI*2);ctx.fill();
    }else{
      const g=0.3+Math.sin(alt.animT*1.4)*0.15;
      ctx.fillStyle=`rgba(180,160,60,${g})`;ctx.beginPath();ctx.arc(sx,sy-4+bob,12,0,Math.PI*2);ctx.fill();
    }
    // Stone base
    ctx.fillStyle=alt.lit?'#b09030':'#706050';ctx.fillRect(sx-8,sy,16,6);
    ctx.fillStyle=alt.lit?'#d8b840':'#90807a';ctx.fillRect(sx-7,sy,14,3);
    // Candle/flame
    ctx.fillStyle='#d0c0a0';ctx.fillRect(sx-2,sy-10+bob,4,10);// candle
    if(alt.lit){
      ctx.fillStyle=`rgba(255,${140+Math.floor(Math.sin(alt.animT*3)*60)},0,0.9)`;
      ctx.beginPath();ctx.arc(sx,sy-12+bob,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe080';ctx.beginPath();ctx.arc(sx,sy-13+bob,3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#c08040';ctx.fillRect(sx-1,sy-11+bob,2,2);// unlit wick
    }
    // Number badge
    const isNear=(G.nearAltar===alt);
    ctx.fillStyle=alt.lit?'rgba(0,50,0,0.9)':isNear?'rgba(20,20,80,0.9)':'rgba(0,0,30,0.75)';
    ctx.beginPath();ctx.arc(sx+11,sy-14,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=alt.lit?'#60ff60':isNear?'#ffffff':'#c0c8ff';
    ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(alt.lit?'✓':(i+1),sx+11,sy-10);
  }
}

function drawBossGate(ctx,camX,camY){
  // Boss gate at top-center of map (row 0-2, col 18-22)
  const gx=18*16-camX,gy=0-camY;
  const open=G.altarsLit>=10;
  const gw=4*16,gh=2*16;
  if(open){
    // Open golden gate with glow
    ctx.fillStyle='rgba(255,230,50,0.25)';ctx.fillRect(gx-8,gy,gw+16,gh+16);
    ctx.fillStyle='#f8c840';ctx.fillRect(gx,gy,4,gh);// left pillar
    ctx.fillStyle='#d0a820';ctx.fillRect(gx+2,gy+2,2,gh-4);
    ctx.fillStyle='#f8c840';ctx.fillRect(gx+gw-4,gy,4,gh);// right pillar
    ctx.fillStyle='#d0a820';ctx.fillRect(gx+gw-4,gy+2,2,gh-4);
    ctx.fillStyle='#f8c840';ctx.fillRect(gx,gy,gw,4);// top arch
    ctx.fillStyle='rgba(255,240,80,0.6)';ctx.beginPath();ctx.arc(gx+gw/2,gy+2,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('ENTER',gx+gw/2,gy+gh/2+3);
  }else{
    // Closed iron gate
    ctx.fillStyle='#404040';ctx.fillRect(gx,gy,gw,gh);
    ctx.fillStyle='#505050';
    for(let gbi=0;gbi<4;gbi++)ctx.fillRect(gx+gbi*16+6,gy,3,gh);// bars
    ctx.fillStyle='#606060';ctx.fillRect(gx,gy+gh/2-2,gw,4);// crossbar
    ctx.fillStyle='#303030';ctx.fillRect(gx,gy,gw,4);ctx.fillRect(gx,gy+gh-4,gw,4);
    // Lock
    ctx.fillStyle='#d0a020';ctx.beginPath();ctx.arc(gx+gw/2,gy+gh/2,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(gx+gw/2,gy+gh/2-2,3,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#c0b0a0';ctx.font='7px monospace';ctx.textAlign='center';
    ctx.fillText((10-G.altarsLit)+' MORE',gx+gw/2,gy+gh+10);
  }
}

function drawMapHUDNew(ctx){

  ctx.fillStyle='#f8c840';ctx.fillRect(0,H-2,640,2);

  }
  ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='left';ctx.fillText('★'+G.score,76,19);
  {const D=DENSE[G.wIdx];if(D&&D.item&&G.armorEarned.includes(G.wIdx))D.item.icon(ctx,150,15,1);}

  const needBelt=!!(DENSE[G.wIdx]&&DENSE[G.wIdx].item)&&!G.armorEarned.includes(G.wIdx);
  ctx.fillText('ALTARS '+G.altarsLit+'/10'+(G.altarsLit>=10?(needBelt?' — '+DENSE[G.wIdx].item.short:' — GATE OPEN!'):''),320,27);
  // Burden bar (right, worlds 0-2 only)
  if(G.wIdx<=2&&G.burden>0){
    const bx=530,by=8,bw=100;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx,by,bw,10);
    const burdenCol=G.burden>60?'#7a4010':G.burden>30?'#b06020':'#d09040';
    ctx.fillStyle=burdenCol;ctx.fillRect(bx,by,Math.round(bw*G.burden/100),10);
    ctx.strokeStyle='#604020';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,10);
    ctx.fillStyle='#e0b080';ctx.font='bold 10px monospace';ctx.textAlign='right';ctx.fillText('BURDEN',bx-6,by+9);
  }else if(G.altarsLit>=10){

function drawPilgrimMapDir(ctx,x,y,armor,frame,dir,burden){
  ctx.save();
  // Burden pack behind player (drawn first)
  if(burden>0&&G.wIdx<=2){
    const bp=burden/100;
    const pw=Math.round(8*bp)+3,ph=Math.round(9*bp)+3;
    const isRight=(dir==='right'||dir==='down');
    const packX=isRight?x-pw-3:x+1;
    const packY=y-20;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(packX+1,packY+1,pw,ph);
    ctx.fillStyle=bp>0.6?'#7a3a10':bp>0.3?'#9a5020':'#b07040';
    ctx.fillRect(packX,packY,pw,ph);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(packX,packY,pw,2);
    // straps
    ctx.fillStyle='#604010';
    ctx.fillRect(packX-1,packY-1,2,ph+3);ctx.fillRect(packX+pw-1,packY-1,2,ph+3);
    // buckle dot
    ctx.fillStyle='#d0a030';ctx.fillRect(packX+Math.floor(pw/2)-1,packY+Math.floor(ph/2)-1,3,3);
  }
  drawPilgrimCanvas(ctx,x-8,y-20,armor,1.8,frame);
  ctx.restore();
}

function drawPrayPrompt(ctx,playerScreenY){
  if(!G.nearAltar||G.nearAltar.lit)return;
  const q=QS[G.nearAltar.qIdx]?QS[G.nearAltar.qIdx].q:'';
  const bw=600,bh=70,bx=20,by=playerScreenY>300?40:480-bh-10;
  ctx.fillStyle='rgba(8,10,40,0.94)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#f8c840';ctx.lineWidth=3;ctx.strokeRect(bx+1.5,by+1.5,bw-3,bh-3);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#9ab4ff';ctx.font='bold 13px monospace';
  ctx.fillText('Evangelist says:',bx+16,by+22);
  ctx.fillStyle='#ffffff';ctx.font='bold 18px monospace';
  let line='"'+q+'"';
  while(ctx.measureText(line).width>bw-32&&line.length>4)line=line.slice(0,-5)+'…"';

function checkAltarProximity(){
  const RANGE=24;
  let nearest=null,nearDist=RANGE*RANGE;
  G.altarData.forEach(alt=>{
    if(alt.lit)return;
    const dx=G.px-alt.x,dy=G.py-alt.y;
    const d=dx*dx+dy*dy;
    if(d<nearDist){nearDist=d;nearest=alt;}
  });
  G.nearAltar=nearest;
}

function isSolid(px,py,T){
  const mapRows=26,mapCols=40,hw=7;
  const checks=[[px-hw,py-hw],[px+hw,py-hw],[px-hw,py+hw],[px+hw,py+hw]];
  for(const [cx,cy] of checks){
    const col=Math.floor(cx/T),row=Math.floor(cy/T);
    if(col<0||col>=mapCols||row<0||row>=mapRows)return true;
    const t=tiles[row]?.[col];
    if(t==='R')return true;// river/lava = solid
  }
  return false;
}

function updateCompanion(){
  const comp=G.companion;
  comp.animT++;
  // Target: ~40px behind player (relative to direction)
  let tx=G.px,ty=G.py+40;// default: below player
  const dx=G.px-comp.px,dy=G.py-comp.py;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>48){// only move if too far
    const sp=Math.min(1.8,d*0.06);
    comp.px+=dx/d*sp;comp.py+=dy/d*sp;
  }
  comp.px=Math.max(10,Math.min(630,comp.px));
  comp.py=Math.max(36,Math.min(408,comp.py));
}

function renderBlankDisplay(ctx,q,filled,currentBlank,x,y,maxW){
  const parts=q.dp.split('___');
  let cx=x;
  ctx.font='12px monospace';ctx.textAlign='left';
  parts.forEach((part,i)=>{
    // Wrap before text segment if it would overflow — split at spaces to find break point
    ctx.fillStyle='#f0f0ff';
    const words=part.split(' ');
    words.forEach((word,wi)=>{
      const token=(wi===0?'':' ')+word;
      const tw=ctx.measureText(token).width;
      if(cx+tw>maxW+x-4&&cx>x+20){cx=x+16;y+=22;}
      ctx.fillText(token,cx,y);
      cx+=tw;
    });
    if(i<q.blanks.length){
      ctx.font='11px monospace';
      const ansW=ctx.measureText(q.blanks[i]).width;
      const bw=Math.max(70,ansW+28);
      ctx.font='12px monospace';
      // Wrap before blank box if it would overflow
      if(cx+bw>maxW+x-4){cx=x+16;y+=22;}
      const isFilled=i<filled.length;
      const isCurrent=i===currentBlank;
      ctx.fillStyle=isFilled?'#002800':isCurrent?'#000820':'#08080a';
      ctx.fillRect(cx,y-14,bw,18);
      ctx.strokeStyle=isFilled?'#30c030':isCurrent?'#f8c840':'#5050a0';
      ctx.lineWidth=2;ctx.strokeRect(cx,y-14,bw,18);
      if(isFilled){
        ctx.fillStyle='#60ff60';ctx.font='11px monospace';ctx.textAlign='left';
        ctx.save();ctx.beginPath();ctx.rect(cx+2,y-14,bw-4,18);ctx.clip();
        ctx.fillText(filled[i],cx+4,y);
        ctx.restore();
      } else if(isCurrent){
        ctx.fillStyle='#f8c840';ctx.font='10px monospace';ctx.textAlign='left';
        ctx.fillText('▶ type here',cx+4,y);
      }
      cx+=bw+6;
      ctx.font='12px monospace';
    }
  });
}

function renderWB(ctx,bank,sel,x,y){
  ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText('WORD BANK — pick the right word:',x,y-5);
  // Measure max word width to decide layout
  ctx.font='11px monospace';
  const maxWordW=Math.max(...bank.map(w=>ctx.measureText(w).width));
  const useTwo=maxWordW>90||bank.some(w=>w.length>11);
  if(useTwo){
    // 2x2 grid
    const bw=292,bh=26,gap=6;
    bank.forEach((word,i)=>{
      const col=i%2,row=Math.floor(i/2);
      const bx=x+col*(bw+gap),by=y+4+row*(bh+gap);
      const isSel=sel===i;
      ctx.fillStyle=isSel?'#0a280a':'#04040e';ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle=isSel?'#f8c840':'#404080';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
      if(isSel){ctx.fillStyle='rgba(248,200,64,0.12)';ctx.fillRect(bx,by,bw,bh);}
      ctx.fillStyle=isSel?'#f8c840':'#404060';ctx.font='8px monospace';ctx.textAlign='left';
      ctx.fillText((i+1)+'',bx+4,by+9);
      ctx.fillStyle=isSel?'#f8c840':'#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.save();ctx.beginPath();ctx.rect(bx+2,by,bw-4,bh);ctx.clip();
      ctx.fillText(word,bx+bw/2,by+18);ctx.restore();
    });
  }else{
    // single row of 4
    const bw=142,bh=30,gap=6;
    bank.forEach((word,i)=>{
      const bx=x+i*(bw+gap),by=y+4;
      const isSel=sel===i;
      ctx.fillStyle=isSel?'#0a280a':'#04040e';ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle=isSel?'#f8c840':'#404080';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
      if(isSel){ctx.fillStyle='rgba(248,200,64,0.12)';ctx.fillRect(bx,by,bw,bh);}
      ctx.fillStyle=isSel?'#f8c840':'#404060';ctx.font='8px monospace';ctx.textAlign='left';
      ctx.fillText((i+1)+'',bx+4,by+10);
      ctx.fillStyle=isSel?'#f8c840':'#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.save();ctx.beginPath();ctx.rect(bx+2,by,bw-4,bh);ctx.clip();
      ctx.fillText(word,bx+bw/2,by+20);ctx.restore();
    });
  }
}

function renderTypeBox(ctx,typed,x,y){
  ctx.fillStyle='rgba(0,0,20,0.9)';ctx.fillRect(x,y,460,26);

function wrapText(ctx,text,x,y,maxW,lh){
  ctx.textAlign='left';
  const words=text.split(' ');let line='',cy=y;
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,cy);cy+=lh;line=w;}else line=t;});
  if(line)ctx.fillText(line,x,cy);
}

// ─── Submit one blank ─────────────────────────────────────
function submitBlank(answer){
  const correct=G.activeQ.blanks[G.blankIdx];
  const ok=answer.toLowerCase().trim()===correct.toLowerCase().trim();
  if(ok){
    sfxBlankOk();flash('#00aa00',0.18);
    G.filledBlanks.push(answer);
    G.blankIdx++;
    if(G.blankIdx>=G.activeQ.blanks.length){
      // all blanks filled — correct!
      sfxOk();flash('#00ff00',0.25);
      G.score+=50+(G.streak>=2?25:0);G.streak++;G.correct++;G.qIdx++;G.totalAnswered++;
      showQFeedback(true);
    }else{
      // next blank
      G.wbSel=0;G.typedAns='';_di.value='';
      G.wordBank=buildWordBank(G.activeQ.blanks,G.blankIdx);
      renderQDlg();
    }
  }else{
    // wrong on any blank — question failed
    sfxBad();flash('#ff0000',0.3);
    G.lives=Math.max(0,G.lives-1);G.streak=0;G.wrong++;G.totalAnswered++;
    showQFeedback(false);
  }
}

function showQFeedback(good){
  const cv=document.getElementById('qCv'),ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=good?'rgba(0,28,0,0.97)':'rgba(28,0,0,0.97)';ctx.fillRect(0,0,640,230);
  ctx.fillStyle=good?'#20a020':'#a02020';ctx.fillRect(0,0,640,3);
  ctx.fillStyle=good?'#60ff60':'#ff6060';ctx.font='bold 20px monospace';ctx.textAlign='center';
  ctx.fillText(good?'✓ CORRECT!':'✗ WRONG!',320,40);
  ctx.fillStyle='#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
  ctx.fillText('Full answer:',320,64);
  // Draw answer text centered — measure first to find starting x
  ctx.fillStyle='#f8c840';ctx.font='bold 12px monospace';
  const maxW=560,lh=18,margin=40;
  // Split into lines first, then center each line
  const words=G.activeQ.full.split(' ');
  let lines=[],line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);
  let ty=86;
  lines.forEach(l=>{ctx.textAlign='center';ctx.fillText(l,320,ty);ty+=lh;});
  // On wrong answer: highlight which blank was missed
  if(!good){
    const correctWord=G.activeQ.blanks[G.blankIdx];
    const ry=ty+4;
    ctx.fillStyle='rgba(0,40,0,0.92)';ctx.fillRect(100,ry,440,26);
    ctx.strokeStyle='#30ff60';ctx.lineWidth=2;ctx.strokeRect(100,ry,440,26);
    ctx.fillStyle='#30ff60';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('✓ Blank '+(G.blankIdx+1)+': "'+correctWord+'"',320,ry+17);
    // lives remaining pip display
    const livesY=ry+36;
    ctx.fillStyle='#606080';ctx.font='9px monospace';ctx.fillText('Lives remaining:',220,livesY);
    for(let i=0;i<3;i++){ctx.fillStyle=i<G.lives?'#e03030':'#301010';ctx.beginPath();ctx.arc(338+i*22,livesY-5,7,0,Math.PI*2);ctx.arc(338+i*22+8,livesY-5,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(338+i*22-7,livesY-4);ctx.lineTo(338+i*22+4,livesY+4);ctx.lineTo(338+i*22+15,livesY-4);ctx.closePath();ctx.fill();}
  }
  if(good&&G.streak>=3){ctx.fillStyle='#ff8020';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('🔥 '+G.streak+'x STREAK! +25 BONUS!',320,148);}
  ctx.fillStyle='#404060';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('continuing...',320,218);
  const delay=good?1800:2400;
  setTimeout(()=>{
    document.getElementById('qDlg').style.display='none';
    G.activeQ=null;G.filledBlanks=[];G.blankIdx=0;
    // Mark altar lit on correct answer
    if(good&&G.activeAltarIdx>=0){
      const alt=G.altarData[G.activeAltarIdx];
      if(alt&&!alt.lit){
        alt.lit=true;
        G.altarsLit=Math.min(10,G.altarsLit+1);
        if(G.wIdx<=2)G.burden=Math.max(0,Math.round(G.burden-100/30));
      }
      G.activeAltarIdx=-1;
    }
    if(!good&&G.lives<=0){endWorld(false);return;}
    G.phase='walk';startMapLoop();
  },delay);
}

// ─── Keyboard for questions + pause ──────────────────────
document.addEventListener('keydown',e=>{
  // DEV SHORTCUT: Shift+B = jump straight to boss battle of current world (or world 0)
  if(e.shiftKey&&e.key==='B'){
    if(!G.name){G.name='DEV';G.gender='boy';G.diff='young';G.score=0;G.lives=3;G.worldsDone=[];G.armorEarned=[];G.totalAnswered=0;}
    const wi=G.wIdx||0;
    G.wIdx=wi;const r=WRANGES[wi];G.wQs=[];for(let i=r[0];i<=r[1];i++)G.wQs.push(i);
    G.qIdx=0;G.correct=0;G.wrong=0;G.streak=0;G.bossHP=100;
    stopLoop();show('bossBattleScr');startBossBattle();return;
  }
  if((e.key===' '||e.key==='Enter')&&G.phase==='itemGet'){e.preventDefault();if(G.itemT>(G.itemMin||70))G.phase='walk';return;}
  if((e.key===' '||e.key==='Enter')&&G.phase==='walk'&&G.nearChest&&G.altarsLit>=CHEST_NEED&&!G.chestOpen){e.preventDefault();dwOpenChest();return;}
  // Space key — interact with altar
  if((e.key===' '||e.key==='Enter')&&G.phase==='walk'&&G.nearAltar&&!G.nearAltar.lit){
    e.preventDefault();
    G.activeAltarIdx=G.altarData.indexOf(G.nearAltar);
    openQuestion(G.nearAltar.qIdx);
    return;
  }
  // P key toggles pause (any phase except title/name/result)
  if((e.key==='p'||e.key==='P')&&['walk','question','boss'].includes(G.phase)){
    if(G.paused)resumeGame();else pauseGame();
    return;
  }
  // Escape pauses when not in a question (ESC in question = skip)
  if(e.key==='Escape'&&G.phase==='walk'){
    if(G.paused)resumeGame();else pauseGame();
    return;
  }
  // Resume on Escape if paused mid-question or mid-boss
  if(e.key==='Escape'&&G.paused){resumeGame();return;}
  // regular question
  if(G.phase==='question'&&G.activeQ){
    if(e.key==='Escape'){skipQ();return;}
    if(G.diff==='young'){
      if(e.key==='ArrowLeft'){G.wbSel=Math.max(0,G.wbSel-1);renderQDlg();}
      else if(e.key==='ArrowRight'){G.wbSel=Math.min(G.wordBank.length-1,G.wbSel+1);renderQDlg();}
      else if(e.key>='1'&&e.key<='4'){const i=parseInt(e.key)-1;if(i<G.wordBank.length){G.wbSel=i;sfxMenu();renderQDlg();}}
      else if(e.key==='Enter'){e.preventDefault();submitBlank(G.wordBank[G.wbSel]);}
    }else{
      if(e.key==='Enter'){e.preventDefault();submitBlank(G.typedAns);}
      else if(document.activeElement!==_di){
        if(e.key==='Backspace'){G.typedAns=G.typedAns.slice(0,-1);_di.value=G.typedAns;renderQDlg();}
        else if(e.key.length===1){G.typedAns+=e.key;_di.value=G.typedAns;renderQDlg();}
      }
    }
  }
  // boss question — only when the question dialog is actually visible
  if(G.phase==='boss'&&G.bossQ&&document.getElementById('bqDlg').style.display!=='none'){
    if(G.diff==='young'){
      if(e.key==='ArrowLeft'){G.bossSel=Math.max(0,G.bossSel-1);renderBQDlg();}
      else if(e.key==='ArrowRight'){G.bossSel=Math.min(G.bossWB.length-1,G.bossSel+1);renderBQDlg();}
      else if(e.key>='1'&&e.key<='4'){const i=parseInt(e.key)-1;if(i<G.bossWB.length){G.bossSel=i;sfxMenu();renderBQDlg();}}
      else if(e.key==='Enter'){e.preventDefault();submitBossBlank(G.bossWB[G.bossSel]);}
    }else{
      if(e.key==='Enter'){e.preventDefault();submitBossBlank(G.bossTyped);}
      else if(document.activeElement!==_di){
        if(e.key==='Backspace'){G.bossTyped=G.bossTyped.slice(0,-1);_di.value=G.bossTyped;renderBQDlg();}
        else if(e.key.length===1){G.bossTyped+=e.key;_di.value=G.bossTyped;renderBQDlg();}
      }
    }
  }
});

document.getElementById('qCv').addEventListener('click',e=>{
  if(G.phase!=='question'||!G.activeQ)return;
  if(G.diff!=='young')return;
  const rect=e.target.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(640/rect.width);
  const my=(e.clientY-rect.top)*(230/rect.height);
  // detect layout
  const ctx=document.getElementById('qCv').getContext('2d');
  ctx.font='11px monospace';
  const maxW=Math.max(...G.wordBank.map(w=>ctx.measureText(w).width));
  const useTwo=maxW>90||G.wordBank.some(w=>w.length>11);
  if(useTwo){
    const bw=292,bh=26,gap=6,sx=10,sy=154;
    for(let i=0;i<G.wordBank.length;i++){
      const col=i%2,row=Math.floor(i/2);
      const bx=sx+col*(bw+gap),by=sy+row*(bh+gap);
      if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){G.wbSel=i;sfxMenu();renderQDlg();break;}
    }
  }else{
    const bw=142,gap=6,sx=10;
    if(my>=154&&my<=188){
      const i=Math.floor((mx-sx)/(bw+gap));
      if(i>=0&&i<G.wordBank.length){G.wbSel=i;sfxMenu();renderQDlg();}
    }
  }
});

function skipQ(){

}

function drawBossPixel(ctx, bx, by, bossId, scale=1.9, frame=0, phase='idle') {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(bx, by);
  ctx.scale(scale, scale);

  switch(bossId) {
    case 0: { // THE DOUBTER - Crimson Knight
      ctx.fillStyle='#300'; ctx.fillRect(8,30,48,38);
      ctx.fillStyle='#500'; ctx.fillRect(12,28,32,26);
      ctx.fillStyle='#700'; ctx.fillRect(14,30,28,12);
      ctx.fillStyle='#B00'; ctx.fillRect(16,34,24,18);
      ctx.fillStyle='#400'; ctx.fillRect(16,14,20,16);
      ctx.fillStyle='#A00'; ctx.fillRect(12,10,8,10); ctx.fillRect(32,10,8,10);
      ctx.fillStyle='#F44'; ctx.fillRect(19,18,14,8);
      ctx.fillStyle='#FF0'; ctx.fillRect(22,20,4,4); ctx.fillRect(29,20,4,4);
      // Sword — animated swing, pivot at guard (51,28)
      const swingA = Math.sin(frame*0.14)*0.9;
      ctx.save();
      ctx.translate(51,28);
      ctx.rotate(swingA);
      for(let i=1;i<=5;i++){ctx.save();ctx.rotate(-swingA*i*0.18);ctx.globalAlpha=0.07*(6-i);ctx.fillStyle='#fff4a0';ctx.fillRect(-2,-22,4,26);ctx.restore();}
      ctx.globalAlpha=1;
      ctx.fillStyle='#CCC'; ctx.fillRect(-2,-22,5,26);
      ctx.fillStyle='#EEE'; ctx.fillRect(-1,-22,2,10);
      ctx.fillStyle='#FF0'; ctx.fillRect(-5,-2,11,5);
      ctx.fillStyle='rgba(200,230,255,0.6)'; ctx.fillRect(-1,-20,2,8);
      ctx.restore();
      break;
    }
    case 1: { // OLD SERPENT
      ctx.fillStyle='#031'; ctx.fillRect(6,34,48,26);
      ctx.fillStyle='#063'; ctx.fillRect(10,36,42,20);

function drawLightningBolt(ctx,x1,y1,x2,y2,col,w,jag){
  const segs=8+Math.floor(jag);
  const pts=[[x1,y1]];
  for(let i=1;i<segs;i++){
    const t=i/segs;
    const mx=x1+(x2-x1)*t+(Math.random()-0.5)*jag*20;
    const my=y1+(y2-y1)*t+(Math.random()-0.5)*jag*10;
    pts.push([mx,my]);
  }
  pts.push([x2,y2]);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.globalAlpha=0.9;
  ctx.shadowColor=col;ctx.shadowBlur=12;
  ctx.beginPath();pts.forEach(([px,py],i)=>{i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});ctx.stroke();
  ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.globalAlpha=0.6;
  ctx.beginPath();pts.forEach(([px,py],i)=>{i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});ctx.stroke();
  ctx.restore();
}

function w0BuildBg(){
  const[cv,g]=mkCv(640,480);

  const HZ=W0B.horizon,GX=W0B.gateX;

  g.fillStyle=sk;g.fillRect(0,0,640,HZ);
  // far hills
  for(let x=0;x<640;x++){
    const h1=Math.round(18+Math.sin(x*0.018)*8+Math.sin(x*0.047+1)*4);
    F(x,HZ-h1-10,1,h1+10,'#8db2b0');
    const h2=Math.round(10+Math.sin(x*0.031+2)*6+Math.sin(x*0.09)*2);
    F(x,HZ-h2-4,1,h2+4,'#76a28c');
  }
  // field
  F(0,HZ,640,480-HZ,'#5cab3c');
  for(let by=HZ;by<480;by+=4)for(let bx=0;bx<640;bx+=4){const n=vnoise(bx,by,34);if(n>0.66)F(bx,by,4,4,'#54a236');else if(n<0.28)F(bx,by,4,4,'#63b343');}
  for(let y=HZ;y<480;y++){
    const depth=(y-HZ)/(480-HZ),sz=1+Math.floor(depth*2.2);
    for(let x=0;x<640;x+=2){
      const h=tHash(x,y);
      if(h%23===0)F(x,y,sz,sz,'#4e9832');
      else if(h%29===0)F(x,y,sz,sz,'#78c852');
