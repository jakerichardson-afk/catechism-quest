function _fmtDate(ts){
  const d=new Date(ts),mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const h=d.getHours()%12||12,mn=d.getMinutes().toString().padStart(2,'0'),ap=d.getHours()>=12?'PM':'AM';

// ===============================
// WORLD DEFINITIONS
// ===============================
const WORLDS=[
  {id:0,name:"City of Destruction",icon:"🏛",sky:["#38b0f8","#78d0ff"],ground:"#3a8a20",path:"#c8a050",water:"#2070d0",boss:{name:"The Doubter",sp:"👿",sub:"",bg:["#1a2a5a","#0a1a3a"]}},
  {id:1,name:"Slough of Despond",icon:"🌫",sky:["#0a0018","#180030"],ground:"#1a1208",path:"#3a2510",water:"#101028",boss:{name:"The Old Serpent",sp:"🐍",sub:"",bg:["#0a0005","#150010"]}},
  {id:2,name:"The Cross",icon:"✝",sky:["#f0a030","#f8d060"],ground:"#4a7020",path:"#d0a848",water:"#3080c0",boss:{name:"The Accuser",sp:"👹",sub:"",bg:["#200a00","#380a00"]}},
  {id:3,name:"House Beautiful",icon:"🏰",sky:["#70a0e0","#a0c8f0"],ground:"#4a8a30",path:"#d8c8a0",water:"#3080c0",boss:{name:"Timorous & Mistrust",sp:"😨",sub:"",bg:["#203040","#304050"]}},
  {id:4,name:"Valley of Humiliation",icon:"🌿",sky:["#60a0d0","#90c8e8"],ground:"#3a8a30",path:"#b89850",water:"#3080c0",boss:{name:"Apollyon",sp:"🐉",sub:"",bg:["#1a1000","#2a1800"]}},
  {id:5,name:"Valley of the Shadow",icon:"🌑",sky:["#0a0018","#180030"],ground:"#1a1208",path:"#3a2510",water:"#101028",boss:{name:"The Whisperer",sp:"👁",sub:"",bg:["#0a0005","#150010"]}},
  {id:6,name:"Vanity Fair",icon:"🎪",sky:["#30a870","#60d890"],ground:"#206830",path:"#b89840",water:"#1060c0",boss:{name:"The Deceiver",sp:"🎩",sub:"",bg:["#001a10","#002a18"]}},

  {id:8,name:"The Celestial City",icon:"🌟",sky:["#f0d050","#fff080"],ground:"#60a030",path:"#e0c860",water:"#60b0e0",boss:{name:"The Dark River",sp:"🌊",sub:"",bg:["#080618","#100c28"]}}
];
const ARMOR=[{p:"🥋",n:"Belt of Truth"},{p:"🛡",n:"Breastplate"},{p:"👟",n:"Shoes of Peace"},{p:"🏮",n:"Lantern"},{p:"🔰",n:"Shield of Faith"},{p:"",n:""},{p:"⛑",n:"Helmet of Salvation"},{p:"🗝",n:"Key of Promise"},{p:"⚔",n:"Sword of the Spirit"}];
// which armour piece (as drawn on the pilgrim) each world awards
const WORLD_ARMOR=[0,1,2,-1,3,-1,4,-1,5];
function armorPieces(list){return list.map(w=>WORLD_ARMOR[w]).filter(x=>x!=null&&x>=0);}
// Distractors organized by grammatical category for context-matching
const DISTRACTOR_POOL={
  verbs_s:["loves","hates","rules","creates","saves","judges","sees","hears","knows","forgives","commands","blesses","sends","dwells","reigns","speaks","forms","guides","calls","keeps"],
  verbs_base:["love","hate","rule","create","save","judge","see","hear","know","forgive","command","bless","send","dwell","reign","speak","form","guide","call","keep"],
  verbs_past:["loved","hated","ruled","created","saved","judged","saw","heard","knew","forgave","commanded","blessed","sent","dwelt","reigned","spoke","formed","guided","called","kept"],
  verbs_ing:["loving","hating","ruling","creating","saving","judging","seeing","hearing","knowing","forgiving","commanding","blessing","sending","dwelling","reigning","speaking","forming","guiding","calling","keeping"],
  adj:["righteous","wicked","faithful","sinful","blameless","corrupt","merciful","worthy","glorious","sovereign","almighty","just","gracious","perfect","broken","fallen","chosen","unworthy","defiled","redeemed"],
  nouns:["grace","faith","glory","wrath","covenant","righteousness","spirit","truth","mercy","salvation","redemption","judgment","creation","sacrifice","atonement","sanctification","justification","obedience","transgression","condemnation"],
  nouns_concrete:["soul","body","heart","flesh","law","word","blood","fire","bread","water","stone","light","darkness","temple","altar","throne","cross","tomb","crown","serpent"],
  other:["one","three","many","all","none","eternal","mortal","infinite","finite","divine"]
};
function detectWordCategory(word){
  const w=word.toLowerCase().trim();
  if(/ing$/.test(w))return 'verbs_ing';
  if(/ed$/.test(w)&&w.length>4)return 'verbs_past';
  if(/[^s]s$/.test(w)&&w.length>3&&!/ness|ious|eous|ous|ss$/.test(w))return 'verbs_s';
  if(DISTRACTOR_POOL.adj.some(d=>d===w))return 'adj';
  return 'nouns';
}
function buildWordBank(blanks,currentBlankIdx){
  const correctWord=blanks[currentBlankIdx];
  const pool=[correctWord];
  const cat=detectWordCategory(correctWord);
  const catPool=shuffle([...(DISTRACTOR_POOL[cat]||DISTRACTOR_POOL.nouns)]
    .filter(d=>!blanks.some(b=>b.toLowerCase()===d.toLowerCase())&&d.toLowerCase()!==correctWord.toLowerCase()));
  const nounPool=shuffle([...DISTRACTOR_POOL.nouns,...DISTRACTOR_POOL.nouns_concrete]
    .filter(d=>!blanks.some(b=>b.toLowerCase()===d.toLowerCase())&&d.toLowerCase()!==correctWord.toLowerCase()&&!catPool.includes(d)));
  let added=0;
  for(let i=0;i<catPool.length&&added<3;i++){pool.push(catPool[i]);added++;}
  for(let i=0;i<nounPool.length&&added<3;i++){pool.push(nounPool[i]);added++;}
  return shuffle(pool.slice(0,4));

const MUS={cur:null,gain:null,timer:null,step:0,nextT:0,song:null};
function noteMidi(n){const m=n.match(/^([A-G])([#b]?)(\d)$/);return(+m[3]+1)*12+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);}
function midiHz(m){return 440*Math.pow(2,(m-69)/12);}
function chordTones(ch){const m=ch.match(/^([A-G][#b]?)(m|dim)?$/),r=noteMidi(m[1]+'3');return(m[2]==='m'?[0,3,7]:m[2]==='dim'?[0,3,6]:[0,4,7]).map(x=>r+x);}
function prepSong(sg){if(sg.steps)return sg;sg.steps=sg.mel.trim().split(/\s+/).filter(t=>t!=='|');sg.ch=sg.chords.split(' ').map(chordTones);return sg;}
function mVoice(type,hz,t,dur,vol){
  const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=hz;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.setValueAtTime(vol,t+Math.max(0.02,dur*0.6));g.gain.exponentialRampToValueAtTime(0.0008,t+dur*0.95);
  o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur);
}
function musSchedule(){
  const c=ac(),sg=MUS.song,sd=60/sg.bpm/2;
  while(MUS.nextT<c.currentTime+0.3){
    const k=MUS.step%sg.steps.length,t=MUS.nextT,tok=sg.steps[k],bar=Math.floor(k/8),beat=k%8,ch=sg.ch[bar%sg.ch.length];
    if(tok!=='-'&&tok!=='.'){let n=1;while(sg.steps[(k+n)%sg.steps.length]==='-'&&n<16)n++;
      mVoice(sg.lead||'square',midiHz(noteMidi(tok)),t,n*sd*0.95,sg.lead==='triangle'?0.16:0.06);}
    const root=ch[0]-12;
    if(sg.bass==='pulse'&&beat%4===0)mVoice('triangle',midiHz(root),t,sd*3.6,0.16);
    if(sg.bass==='pulse'&&beat===6)mVoice('triangle',midiHz(ch[2]-12),t,sd*1.8,0.12);
    if(sg.bass==='hold'&&beat===0)mVoice('triangle',midiHz(root),t,sd*7.5,0.14);
    if(sg.bass==='drive')mVoice('triangle',midiHz(beat%2?root+12:root),t,sd*0.8,0.15);
    if(sg.bass==='oompah')mVoice('triangle',midiHz(beat%2?ch[1]:root),t,sd*0.7,beat%2?0.09:0.16);
    if(sg.arp)mVoice('square',midiHz(ch[[0,1,2,1][beat%4]]+12),t,sd*0.5,0.018);
    MUS.step++;MUS.nextT+=sd;
  }
}
function playMusic(name){
  if(!name||!SONGS[name]){stopMusic();return;}
  let c;try{c=ac();}catch(e){return;}
  if(c.state==='suspended')c.resume().catch(()=>{});
  if(MUS.cur===name)return;
  stopMusic();if(!soundOn)return;
  MUS.cur=name;MUS.song=prepSong(SONGS[name]);MUS.step=0;MUS.nextT=c.currentTime+0.12;
  MUS.gain=c.createGain();MUS.gain.gain.value=0.0001;MUS.gain.gain.linearRampToValueAtTime(0.55,c.currentTime+0.4);MUS.gain.connect(c.destination);
  musSchedule();MUS.timer=setInterval(()=>{try{musSchedule();}catch(e){}},60);
}
function stopMusic(){
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
  if(MUS.gain){const g=MUS.gain,c=ac();try{g.gain.cancelScheduledValues(c.currentTime);g.gain.setValueAtTime(g.gain.value,c.currentTime);g.gain.linearRampToValueAtTime(0.0001,c.currentTime+0.15);}catch(e){}setTimeout(()=>{try{g.disconnect();}catch(e){}},250);MUS.gain=null;}
  MUS.cur=null;
}

// big gold pixel letters with a dark outline and a light sweeping across them
function pixelWord(ctx,word,cx,y,sc,f){
  const w=word.length*6*sc-sc,x0=Math.round(cx-w/2),cells=[];
  [...word].forEach((ch,k)=>(PFONT[ch]||[]).forEach((row,r)=>[...row].forEach((c,col)=>{if(c==='#')cells.push([x0+(k*6+col)*sc,y+r*sc,r]);})));
  ctx.fillStyle='#3a1a04';cells.forEach(([x,yy])=>ctx.fillRect(x-sc*0.5,yy-sc*0.5,sc*2,sc*2));
  ctx.fillStyle='rgba(0,0,0,0.35)';cells.forEach(([x,yy])=>ctx.fillRect(x+sc*0.6,yy+sc*1.2,sc,sc));
  const sweep=((f*3)%(w+400))-200+x0;
  cells.forEach(([x,yy,r])=>{
    ctx.fillStyle=r<2?'#fff0a0':r<5?'#f8c840':'#d88a10';ctx.fillRect(x,yy,sc,sc);
    if(r===0){ctx.fillStyle='#ffffff';ctx.fillRect(x,yy,sc,Math.max(1,Math.round(sc/4)));}
    const d=Math.abs(x+(yy-y)*0.5-sweep);if(d<sc*3){ctx.fillStyle=`rgba(255,255,230,${0.75*(1-d/(sc*3))})`;ctx.fillRect(x,yy,sc,sc);}
  });
}

function drawPilgrimCanvas(ctx, ox, oy, armor, scale = 2.5, frame = 0, dir = 'down') {

  const belt = armor.includes(0);

    px(7, 15, 11, 3, '#a02050');
  } else {
    const tunic = breast ? '#a0a0b8' : '#2a6a2a';

    px(10, 10, 5, 3, '#b08020');
  }

  if (shield) {
    px(-1, 5, 9, 12, '#b8a050');

    px(3, 8, 3, 6, '#c04020');

    px(3, 13, 4, 4, '#c0906a');
  }

    ctx.fillStyle = '#d0d8e0'; ctx.fillRect(-1.5*s, -22*s, 3*s, 24*s);

    ctx.restore();
  } else {
    px(18, 13, 4, 4, '#c0906a');
  }

  // Brown Hair
  const hairDark = '#2a1a10';
  const hairMid  = '#3a2a18';
  if (gender === 'girl') {
    px(4, -6, 17, 13, hairDark);
    px(5, -7, 15, 11, hairMid);
    px(16, -3, 6, 13, hairDark);
    px(17, -2, 4, 10, hairMid);
  } else {
    px(6, -4, 13, 9, hairDark);
    px(7, -5, 11, 7, hairMid);
  }

  // Face
  px(7, 1, 11, 8, '#f0c090');
  px(8, 2, 9, 6, '#ffd0a8');

  px(9, 4, 2, 2, '#1a1a1a');
  px(13, 4, 2, 2, '#1a1a1a');
  px(9, 4, 1, 1, '#ffffff');
  px(13, 4, 1, 1, '#ffffff');
  px(11, 5, 1, 2, '#d8a878');
  px(10, 7, 4, 1, gender === 'girl' ? '#e07080' : '#c06048');

  if (gender === 'girl') {
    px(11, 8, 3, 1, '#ffd040');
    px(12, 9, 1, 1, '#ffd040');
  }

  if (helm) {
    px(5, -6, 15, 10, '#8888a0');
    px(6, -5, 13, 7, '#a0a0b8');
    px(7, -9, 11, 4, '#b8b8d0');
  }
}

function buildWM(){
  stopLoop();
  const cv=document.getElementById('wmCv');if(!cv)return;
  wmFrame=0;
  let reached=0;for(let i=0;i<WORLDS.length;i++)if(wmUnlocked(i))reached=i;
  wmSel=reached;G.rollOpen=null;
  if(wmLoopId){cancelAnimationFrame(wmLoopId);wmLoopId=null;}
  let last=0;
  function wmLoop(now){wmLoopId=requestAnimationFrame(wmLoop);if(now&&now-last<15.5)return;last=now||0;wmFrame++;drawWM();}
  wmLoop();
  cv.onclick=function(e){
    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(640/rect.width),my=(e.clientY-rect.top)*(480/rect.height);
    for(let k=wmBtns.length-1;k>=0;k--){const b=wmBtns[k];if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){b.act();return;}}
  };
}
document.addEventListener('keydown',e=>{
  const scr=document.getElementById('wmScr');if(!scr||!scr.classList.contains('on'))return;
  if(G.rollOpen!=null){if(['Escape','Enter',' '].includes(e.key)){e.preventDefault();G.rollOpen=null;}return;}
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){for(let i=wmSel+1;i<WORLDS.length;i++)if(wmUnlocked(i)){wmSel=i;sfxMenu();break;}e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){for(let i=wmSel-1;i>=0;i--)if(wmUnlocked(i)){wmSel=i;sfxMenu();break;}e.preventDefault();}
  else if(e.key==='Enter'||e.key===' '){if(wmUnlocked(wmSel)){e.preventDefault();sfxMenu();beginWorld(wmSel);}}
});

// Stop world map loop when leaving screen
function show(id){
  if(id!=='wmScr'&&wmLoopId){cancelAnimationFrame(wmLoopId);wmLoopId=null;}
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  playMusic(screenSong(id));
  const pb=document.getElementById('pauseBtn');
  if(pb)pb.style.display=(id==='owScr')?'block':'none';
}

function beginWorld(wIdx){
  sfxMenu();stopLoop();
  G.wIdx=wIdx;
  const r=WRANGES[wIdx];
  G.wQs=[];for(let i=r[0];i<=r[1];i++)G.wQs.push(i);
  G.qIdx=0;G.correct=0;G.wrong=0;G.streak=0;G.bossHP=100;
  G.altarsLit=0;G.nearAltar=null;G.activeAltarIdx=-1;
  // Setup altars — assign questions round-robin from non-boss range
  const D=DENSE[wIdx],TS=8;
  const positions=D.altars;
  const bossN=Math.min(BOSS_N[wIdx]||4,G.wQs.length-1);
  G.bossQs=G.wQs.slice(G.wQs.length-bossN);
  const pool=shuffle(G.wQs.slice(0,G.wQs.length-bossN));
  const nAlt=Math.min((D&&D.altarCount)||positions.length,positions.length,pool.length);
  G.altarData=positions.slice(0,nAlt).map((pos,i)=>({tx:pos[1],ty:pos[0],x:pos[1]*TS+TS/2,y:pos[0]*TS+TS/2,qIdx:pool[i],lit:false,animT:0,required:i<10}));
  const rest=pool.slice(nAlt),givers=(D&&D.quests)||[];
  G.quests=givers.length&&rest.length?givers.map(gv=>Object.assign({},gv,{qs:[],done:0})):[];
  rest.forEach((q,k)=>G.quests[k%G.quests.length].qs.push(q));
  G.quests=G.quests.filter(q=>q.qs.length);
  G.activeQuest=null;G.nearQuest=null;
  // Player starts near bottom center of map
  G.px=320;G.py=376;G.dir='up';G.frame=0;
  G.burden=G.armorEarned.includes(2)?0:(wIdx===0?100:G.burden);
  G.lives=maxLives();
  G.companion={px:320,py:396,frame:0,animT:0};
  G.trail=[];G.chestOpen=G.armorEarned.includes(wIdx);G.nearChest=false;
  if(D){G.px=D.start[0];G.py=D.start[1];G.companion.px=D.comp[0];G.companion.py=D.comp[1];}
  G.phase='walk';
  document.getElementById('qDlg').style.display='none';
  document.getElementById('bqDlg').style.display='none';
  show('owScr');
  startMapLoop();
  if(!warmDone){
    warmDone=true;const wq=warmupQs(wIdx);
    if(wq.length>=2){
      G.phase='warmup';showToast("Evangelist: \"Let us remember the way so far.\"");
      setTimeout(()=>{if(G.phase!=='warmup')return;startDrill(wq,"EVANGELIST'S WARM-UP",d=>{
        G.phase='walk';showToast('Warm-up done: '+d.ok+'/'+d.list.length+' remembered!');
      });},1600);
    }
  }
}

function pcirc(g,cx,cy,r,col){g.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(r*r-dy*dy));g.fillRect(cx-w,cy+dy,w*2,1);}}
function pline(g,x0,y0,x1,y1,col,w=1){g.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){g.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),w,w);}}
function vnoise(x,y,s){
  const fx=x/s,fy=y/s,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;
  const v=(a,b)=>(tHash(a+911,b+277)%1000)/1000;
  const a=v(ix,iy),b=v(ix+1,iy),c=v(ix,iy+1),d=v(ix+1,iy+1);
  const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}

function dwPaintTile(ctx,g,c,r){
  const ch=g[r][c],x=c*8,y=r*8,h=tHash(c,r),h2=tHash(c+977,r+311);

  const at=(dc,dr)=>(g[r+dr]&&g[r+dr][c+dc])||'';
  switch(ch){
    case 'g':{
      R(0,0,8,8,'#7a8446');
      const v=h%6;
      if(v===0)R(0,0,5,4,'#838d4c');else if(v===1)R(3,4,5,4,'#717b40');else if(v===2)R(1,2,6,3,'#808a4a');
      sp(3,'#626b36',h);sp(2,'#949e5a',h2);
      if(h%9===0){R(2,3,1,3,'#9aa462');R(3,2,1,4,'#8b9554');R(5,4,1,2,'#9aa462');}
      if(h2%23===0){R(3,3,2,1,'#d8c860');}
      break;}
    case 'f':{
      R(0,0,8,8,'#5cab3c');
      const v=h%5;
      if(v===0)R(0,0,4,4,'#64b444');else if(v===1)R(4,3,4,5,'#54a036');
      sp(3,'#4a9230',h);sp(3,'#78c852',h2);
      if(h%7===0){R(1,4,1,3,'#7ccc54');R(3,3,1,4,'#6cbc48');R(6,5,1,2,'#7ccc54');}
      if(h2%13===0){const fc=['#fff6a0','#ffffff','#ff9ec4','#ffd040'][(h2>>8)&3];const fx=2+(h&3),fy=2+((h>>2)&3);R(fx,fy-1,1,1,fc);R(fx-1,fy,3,1,fc);R(fx,fy+1,1,1,fc);R(fx,fy,1,1,'#e09020');}
      break;}
    case 'd':case 'G':{
      R(0,0,8,8,'#9a7850');
      if(h%4===0)R(1,1,4,3,'#a58258');
      sp(3,'#7e5f3e',h);sp(2,'#b08e64',h2);
      if(h%6===0){R((h>>4)&5,(h>>7)&5,2,1,'#6c5440');R((h>>4)&5,((h>>7)&5)-1,2,1,'#a89070');}
      const gr='#7a8446';
      const isG=t=>t==='g';
      if(isG(at(0,-1)))for(let i=0;i<8;i+=2)R(i,0,1,1+((h>>i)&1),gr);
      if(isG(at(0,1)))for(let i=1;i<8;i+=2)R(i,7-((h>>i)&1),1,1+((h>>i)&1),gr);
      if(at(0,-1)==='f')for(let i=0;i<8;i+=2)R(i,0,1,1+((h>>i)&1),'#5cab3c');
      if(at(0,1)==='f')for(let i=1;i<8;i+=2)R(i,7-((h>>i)&1),1,1+((h>>i)&1),'#5cab3c');
      if(at(-1,0)==='f')for(let i=0;i<8;i+=2)R(0,i,1+((h>>i)&1),1,'#5cab3c');
      if(at(1,0)==='f')for(let i=1;i<8;i+=2)R(7-((h>>i)&1),i,1+((h>>i)&1),1,'#5cab3c');
      break;}
    case 'r':{
      R(0,0,8,8,'#8e7050');
      sp(2,'#74583c',h);
      const sx=(h>>3)%5,sy=(h>>6)%5;
      R(sx,sy,3,2,'#8c8882');R(sx,sy,3,1,'#aaa69e');R(sx+1,sy+2,2,1,'#5e5a54');
      if(h2%3===0){const ax=(h2>>4)%6,ay=(h2>>7)%6;R(ax,ay,2,2,'#7c7872');R(ax,ay,1,1,'#a09c94');}
      if(h%11===0)R(1,6,5,1,'#5a3a22');
      break;}
    case 'c':{
      R(0,0,8,8,'#5e564f');
      for(let sr=0;sr<2;sr++){
        const sh=((r*2+sr)%2)*2;
        for(let k=-1;k<3;k++){
          const sx=k*4+sh,a=Math.max(0,sx),b=Math.min(8,sx+3);
          if(b<=a)continue;
          const tone=['#9a9088','#8e847b','#a59b90','#948a80'][(h>>(sr*4+k+2))&3];
          R(a,sr*4,b-a,3,tone);
          if(sx>=0)R(sx,sr*4,1,1,'#b8afa4');
          if(sx+2<8&&sx+2>=0)R(sx+2,sr*4+2,1,1,'#7a7068');
        }
      }
      const above=at(0,-1);
      if(above==='g'||above==='d'||above==='r')R(0,0,8,1,'#4a433d');
      if(at(0,1)==='g'||at(0,1)==='d')R(0,7,8,1,'#b0a69a');
      break;}
    case 'p':{
      const sh=tHash(c>>1,r>>1);
      R(0,0,8,8,['#b8ac98','#b0a48f','#bdb19d','#b4a893'][sh&3]);
      if(c%2===0)R(0,0,1,8,'#8a7f6c');
      if(r%2===0)R(0,0,8,1,'#8a7f6c');
      if(c%2===1)R(7,1,1,7,'#c6bba7');
      if(r%2===1)R(1,7,6,1,'#9d927f');
      sp(2,'#a39782',h);
      if(sh%9===0&&c%2===0&&r%2===0){R(2,2,1,1,'#7e735f');R(3,3,2,1,'#7e735f');R(5,4,1,2,'#7e735f');}
      break;}
    case 'w':{
      R(0,0,8,8,'#3e6f8f');
      if(h%3===0)R(0,3,8,2,'#38678a');
      sp(2,'#5a8ead',h);
      if(at(0,-1)!=='w'&&at(0,-1)!=='b'){R(0,0,8,2,'#2c5470');R(0,2,8,1,'#4f84a4');for(let i=0;i<8;i+=3)R(i,0,2,1,'#4a9230');}
      if(at(0,1)==='W')R(0,5,8,3,'#2a4a62');
      break;}
    case 'b':{
      R(0,0,8,8,'#5a3a1e');
      R(0,0,8,3,'#a8743c');R(0,4,8,3,'#9a6834');
      R(0,0,8,1,'#bc8a4e');R(0,4,8,1,'#ae7c44');
      R(2,1,1,1,'#4a3018');R(6,5,1,1,'#4a3018');
      if(c===57)R(0,0,2,8,'#6a4424');
      if(c===62)R(6,0,2,8,'#6a4424');
      break;}
    case 'W':{
      const face=((r>=26&&r<=28)||(r>=86&&r<=87))&&c>=3&&c<=116;
      if(face){
        R(0,0,8,8,'#8c8274');
        R(0,3,8,1,'#6c6256');R(0,7,8,1,'#6c6256');
        const o=(r%2)?3:7;R(o,0,1,3,'#6c6256');R((o+4)%8,4,1,3,'#6c6256');
        R(0,0,8,1,'#9c9284');
        if(h%7===0)R((h>>3)&5,4,2,2,'#6f7c4a');
        if(h2%9===0)R((h2>>3)&6,(h2>>6)&2,1,2,'#5c5448');
        if(r===28||r===87)R(0,6,8,2,'#5a5248');
      }else{
        R(0,0,8,8,'#aca292');
        R(0,7,8,1,'#8c8274');R(7,0,1,8,'#8c8274');R(0,0,8,1,'#c0b6a6');R(0,0,1,7,'#bab0a0');
        sp(2,'#9a907f',h);
        if(r===25&&c>=3&&c<=116){if(c%2===0){R(0,0,8,4,'#c4baa8');R(0,4,8,1,'#7c7264');R(7,0,1,4,'#9a907f');}else{R(0,0,8,3,'#7a7062');}}
        if(c===2)R(7,0,1,8,'#6c6256');
        if(c===117)R(0,0,1,8,'#6c6256');
      }
      break;}
    case 'h':{
      R(0,0,8,8,'#2f6a2c');
      R(1,1,3,2,'#3f8838');R(4,3,3,2,'#478f3e');R(0,5,3,2,'#3a7f34');
      sp(2,'#5aa84a',h);sp(2,'#24561f',h2);
      if(r===6){for(let i=0;i<8;i++)if(((h>>i)&3)===0)R(i,0,1,1,'#5cab3c');R(0,0,8,1,'#4c9a40');}
      if(r===7)R(0,6,8,2,'#204a1c');
      break;}
  }
}

// ── House sprite (3/4 view, half-timbered) ──────────────────
const DW_ROOFS=[
  {top:'#c87a58',mid:'#a8583e',bot:'#86422e',ridge:'#6e3424'},
  {top:'#8a94a6',mid:'#6c7688',bot:'#545e70',ridge:'#424a5a'},
  {top:'#a2805a',mid:'#856444',bot:'#6a4e34',ridge:'#523a24'},
  {top:'#9a6a8a',mid:'#7e5070',bot:'#643c58',ridge:'#4e2c44'}
];
function dwHouse(wT,hT,seed,home){
  const W=wT*8,H=hT*8,TOP=14;
  const[cv,g]=mkCv(W+4,H+TOP);
  const ox=2,oy=TOP,R=Math.round(H*0.52),wallH=H-R;
  const pal=home?{top:'#d8885a',mid:'#b8603e',bot:'#94482e',ridge:'#743422'}:DW_ROOFS[seed%DW_ROOFS.length];
  const stone=!home&&seed%5===3;
  const F=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  // chimney (behind roof top)
  const chx=ox+Math.round(seed%2?W*0.2:W*0.68);
  F(chx,oy-10,8,18,'#8a4a34');
  for(let i=0;i<4;i++){F(chx,oy-8+i*4,8,1,'#6a3424');F(chx+(i%2?4:1),oy-10+i*4,1,3,'#6a3424');}
  F(chx-1,oy-12,10,3,'#5a3022');F(chx,oy-12,8,1,'#7a4434');
  // roof
  const rows=Math.ceil(R/4);
  for(let i=0;i<rows;i++){
    const t=i/Math.max(1,rows-1);
    const col=t<0.4?pal.top:t<0.75?pal.mid:pal.bot;
    const yy=oy+i*4;
    F(0,yy,W+4,4,col);
    F(0,yy+3,W+4,1,pal.ridge);
    for(let xx=(i%2)*3;xx<W+4;xx+=6)F(xx,yy,1,3,pal.ridge);
    for(let xx=(i%2)*3+1;xx<W+4;xx+=6)F(xx,yy,2,1,pal.top);
  }
  F(0,oy,W+4,3,pal.ridge);F(0,oy,W+4,1,pal.top);
  F(0,oy,2,R,pal.ridge);F(W+2,oy,2,R,pal.ridge);
  if(!home&&seed%3===0){
    const dx=ox+8+(seed%(Math.max(1,W-24))),dy=oy+6;
    F(dx,dy,10,7,'#2a1c14');F(dx+2,dy,1,7,'#7a5434');F(dx+6,dy,1,7,'#7a5434');F(dx,dy+3,10,1,'#7a5434');
  }
  // wall
  const wy=oy+R;
  F(ox,wy,W,wallH,stone?'#a49a8a':'#e0d0a8');
  if(stone){for(let yy=wy+3;yy<oy+H-3;yy+=4){F(ox,yy,W,1,'#857b6d');for(let xx=ox+((yy/4)%2?2:6);xx<ox+W;xx+=8)F(xx,yy-3,1,3,'#857b6d');}}
  else{
    F(ox,wy,W,wallH,'#e0d0a8');
    F(ox,wy+wallH-6,W,3,'#d0be94');
    const beam='#5a3a22';
    F(ox,wy,W,2,beam);F(ox,wy+Math.floor(wallH/2)-1,W,2,beam);
    for(let xx=ox;xx<ox+W;xx+=20)F(xx,wy,3,wallH-3,beam);
    F(ox+W-3,wy,3,wallH-3,beam);
    for(let xx=ox+3;xx+17<=ox+W;xx+=20){if((seed+xx)%3===0)pline(g,xx,wy+Math.floor(wallH/2)-2,xx+16,wy+2,beam,1);}
    if(!home&&seed%2===1){pline(g,ox+W-14,wy+4,ox+W-10,wy+9,'#a08c68');pline(g,ox+W-10,wy+9,ox+W-12,wy+14,'#a08c68');}
  }
  // eave shadow
  F(ox,wy,W,2,'rgba(30,20,10,0.45)');
  // foundation
  F(ox,oy+H-3,W,3,'#8a8276');for(let xx=ox+3;xx<ox+W;xx+=6)F(xx,oy+H-3,1,3,'#6a6258');F(ox,oy+H-3,W,1,'#a49c90');
  // door
  const dw=10,dh=Math.min(16,wallH-3),dx=ox+Math.floor(W/2)-5,dy=oy+H-3-dh;
  F(dx-1,dy-1,dw+2,dh+1,'#3e2614');
  F(dx,dy,dw,dh,home?'#8a5a2e':'#6a4426');
  for(let xx=dx+2;xx<dx+dw;xx+=3)F(xx,dy,1,dh,home?'#6a4220':'#4e301a');
  F(dx+dw-3,dy+Math.floor(dh/2),1,1,'#e0c060');
  F(dx-1,oy+H-1,dw+2,1,'#b4ac9e');
  // windows
  const wyy=wy+Math.max(4,Math.floor(wallH/2)-5);
  const slots=[];for(let xx=ox+6;xx+8<=dx-3;xx+=16)slots.push(xx);for(let xx=dx+dw+5;xx+8<=ox+W-5;xx+=16)slots.push(xx);
  slots.forEach((xx,k)=>{
    const boarded=!home&&((seed+k)%4===0);
    F(xx-1,wyy-1,10,9,'#3e2614');
    if(boarded){F(xx,wyy,8,7,'#2a1c14');F(xx,wyy+1,8,2,'#8a5a30');F(xx,wyy+4,8,2,'#7a4e28');}
    else{
      const lit=home&&k===0;
      F(xx,wyy,8,7,lit?'#f8d878':'#8cb8d4');
      F(xx,wyy,8,2,lit?'#fff0b0':'#b4d8ec');
      F(xx+3,wyy,1,7,'#3e2614');F(xx,wyy+3,8,1,'#3e2614');
      F(xx+1,wyy+1,1,1,'#ffffff');
      const sh=home?'#3a6a9a':['#4a6a3a','#7a3a2a','#3a5a7a'][seed%3];
      F(xx-3,wyy,2,7,sh);F(xx+9,wyy,2,7,sh);
      if(home||seed%3===1){F(xx-1,wyy+8,10,2,'#6a4426');for(let i=0;i<4;i++)F(xx+i*2,wyy+7,1,1,['#e04848','#f8d040','#ff90c0','#e04848'][i]);}
    }
  });
  return{cv,chim:[chx+4,oy-12]};
}

function dwDeadTree(seed){

// ── Build City of Destruction ───────────────────────────────
function dwBuildCity(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('g'));
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(r>=0&&r<rows&&c>=0&&c<cols)g[r][c]=ch;};
  // north fields, moat, walls
  set(0,0,119,21,'f');
  set(0,22,119,24,'w');
  set(0,25,119,28,'W');set(0,25,2,87,'W');set(117,25,119,87,'W');set(0,85,119,87,'W');
  set(56,25,63,28,'c');set(57,22,62,24,'b');
  // yard texture (smooth noise)
  for(let r=29;r<85;r++)for(let c=3;c<117;c++){
    const n=vnoise(c,r,6),n2=vnoise(c+50,r+50,4);
    if(n>0.7)g[r][c]='d';else if(n2>0.82)g[r][c]='r';
  }
  // back lane along south wall
  set(3,81,116,84,'d');
  // streets + square
  set(56,29,63,84,'c');set(3,44,116,49,'c');set(3,64,116,69,'c');set(20,29,25,84,'c');set(94,29,99,84,'c');
  set(46,40,73,53,'p');
  // road from the city gate to the Wicket Gate
  for(let r=8;r<=21;r++){const o=Math.round(Math.sin(r*0.45)*2);set(58+o,r,61+o,r,'d');}
  set(0,6,119,7,'h');set(57,6,62,7,'G');

  // houses [col,row,w,h]
  const HOUSES=[
    [4,30,12,10],[27,30,12,10],[41,30,12,9],[67,30,12,10],[81,31,11,9],[102,30,13,10],
    [5,52,12,10],[27,52,12,10],[41,55,11,8],[77,51,13,10],[101,52,13,10],
    [4,71,11,10],[28,71,13,10],[44,72,10,9],[66,71,13,10,1],[82,71,11,10],[101,71,13,10]
  ];
  // dirt path from each door down to the next street/lane
  HOUSES.forEach(([c,r,w,h])=>{
    const dc=c+Math.floor(w/2)-1;
    for(let rr=r+h;rr<rows;rr++){const t=g[rr][dc];if(t==='c'||t==='p'||t==='W'||(t==='d'&&rr>=81))break;set(dc,rr,dc+1,rr,'d');}
  });

  // solid map: 0 walkable, 1 solid, 2 gate (solid until 10 altars lit)
  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(r>=0&&r<rows&&c>=0&&c<cols)solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='W'||t==='h')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  // paint ground
  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dwPaintTile(gx,g,c,r);
  gx.fillStyle='rgba(20,15,10,0.28)';gx.fillRect(56*8,25*8,64,22);

  const objects=[],chimneys=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  // houses
  HOUSES.forEach(([c,r,w,h,home],i)=>{
    const hs=dwHouse(w,h,tHash(c,r)%97+i,!!home);
    const x=c*8-2,y=r*8-14;
    add(hs.cv,x,y,(r+h)*8);
    if(home||i%2===0)chimneys.push([x+hs.chim[0],y+hs.chim[1]]);
    S(c,r+2,c+w-1,r+h-1);
    gx.fillStyle='rgba(20,15,10,0.22)';gx.fillRect((c+w)*8+2,(r+3)*8,5,(h-3)*8+3);gx.fillRect(c*8+5,(r+h)*8,w*8,3);
  });
  // trees

  [[17,34],[39,42],[92,43],[113,42],[115,60],[16,82],[92,83],[52,62]].forEach(([c,r],i)=>treeAt(c,r,dwDeadTree(i),28));
  [[10,12],[22,17],[30,10],[48,14],[70,15],[96,10],[106,17],[112,11],[6,19],[78,19],[90,17],[18,9],[34,19],[102,13],[116,19],[2,10]].forEach(([c,r],i)=>treeAt(c,r,dwGreenTree(i),32));
  // props
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  const barrel=dwBarrel(),crate=dwCrate(),lamp=dwLamp();

  [[17,41],[80,41],[100,63],[55,82],[114,50],[3,63]].forEach(([c,r])=>prop(crate,c,r));
  [[55,33],[64,36],[55,58],[64,62],[55,76],[45,47],[74,47]].forEach(([c,r])=>prop(lamp,c,r));
  prop(dwCart(),72,61,4);
  prop(dwSign('WICKET GATE'),64,20,2);
  prop(dwSign('TO THE GATE'),64,80,2);
  // well in the square
  add(dwWell(),458,356,392);S(57,47,62,48);
  S(65,40,68,41);

  const tower=dwTower();
  add(tower,52*8,232-72,232);add(tower,64*8,232-72,232);
  add(dwArch(),56*8,25*8-14,233);

  const water=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c]==='w')water.push([c,r]);
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys,water,smoke:[]};
}

function dwSolidAt(x,y){
  const c=Math.floor(x/8),r=Math.floor(y/8);
  if(c<0||r<0||c>=DWS.cols||r>=DWS.rows)return true;
  const v=DWS.solid[r*DWS.cols+c];
  return v===1||(v===2&&(G.altarsLit<altarNeed()||!dwHasBelt()));
}
function dwBlocked(px,py){return dwSolidAt(px-4,py-3)||dwSolidAt(px+4,py-3)||dwSolidAt(px-4,py+2)||dwSolidAt(px+4,py+2);}

function dwUpdateCompanion(){
  const c=G.companion;c.animT++;
  const t=G.trail;
  if(t.length>16&&Math.hypot(G.px-c.px,G.py-c.py)>22){
    const p=t[Math.max(0,t.length-16)],dx=p[0]-c.px,dy=p[1]-c.py,d=Math.hypot(dx,dy);
    if(d>0.5){const sp=Math.min(d,2.4);c.px+=dx/d*sp;c.py+=dy/d*sp;}
  }
}

function dwDrawLight(ctx,camX,camY){
  const lx=480-camX,ly=10-camY;

    grd.addColorStop(0,'rgba(255,252,220,0.95)');grd.addColorStop(0.18,'rgba(255,236,150,0.6)');grd.addColorStop(0.5,'rgba(255,224,130,0.18)');grd.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=grd;ctx.fillRect(lx-240,ly-40,480,280);
    ctx.save();ctx.translate(lx,ly);ctx.rotate(mapFrame*0.003);
    ctx.fillStyle='rgba(255,246,200,0.16)';
    for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-9,150);ctx.lineTo(9,150);ctx.closePath();ctx.fill();}

function dwAnimWater(ctx,camX,camY){

function dwSmoke(ctx,camX,camY){
  const sm=DWS.smoke;
  DWS.chimneys.forEach(([x,y],i)=>{if((mapFrame+i*7)%16===0)sm.push({x:x+(Math.random()*2-1),y,t:0});});
  for(let i=sm.length-1;i>=0;i--){
    const p=sm[i];p.t++;p.y-=0.32;p.x+=0.16+Math.sin(p.t*0.06)*0.12;
    if(p.t>120){sm.splice(i,1);continue;}
    const a=0.42*(1-p.t/120),s=2+Math.floor(p.t/24);
    ctx.fillStyle=`rgba(96,90,86,${a})`;ctx.fillRect(Math.round(p.x-camX-s/2),Math.round(p.y-camY-s/2),s,s);
  }
}

function dsBuildSlough(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('g'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))g[r][c]=ch;};
  const disc=(cc,rr,rad,ch)=>{for(let r=rr-rad-2;r<=rr+rad+2;r++)for(let c=cc-rad-3;c<=cc+rad+3;c++){if(!inb(c,r))continue;const d=Math.hypot((c-cc)*0.85,r-rr)+(vnoise(c,r,3)-0.5)*1.8;if(d<=rad)g[r][c]=ch;}};
  set(0,0,119,5,'f');
  set(0,6,119,7,'h');set(57,6,62,7,'G');
  // the bog
  for(let r=15;r<=74;r++)for(let c=0;c<cols;c++){
    const edge=Math.min(r-15,74-r);
    if(edge<3&&vnoise(c,r*0.6,5)<0.25+edge*0.12)continue;
    g[r][c]=vnoise(c,r,9)<0.36?'w':'m';
  }
  // firm islands
  [[30,62,5],[88,64,5],[18,44,5],[60,46,7],[100,40,6],[36,28,5],[82,24,5],[110,58,4]].forEach(([c,r,rad])=>disc(c,r,rad,'g'));
  // the steps: stepping stones through the slough
  const path=pts=>{for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c2,d]=pts[i+1],n=Math.max(Math.abs(c2-a),Math.abs(d-b));for(let k=0;k<=n;k++){const cc=Math.round(a+(c2-a)*k/n),rr=Math.round(b+(d-b)*k/n);for(let dc=0;dc<2;dc++)for(let dr=0;dr<2;dr++){if(!inb(cc+dc,rr+dr))continue;const t=g[rr+dr][cc+dc];if(t==='m'||t==='w')g[rr+dr][cc+dc]='s';}}}};
  path([[59,76],[56,70],[50,64],[54,56],[59,52]]);
  path([[60,39],[64,34],[70,28],[66,20],[60,15],[60,12]]);
  path([[50,64],[36,62]]);path([[56,70],[80,66],[88,64]]);path([[53,46],[30,44],[20,44]]);path([[67,46],[90,42],[98,40]]);
  path([[64,34],[46,30],[38,28]]);path([[70,28],[80,24]]);path([[88,64],[104,60],[108,58]]);
  set(59,75,60,80,'b');
  for(let r=8;r<=14;r++){const o=Math.round(Math.sin(r*0.5)*1.5);set(59+o,r,61+o,r,'d');}
  set(57,81,62,84,'d');

  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='h')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dsPaintTile(gx,g,c,r);

  const objects=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  const treeAt=(c,r,cv,solidTrunk=true)=>{add(cv,c*8+4-cv.width/2,(r+1)*8-cv.height,(r+1)*8);if(solidTrunk)S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  // dead trees on islands, willows on the banks
  [[27,59],[92,61],[15,41],[64,42],[103,37],[33,25],[85,21],[112,56],[54,49]].forEach(([c,r],i)=>treeAt(c,r,dwDeadTree(i)));
  [[8,80],[24,84],[96,82],[112,79],[40,78],[78,84],[10,10],[26,12],[100,9],[114,12],[44,9],[80,11]].forEach(([c,r],i)=>treeAt(c,r,dsWillow(i)));
  // reeds along every shore (decoration only)
  for(let r=15;r<75;r++)for(let c=1;c<cols-1;c++){
    if(g[r][c]!=='g')continue;
    const wet=['m','w'].includes(g[r+1]&&g[r+1][c])||['m','w'].includes(g[r][c+1]);
    if(wet&&tHash(c,r)%6===0){const cv=dsReeds(tHash(r,c)%7);add(cv,c*8+1,(r+1)*8-cv.height+2,(r+1)*8+2);}
  }
  for(let r=15;r<75;r++)for(let c=2;c<cols-2;c++){if(g[r][c]==='m'&&tHash(c+5,r)%61===0){const cv=dsReeds(tHash(c,r)%5);add(cv,c*8,(r+1)*8-cv.height,(r+1)*8);}}
  const log=dsLog();
  [[44,58],[74,52],[24,36],[92,30],[52,22],[104,48]].forEach(([c,r])=>{if(g[r][c]==='m')add(log,c*8-10,r*8,r*8+8);});
  // signs
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  prop(dwSign('SLOUGH OF DESPOND',84),50,80,4);
  prop(dwSign('STAY ON THE STEPS',84),63,77,4);
  prop(dwSign('FIRM GROUND',54),64,13,2);
  S(64,10,64,11); // Help stands here

  const water=[],mud=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(g[r][c]==='w')water.push([c,r]);else if(g[r][c]==='m')mud.push([c,r]);}
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys:[],water,mud,bubbles:[],smoke:[],ripple:'150,190,160'};
}

  set(Math.min(botC,59)-1,35,Math.max(botC,62)+1,35,'S');

  g.globalCompositeOperation='source-over';
  ctx.drawImage(_dark,0,0);

  DWS.eyes.forEach(([ex,ey],i)=>{
    const x=ex-camX,y=ey-camY;if(x<0||x>640||y<0||y>480)return;

  });

function dvBuildValley(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('f'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))g[r][c]=ch;};
  const disc=(cc,rr,rad,ch)=>{for(let r=rr-rad-2;r<=rr+rad+2;r++)for(let c=cc-rad-3;c<=cc+rad+3;c++){if(!inb(c,r))continue;const d=Math.hypot((c-cc)*0.85,r-rr)+(vnoise(c,r,3)-0.5)*1.4;if(d<=rad)g[r][c]=ch;}};
  set(0,6,119,7,'X');set(57,6,62,7,'G');
  for(let r=8;r<=60;r++){
    for(let c=0;c<cols;c++)g[r][c]='X';
    const c0=dvC0(r),hw=dvHW(r);
    for(let c=c0-hw;c<=c0+hw;c++){
      if(!inb(c,r))continue;
      if(r<12||r>56)g[r][c]='o';
      else if(c>=c0-1&&c<=c0+1)g[r][c]='d';
      else if(c<c0-1)g[r][c]=c<=c0-hw+1?'o':'v';
      else g[r][c]=c>=c0+hw-1?'o':'m';
    }
    set(c0-1,r,c0+1,r,'d');
  }
  for(let r=61;r<=87;r++){const o=Math.round(Math.sin(r*0.3)*2);set(58+o,r,61+o,r,'d');}
  // side caves off the valley, reached by bridges over the ditch or stones across the quag
  dvAlcoves().forEach(([r,ac,side],i)=>{
    disc(ac,r,i===3?5:4,'o');
    const c0=dvC0(r);
    for(let c=c0+side*2;c!==ac;c+=side)for(let rr=r;rr<=r+1;rr++){const t=g[rr][c];if(t==='v')g[rr][c]='b';else if(t==='m')g[rr][c]='s';else if(t==='X')g[rr][c]='o';}
  });

  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='X'||t==='v')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dvPaintTile(gx,g,c,r);

  const objects=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  const treeAt=(c,r,cv)=>{add(cv,c*8+4-cv.width/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  [[10,66],[24,72],[38,84],[80,66],[98,74],[112,64],[6,80],[106,84],[70,80],[30,64],[90,86],[50,74]].forEach(([c,r],i)=>treeAt(c,r,dwGreenTree(i)));
  const rocks=dvRocks(1),spire=dvSpire(1);
  for(let r=10;r<=58;r+=3){const c0=dvC0(r),hw=dvHW(r);[c0-hw,c0+hw].forEach((c,k)=>{if(g[r][c]==='o'&&tHash(c,r)%2===0){add(k?spire:rocks,c*8+4-(k?7:11),(r+1)*8-(k?30:16),(r+1)*8);S(c,r,c,r);}});}
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  prop(dwSign('VALLEY OF HUMILIATION',100),48,83,4);
  prop(dwSign('VALLEY OF THE SHADOW',96),64,63,4);
  const cp=dvChestPos();S(Math.floor((cp.x-10)/8),Math.floor((cp.y-14)/8),Math.floor((cp.x+10)/8),Math.floor((cp.y-1)/8));
  S(66,11,66,11);

  const eyes=[];
  for(let r=14;r<=55;r+=3){const c0=dvC0(r),hw=dvHW(r),side=(r/3)%2?1:-1,c=c0+side*(hw+1);if(inb(c,r)&&g[r][c]==='X')eyes.push([c*8+4,r*8+4]);}
  const mud=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c]==='m')mud.push([c,r]);
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys:[],water:[],mud,bubbles:[],smoke:[],eyes};
}

function dcBuildJourney(){
  const cols=120,rows=88,W=cols*8,H=rows*8;
  const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('f'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const set=(c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))g[r][c]=ch;};
  const disc=(cc,rr,rad,ch)=>{for(let r=rr-rad-2;r<=rr+rad+2;r++)for(let c=cc-rad-3;c<=cc+rad+3;c++){if(!inb(c,r))continue;const d=Math.hypot((c-cc)*0.85,r-rr)+(vnoise(c,r,3)-0.5)*1.6;if(d<=rad)g[r][c]=ch;}};
  set(0,0,119,5,'O');set(0,6,119,7,'Y');set(57,6,62,7,'G');
  set(0,8,119,12,'O');
  // the River
  for(let c=0;c<cols;c++){const r0=14+Math.round(Math.sin(c*0.09)*1.5);for(let k=0;k<8;k++)g[r0+k][c]='r';}
  [[20,17,2],[90,18,2],[40,19,1],[104,16,1]].forEach(([c,r,rad])=>disc(c,r,rad,'w'));
  // Land of Beulah — flowers everywhere
  for(let r=24;r<=40;r++)for(let c=0;c<cols;c++)if(vnoise(c,r,5)>0.42)g[r][c]='B';
  // Delectable Mountains
  [[22,64,9],[52,72,8],[86,64,10],[106,76,7],[34,80,6]].forEach(([c,r,rad])=>disc(c,r,rad,'k'));
  // the way
  for(let r=8;r<=87;r++){const o=Math.round(Math.sin(r*0.11)*6);const tile=g[r][59+o];if(tile==='r'||tile==='w')continue;set(58+o,r,61+o,r,g[r][59+o]==='k'?'S':'d');}
  set(57,8,62,12,'O');
  // stairs up Hill Clear to the shepherds
  for(let r=56;r<=66;r++){const cc=86+Math.round(Math.sin(r*0.5)*2);set(cc,r,cc+1,r,'S');}
  set(66,66,86,67,'d');

  const solid=new Uint8Array(cols*rows);
  const S=(c0,r0,c1,r1,v=1)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(inb(c,r))solid[r*cols+c]=v;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=g[r][c];if(t==='w'||t==='Y')solid[r*cols+c]=1;}
  S(0,0,119,5);S(57,6,62,7,2);

  const[ground,gx]=mkCv(W,H);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)dcPaintTile(gx,g,c,r);

  const objects=[];
  const add=(cv,x,y,base)=>objects.push({cv,x,y,base});
  add(dcCity(),160,64-160,62);
  add(dcTelescope(),90*8,56*8-26,56*8);S(90,55,91,55);
  const treeAt=(c,r,cv)=>{add(cv,c*8+4-cv.width/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c,r);pcirc(gx,c*8+5,(r+1)*8,6,'rgba(0,0,0,0.18)');};
  [[6,30],[16,26],[30,36],[44,28],[78,30],[92,36],[104,26],[114,34],[8,60],[40,58],[70,60],[100,56],[116,68],[4,74],[66,84],[96,86],[24,86],[112,84],[46,86],[76,74]].forEach(([c,r],i)=>treeAt(c,r,dwGreenTree(i)));
  const prop=(cv,c,r,wT=1)=>{add(cv,c*8+(wT*8-cv.width)/2,(r+1)*8-cv.height,(r+1)*8);S(c,r,c+wT-1,r);};
  prop(dwSign('DELECTABLE MOUNTAINS',100),48,84,4);prop(dwSign('LAND OF BEULAH',72),66,42,3);
  prop(dwSign('THE RIVER',54),66,23,2);prop(dwSign('HILL CLEAR',60),82,67,2);
  S(88,54,90,54);
  const water=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(g[r][c]==='w')water.push([c,r]);
  return{cols,rows,W,H,grid:g,solid,ground,objects,chimneys:[],water,smoke:[],sheep:dcSheep(),ripple:'200,235,255'};
}

const BOSS_N=[4,4,3,3,4,4,4,4,3];
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function mastery(q){return(G.mastery&&G.mastery[q])||{s:0,d:'',r:0};}
function starStr(n){return'★'.repeat(n)+'☆'.repeat(3-n);}
function markMastery(q,ok){
  if(q==null||q<0)return;
  G.mastery=G.mastery||{};
  const m=Object.assign({s:0,d:'',r:0},G.mastery[q]),t=todayStr();
  if(ok){m.r=1;if(m.d!==t){m.s=Math.min(3,m.s+1);m.d=t;}}
  else m.s=Math.max(0,m.s-1);
  G.mastery[q]=m;
  if(ok)checkRollSeal();
  try{save();}catch(e){}
}
function rollCount(w){const r=WRANGES[w];let n=0,t=0;for(let i=r[0];i<=r[1];i++){t++;if(mastery(i).r)n++;}return[n,t];}
// every sealed Roll is a heart piece; three pieces make a new heart (up to 6)
function maxLives(){return 3+Math.min(3,Math.floor((G.sealed||[]).length/3));}
function heartPieces(){const n=(G.sealed||[]).length;return n>=9?0:n%3;}
function checkRollSeal(){
  const w=G.wIdx,[n,t]=rollCount(w);G.sealed=G.sealed||[];
  if(n>=t&&!G.sealed.includes(w)){
    const before=maxLives();G.sealed.push(w);G.score+=250;
    if(maxLives()>before){G.lives=Math.min(maxLives(),G.lives+1);showToast('Roll sealed! A NEW HEART! +250');sfxWin();}
    else showToast('Roll sealed! Heart piece '+heartPieces()+'/3  +250');
  }
}
function heartShape(ctx,hx,hy,r){
  ctx.beginPath();ctx.arc(hx-r*0.75,hy-r*0.6,r,0,Math.PI*2);ctx.arc(hx+r*0.75,hy-r*0.6,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(hx-r*1.75,hy-r*0.3);ctx.lineTo(hx,hy+r*1.4);ctx.lineTo(hx+r*1.75,hy-r*0.3);ctx.closePath();ctx.fill();
}
// draws the hearts and any heart pieces; returns where the row ends
function drawHearts(ctx,x,y,r,emptyCol){
  const m=maxLives(),step=Math.round(r*(m>3?3.9:4.6));
  for(let i=0;i<m;i++){
    const hx=x+i*step;ctx.fillStyle=i<G.lives?'#e03030':emptyCol;heartShape(ctx,hx,y,r);
    if(i<G.lives){ctx.fillStyle='rgba(255,140,140,0.7)';ctx.fillRect(Math.round(hx-r),Math.round(y-r*1.1),Math.max(1,Math.round(r*0.5)),Math.max(1,Math.round(r*0.5)));}
  }
  const pc=heartPieces();
  if(pc){
    const hx=x+m*step;ctx.save();ctx.fillStyle='rgba(0,0,0,0.45)';heartShape(ctx,hx,y,r);
    ctx.beginPath();ctx.rect(hx-r*2,y-r*2,r*4*pc/3,r*4);ctx.clip();ctx.fillStyle='#f8c840';heartShape(ctx,hx,y,r);ctx.restore();
    return hx+step;
  }
  return x+m*step;
}

  keys.up=keys.down=keys.left=keys.right=false;

function dwDrawItemGet(ctx,sx,sy,t0){
  const it=DENSE[G.wIdx].item,delay=it.burdenTo?44:0,t=t0-delay;
  ctx.fillStyle=`rgba(0,0,10,${0.45*Math.min(1,t0/12)})`;ctx.fillRect(0,0,640,480);
  if(it.burdenTo&&t0<64){
    // the burden loosens, tumbles down the hill and falls into the open tomb
    const k=Math.min(1,t0/56),bp=Math.max(0.3,(G.burdenWas||60)/100);
    const camX=G.px-sx,camY=G.py-sy;
    const fx=sx,fy=sy-26,tx=it.burdenTo[0]-camX,ty=it.burdenTo[1]-camY;
    const x=fx+(tx-fx)*k,y=fy+(ty-fy)*k-Math.abs(Math.sin(k*Math.PI*3))*22*(1-k);
    const pw=8+Math.round(10*bp),ph=7+Math.round(7*bp),sc=1-Math.max(0,k-0.8)*4;
    if(sc>0){ctx.save();ctx.translate(x,y);ctx.rotate(k*9);ctx.scale(sc,sc);ctx.fillStyle='#4a2a0e';ctx.fillRect(-pw/2-1,-ph/2-1,pw+2,ph+2);ctx.fillStyle='#7a3a10';ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.fillStyle='#d0a030';ctx.fillRect(-1,-1,2,2);ctx.restore();}
  }
  dwDrawPlayer(ctx,sx,sy);
  if(t<0)return;
  const by=sy-46-Math.min(14,t*0.8)+Math.sin(t*0.1)*2;
  ctx.save();ctx.translate(sx,by);ctx.rotate(t*0.01);
  ctx.fillStyle=`rgba(255,240,170,${0.22*Math.min(1,t/12)})`;
  for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-7,70);ctx.lineTo(7,70);ctx.closePath();ctx.fill();}
  ctx.restore();
  const gr=ctx.createRadialGradient(sx,by,2,sx,by,26);gr.addColorStop(0,'rgba(255,250,210,0.9)');gr.addColorStop(1,'rgba(255,230,120,0)');
  ctx.fillStyle=gr;ctx.fillRect(sx-28,by-28,56,56);
  it.icon(ctx,sx,by,2);
  if(t%12<6){ctx.fillStyle='#fff8d0';[[sx-22,by-10],[sx+20,by+6],[sx+6,by-20]].forEach(([x,y])=>{ctx.fillRect(x,y-2,1,5);ctx.fillRect(x-2,y,5,1);});}
  if(t>14){
    const bh=96,bx=20,bw=600,top=sy>280?40:480-bh-10;
    ctx.fillStyle='rgba(8,10,40,0.95)';ctx.fillRect(bx,top,bw,bh);
    ctx.strokeStyle='#f8c840';ctx.lineWidth=3;ctx.strokeRect(bx+1.5,top+1.5,bw-3,bh-3);
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    const title=it.title||'You got the '+it.name+'!';
    ctx.fillStyle='#f8c840';ctx.font='bold 22px monospace';if(ctx.measureText(title).width>580)ctx.font='bold 18px monospace';ctx.fillText(title,320,top+32);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px monospace';if(ctx.measureText(it.verse).width>580)ctx.font='bold 12px monospace';ctx.fillText(it.verse,320,top+56);
    ctx.fillStyle='#a0b0e0';ctx.font='12px monospace';ctx.fillText('— '+it.ref+'   •   '+it.hint,320,top+76);
    if(t0>(G.itemMin||70)){ctx.fillStyle=Math.floor(t/20)%2?'#f8c840':'#c89820';ctx.font='bold 12px monospace';ctx.textAlign='right';ctx.fillText(('ontouchstart' in window?'TAP':'SPACE')+' ▶',bx+bw-12,top+bh-8);}
    ctx.textAlign='left';
  }
}

function drawPromptBox(ctx,playerScreenY,label,text,action){

function startDenseLoop(){
  stopLoop();
  const D=DENSE[G.wIdx];
  if(!D.built)D.built=D.build();
  DWS=D.built;
  CHEST=D.chest||null;
  const owCtx=document.getElementById('owCv').getContext('2d'),spCtx=document.getElementById('spCv').getContext('2d');
  owCtx.imageSmoothingEnabled=false;spCtx.imageSmoothingEnabled=false;
  keys.up=keys.down=keys.left=keys.right=false;
  const SPEED=1.9,TOP=30;
  let last=0;
  function loop(now){
    loopId=requestAnimationFrame(loop);
    if(now&&now-last<15.5)return;
    last=now||0;
    if(G.paused)return;
    mapFrame++;
    if(G.phase==='walk'){
      const dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
      if(dx||dy){
        const tF=dwTileAt(G.px,G.py),sl=tF==='m'?0.5:((D.slowMap&&D.slowMap[tF])||(D.slow&&tF===D.slow?0.6:1)),len=Math.hypot(dx,dy),mx=dx/len*SPEED*sl,my=dy/len*SPEED*sl,ox=G.px,oy=G.py;
        if(!dwBlocked(G.px+mx,G.py))G.px+=mx;
        else if(!dy){for(let o=1;o<=7;o++){if(!dwBlocked(G.px+mx,G.py-o)){if(!dwBlocked(G.px,G.py-SPEED))G.py-=SPEED;break;}if(!dwBlocked(G.px+mx,G.py+o)){if(!dwBlocked(G.px,G.py+SPEED))G.py+=SPEED;break;}}}
        if(!dwBlocked(G.px,G.py+my))G.py+=my;
        else if(!dx){for(let o=1;o<=7;o++){if(!dwBlocked(G.px-o,G.py+my)){if(!dwBlocked(G.px-SPEED,G.py))G.px-=SPEED;break;}if(!dwBlocked(G.px+o,G.py+my)){if(!dwBlocked(G.px+SPEED,G.py))G.px+=SPEED;break;}}}
        const moved=G.px!==ox||G.py!==oy;
        if(Math.abs(dy)>Math.abs(dx))G.dir=dy>0?'down':'up';else G.dir=dx>0?'right':'left';
        G.frame=Math.floor(mapFrame/8)%4;
        if(mapFrame%16===0)sfxStep();
        if(moved){G.trail.push([G.px,G.py]);if(G.trail.length>80)G.trail.shift();}
      }else G.frame=0;
      dwUpdateCompanion();
      if(D.tick)D.tick();
      checkAltarProximity();
      {let nq=null,nd=32;(G.quests||[]).forEach(q=>{const d=Math.hypot(G.px-q.x,G.py-q.y);if(d<nd){nd=d;nq=q;}});G.nearQuest=nq;}
      G.nearNpc=!!D.npc&&Math.hypot(G.px-D.npc.x,G.py-D.npc.y)<36;
      G.nearChest=!!CHEST&&!G.chestOpen&&Math.hypot(G.px-CHEST.x,G.py-(CHEST.y+6))<30;
      if(G.altarsLit>=altarNeed()&&dwHasBelt()&&G.py<D.gateY){G.phase='bossIntro';stopLoop();triggerBossIntro();return;}
    }else if(G.phase==='itemGet'){G.itemT++;}
    const camX=Math.round(Math.max(0,Math.min(DWS.W-640,G.px-320)));
    const camY=Math.round(Math.max(-(D.camTop||TOP),Math.min(DWS.H-480,G.py-TOP-225)));
    owCtx.clearRect(0,0,640,480);
    if(camY<0&&D.sky){owCtx.fillStyle=D.sky;owCtx.fillRect(0,0,640,-camY);}
    owCtx.drawImage(DWS.ground,-camX,-camY);
    dwAnimWater(owCtx,camX,camY);
    (D.light||dwDrawLight)(owCtx,camX,camY);

    spCtx.clearRect(0,0,640,480);
    const list=[];
    DWS.objects.forEach(o=>{const sx=o.x-camX,sy=o.y-camY;if(sx>-o.cv.width&&sx<640&&sy>-o.cv.height&&sy<480)list.push({base:o.base,draw:()=>spCtx.drawImage(o.cv,sx,sy)});});
    G.altarData.forEach((a,i)=>{const sx=a.x-camX,sy=a.y-camY;if(sx>-40&&sx<680&&sy>-40&&sy<520)list.push({base:a.y+6,draw:()=>drawAltarAt(spCtx,a,i,sx,sy)});});
    list.push({base:64,draw:()=>(D.wicket||dwDrawWicket)(spCtx,456-camX,48-camY)});
    (G.quests||[]).forEach(q=>{const sx=q.x-camX,sy=q.y-camY;if(sx>-30&&sx<670&&sy>-60&&sy<520)list.push({base:q.y,draw:()=>dwDrawQuestGiver(spCtx,q,sx,sy,mapFrame)});});
    if(D.npc)list.push({base:D.npc.y,draw:()=>dwDrawHelp(spCtx,D.npc.x-camX,D.npc.y-camY,mapFrame,D.npc.robe)});
    if(CHEST)list.push({base:CHEST.y,draw:()=>(CHEST.draw||dwDrawChest)(spCtx,CHEST.x-camX,CHEST.y-camY,mapFrame)});
    list.push({base:G.companion.py,draw:()=>drawCompanionSprite(spCtx,Math.round(G.companion.px-camX)-7,Math.round(G.companion.py-camY)-8)});
    list.push({base:G.py+0.5,draw:()=>dwDrawPlayer(spCtx,Math.round(G.px-camX),Math.round(G.py-camY))});
    if(D.dyn)D.dyn(list,camX,camY,spCtx);
    list.sort((a,b)=>a.base-b.base).forEach(o=>o.draw());
    dwSmoke(spCtx,camX,camY);
    if(D.overlay)D.overlay(spCtx,camX,camY);
    const psy=G.py-camY,touch='ontouchstart' in window;
    if(G.phase==='itemGet')dwDrawItemGet(spCtx,Math.round(G.px-camX),Math.round(psy),G.itemT);
    else if(G.phase!=='walk'){}
    else if(G.nearAltar&&!G.nearAltar.lit)drawPrayPrompt(spCtx,psy);
    else if(G.nearQuest){const q=G.nearQuest;if(q.done>=q.qs.length)drawPromptBox(spCtx,psy,q.name+' says:',q.thanks,'');else drawPromptBox(spCtx,psy,q.name+' says:',q.done?'"Next question! ('+(q.done+1)+' of '+q.qs.length+')"':q.hello+' ('+q.qs.length+' questions)',(touch?'TAP':'SPACE')+' to answer ▶');}
    else if(G.nearChest){
      if(G.altarsLit>=chestNeed())drawPromptBox(spCtx,psy,CHEST.label||'A treasure chest!',CHEST.text||'Something shines inside…',(touch?'TAP':'SPACE')+' '+(CHEST.action||'to open ▶'));
      else drawPromptBox(spCtx,psy,'Evangelist says:',(CHEST.locked||'"Light '+chestNeed()+' altars to open this chest."')+' ('+G.altarsLit+'/'+chestNeed()+')','');
    }
    else if(G.nearNpc)drawPromptBox(spCtx,psy,D.npc.name+' says:',D.npc.line,'');
    else if(D.promptFn&&D.promptFn())drawPromptBox(spCtx,psy,...D.promptFn(),'');
    else if(D.item&&G.altarsLit>=altarNeed()&&!dwHasBelt()&&G.py<120)drawPromptBox(spCtx,psy,'Evangelist says:',D.item.gateMsg,'');
    drawMapHUDNew(spCtx);
    drawToast(spCtx);
  }
  loop();
}

function drawAltarAt(ctx,alt,i,sx,sy){
  {
    alt.animT=(alt.animT||0)+0.06;
    const bob=Math.sin(alt.animT)*2;

    if(alt.lit){
      ctx.fillStyle='rgba(255,255,100,0.3)';ctx.beginPath();ctx.arc(sx,sy-6+bob,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,180,0.15)';ctx.beginPath();ctx.arc(sx,sy-6+bob,28,0,Math.PI*2);ctx.fill();
    }else{
      const g=0.3+Math.sin(alt.animT*1.4)*0.15;
      ctx.fillStyle=`rgba(180,160,60,${g})`;ctx.beginPath();ctx.arc(sx,sy-4+bob,12,0,Math.PI*2);ctx.fill();
    }
    // Stone base
    ctx.fillStyle=alt.lit?'#b09030':'#706050';ctx.fillRect(sx-8,sy,16,6);
    ctx.fillStyle=alt.lit?'#d8b840':'#90807a';ctx.fillRect(sx-7,sy,14,3);
    // Candle/flame
    ctx.fillStyle='#d0c0a0';ctx.fillRect(sx-2,sy-10+bob,4,10);// candle
    if(alt.lit){
      ctx.fillStyle=`rgba(255,${140+Math.floor(Math.sin(alt.animT*3)*60)},0,0.9)`;
      ctx.beginPath();ctx.arc(sx,sy-12+bob,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe080';ctx.beginPath();ctx.arc(sx,sy-13+bob,3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#c08040';ctx.fillRect(sx-1,sy-11+bob,2,2);// unlit wick
    }

    ctx.fillStyle=alt.lit?'rgba(0,50,0,0.9)':isNear?'rgba(20,20,80,0.9)':'rgba(0,0,30,0.75)';
    ctx.beginPath();ctx.arc(sx+11,sy-14,9,0,Math.PI*2);ctx.fill();

    ctx.font='bold 11px monospace';ctx.textAlign='center';

function checkAltarProximity(){
  const RANGE=24;
  let nearest=null,nearDist=RANGE*RANGE;
  G.altarData.forEach(alt=>{
    if(alt.lit)return;
    const dx=G.px-alt.x,dy=G.py-alt.y;
    const d=dx*dx+dy*dy;
    if(d<nearDist){nearDist=d;nearest=alt;}
  });
  G.nearAltar=nearest;
}

function renderBlankDisplay(ctx,q,filled,currentBlank,x,y,maxW){
  const parts=q.dp.split('___');
  let cx=x;
  ctx.font='12px monospace';ctx.textAlign='left';
  parts.forEach((part,i)=>{
    // Wrap before text segment if it would overflow — split at spaces to find break point
    ctx.fillStyle='#f0f0ff';
    const words=part.split(' ');
    words.forEach((word,wi)=>{
      const token=(wi===0?'':' ')+word;
      const tw=ctx.measureText(token).width;
      if(cx+tw>maxW+x-4&&cx>x+20){cx=x+16;y+=22;}
      ctx.fillText(token,cx,y);
      cx+=tw;
    });
    if(i<q.blanks.length){
      ctx.font='11px monospace';
      const ansW=ctx.measureText(q.blanks[i]).width;
      const bw=Math.max(70,ansW+28);
      ctx.font='12px monospace';
      // Wrap before blank box if it would overflow
      if(cx+bw>maxW+x-4){cx=x+16;y+=22;}
      const isFilled=i<filled.length;
      const isCurrent=i===currentBlank;
      ctx.fillStyle=isFilled?'#002800':isCurrent?'#000820':'#08080a';
      ctx.fillRect(cx,y-14,bw,18);
      ctx.strokeStyle=isFilled?'#30c030':isCurrent?'#f8c840':'#5050a0';
      ctx.lineWidth=2;ctx.strokeRect(cx,y-14,bw,18);
      if(isFilled){
        ctx.fillStyle='#60ff60';ctx.font='11px monospace';ctx.textAlign='left';
        ctx.save();ctx.beginPath();ctx.rect(cx+2,y-14,bw-4,18);ctx.clip();
        ctx.fillText(filled[i],cx+4,y);
        ctx.restore();
      } else if(isCurrent){
        ctx.fillStyle='#f8c840';ctx.font='10px monospace';ctx.textAlign='left';
        ctx.fillText('▶ type here',cx+4,y);
      }
      cx+=bw+6;
      ctx.font='12px monospace';
    }
  });
}

function renderWB(ctx,bank,sel,x,y){
  ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText(('ontouchstart' in window)?'WORD BANK — tap a word, then tap it again to choose:':'WORD BANK — click a word twice, or press 1-4 then Enter:',x,y-5);
  // Measure max word width to decide layout
  ctx.font='11px monospace';
  const maxWordW=Math.max(...bank.map(w=>ctx.measureText(w).width));
  const useTwo=maxWordW>90||bank.some(w=>w.length>11);
  if(useTwo){
    // 2x2 grid
    const bw=292,bh=26,gap=6;
    bank.forEach((word,i)=>{
      const col=i%2,row=Math.floor(i/2);
      const bx=x+col*(bw+gap),by=y+4+row*(bh+gap);
      const isSel=sel===i;
      ctx.fillStyle=isSel?'#0a280a':'#04040e';ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle=isSel?'#f8c840':'#404080';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
      if(isSel){ctx.fillStyle='rgba(248,200,64,0.12)';ctx.fillRect(bx,by,bw,bh);}
      ctx.fillStyle=isSel?'#f8c840':'#404060';ctx.font='8px monospace';ctx.textAlign='left';
      ctx.fillText((i+1)+'',bx+4,by+9);
      ctx.fillStyle=isSel?'#f8c840':'#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.save();ctx.beginPath();ctx.rect(bx+2,by,bw-4,bh);ctx.clip();
      ctx.fillText(word,bx+bw/2,by+18);ctx.restore();
    });
  }else{
    // single row of 4
    const bw=142,bh=30,gap=6;
    bank.forEach((word,i)=>{
      const bx=x+i*(bw+gap),by=y+4;
      const isSel=sel===i;
      ctx.fillStyle=isSel?'#0a280a':'#04040e';ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle=isSel?'#f8c840':'#404080';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
      if(isSel){ctx.fillStyle='rgba(248,200,64,0.12)';ctx.fillRect(bx,by,bw,bh);}
      ctx.fillStyle=isSel?'#f8c840':'#404060';ctx.font='8px monospace';ctx.textAlign='left';
      ctx.fillText((i+1)+'',bx+4,by+10);
      ctx.fillStyle=isSel?'#f8c840':'#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.save();ctx.beginPath();ctx.rect(bx+2,by,bw-4,bh);ctx.clip();
      ctx.fillText(word,bx+bw/2,by+20);ctx.restore();
    });
  }
}

function renderTypeBox(ctx,typed,x,y){
  ctx.fillStyle='rgba(0,0,20,0.9)';ctx.fillRect(x,y,460,26);
  ctx.strokeStyle='#4040a0';ctx.lineWidth=2;ctx.strokeRect(x,y,460,26);
  ctx.fillStyle='#c0c0ff';ctx.font='13px monospace';ctx.textAlign='left';
  ctx.fillText(typed+(Math.floor(Date.now()/500)%2?'|':''),x+6,y+18);
}

function wrapText(ctx,text,x,y,maxW,lh){
  ctx.textAlign='left';
  const words=text.split(' ');let line='',cy=y;
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,cy);cy+=lh;line=w;}else line=t;});
  if(line)ctx.fillText(line,x,cy);
}

// ─── Submit one blank ─────────────────────────────────────
function normAns(t){return String(t||'').toLowerCase().replace(/[\u2018\u2019\u02bc`]/g,"'").replace(/[.,!?;:"]+/g,'').replace(/\s+/g,' ').trim();}
function submitBlank(answer){
  if(G.diff!=='young'&&!normAns(answer))return;
  const correct=G.activeQ.blanks[G.blankIdx];
  const ok=normAns(answer)===normAns(correct);
  if(ok){
    sfxBlankOk();flash('#00aa00',0.18);
    G.filledBlanks.push(answer);
    G.blankIdx++;
    if(G.blankIdx>=G.activeQ.blanks.length){
      // all blanks filled — correct!
      sfxOk();flash('#00ff00',0.25);
      if(DRILL){G.score+=10;G.totalAnswered++;}
      else{G.score+=50+(G.streak>=2?25:0);G.streak++;G.correct++;G.qIdx++;G.totalAnswered++;}
      showQFeedback(true);
    }else{
      // next blank
      G.wbSel=0;G.wbTap=-1;G.typedAns='';_di.value='';
      G.wordBank=buildWordBank(G.activeQ.blanks,G.blankIdx);
      renderQDlg();
    }
  }else{
    // wrong on any blank — question failed
    sfxBad();flash('#ff0000',0.3);
    if(DRILL)G.totalAnswered++;
    else{G.lives=Math.max(0,G.lives-1);G.streak=0;G.wrong++;G.totalAnswered++;}
    showQFeedback(false);
  }
}

function showQFeedback(good){
  G.phase='feedback';
  markMastery(G.activeQIdx,good);
  const cv=document.getElementById('qCv'),ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=good?'rgba(0,28,0,0.97)':'rgba(28,0,0,0.97)';ctx.fillRect(0,0,640,230);
  ctx.fillStyle=good?'#20a020':'#a02020';ctx.fillRect(0,0,640,3);
  ctx.fillStyle=good?'#60ff60':'#ff6060';ctx.font='bold 20px monospace';ctx.textAlign='center';
  ctx.fillText(good?'✓ CORRECT!':'✗ WRONG!',320,40);
  ctx.fillStyle='#c0c0ff';ctx.font='11px monospace';ctx.textAlign='center';
  ctx.fillText('Full answer:',320,64);
  // Draw answer text centered — measure first to find starting x
  ctx.fillStyle='#f8c840';ctx.font='bold 12px monospace';
  const maxW=560,lh=18,margin=40;
  // Split into lines first, then center each line
  const words=G.activeQ.full.split(' ');
  let lines=[],line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);
  let ty=86;
  lines.forEach(l=>{ctx.textAlign='center';ctx.fillText(l,320,ty);ty+=lh;});
  // On wrong answer: highlight which blank was missed
  if(!good){
    const correctWord=G.activeQ.blanks[G.blankIdx];
    const ry=ty+4;
    ctx.fillStyle='rgba(0,40,0,0.92)';ctx.fillRect(100,ry,440,26);
    ctx.strokeStyle='#30ff60';ctx.lineWidth=2;ctx.strokeRect(100,ry,440,26);
    ctx.fillStyle='#30ff60';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('✓ Blank '+(G.blankIdx+1)+': "'+correctWord+'"',320,ry+17);
    // lives remaining pip display
    const livesY=ry+36;
    if(DRILL){ctx.fillStyle='#a0a0d0';ctx.font='bold 11px monospace';ctx.fillText('No heart lost. This one will come back soon!',320,livesY);}
    else{ctx.fillStyle='#606080';ctx.font='9px monospace';ctx.fillText('Lives remaining:',220,livesY);
    drawHearts(ctx,345,livesY-3,6,'#301010');}
  }
  if(good&&G.streak>=3){ctx.fillStyle='#ff8020';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('🔥 '+G.streak+'x STREAK! +25 BONUS!',320,148);}
  ctx.fillStyle='#404060';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('continuing...',320,218);
  const delay=good?1800:2400;
  setTimeout(()=>{
    document.getElementById('qDlg').style.display='none';
    G.activeQ=null;G.filledBlanks=[];G.blankIdx=0;
    if(DRILL){drillAnswered(good);return;}
    if(!document.getElementById('owScr').classList.contains('on'))return;
    // Mark altar lit on correct answer
    if(good&&G.activeAltarIdx>=0){
      const alt=G.altarData[G.activeAltarIdx];
      if(alt&&!alt.lit){
        alt.lit=true;
        G.altarsLit=Math.min(altarNeed(),G.altarsLit+1);
        if(G.wIdx<=2)G.burden=Math.max(0,Math.round(G.burden-100/30));
      }
    }
    G.activeAltarIdx=-1;
    if(G.activeQuest){const q=G.activeQuest;G.activeQuest=null;if(good){q.done++;if(q.done>=q.qs.length){G.score+=100;sfxWin();showToast(q.name+"'s quest complete! +100");}}}
    if(!good&&G.lives<=0){endWorld(false);return;}
    G.phase='walk';startMapLoop();
  },delay);
}

// ─── Keyboard for questions + pause ──────────────────────
document.addEventListener('keydown',e=>{
  // DEV SHORTCUT: Shift+B = jump straight to boss battle of current world (or world 0)
  if(e.shiftKey&&e.key==='B'){
    if(!G.name){G.name='DEV';G.gender='boy';G.diff='young';G.score=0;G.lives=3;G.worldsDone=[];G.armorEarned=[];G.totalAnswered=0;}
    const wi=G.wIdx||0;
    G.wIdx=wi;const r=WRANGES[wi];G.wQs=[];for(let i=r[0];i<=r[1];i++)G.wQs.push(i);
    G.qIdx=0;G.correct=0;G.wrong=0;G.streak=0;G.bossHP=100;
    stopLoop();show('bossBattleScr');startBossBattle();return;
  }
  if((e.key===' '||e.key==='Enter')&&G.phase==='itemGet'){e.preventDefault();if(G.itemT>(G.itemMin||70))G.phase='walk';return;}
  if((e.key===' '||e.key==='Enter')&&G.phase==='walk'&&G.nearChest&&G.altarsLit>=chestNeed()&&!G.chestOpen){e.preventDefault();dwOpenChest();return;}
  if((e.key===' '||e.key==='Enter')&&G.phase==='walk'&&G.nearQuest&&G.nearQuest.done<G.nearQuest.qs.length&&!(G.nearAltar&&!G.nearAltar.lit)){e.preventDefault();dwTalkQuest();return;}
  // Space key — interact with altar
  if((e.key===' '||e.key==='Enter')&&G.phase==='walk'&&G.nearAltar&&!G.nearAltar.lit){
    e.preventDefault();
    G.activeQuest=null;G.activeAltarIdx=G.altarData.indexOf(G.nearAltar);
    openQuestion(G.nearAltar.qIdx);
    return;
  }
  // P key toggles pause (any phase except title/name/result)
  if((e.key==='p'||e.key==='P')&&(G.phase==='walk'||(G.diff==='young'&&['question','boss'].includes(G.phase)))){
    if(G.paused)resumeGame();else pauseGame();
    return;
  }
  // Escape pauses when not in a question (ESC in question = skip)
  if(e.key==='Escape'&&G.phase==='walk'){
    if(G.paused)resumeGame();else pauseGame();
    return;
  }
  // Resume on Escape if paused mid-question or mid-boss
  if(e.key==='Escape'&&G.paused){resumeGame();return;}
  // regular question
  if(G.phase==='question'&&G.activeQ){
    if(e.key==='Escape'){skipQ();return;}
    if(G.diff==='young'){
      if(e.key==='ArrowLeft'){G.wbSel=Math.max(0,G.wbSel-1);renderQDlg();}
      else if(e.key==='ArrowRight'){G.wbSel=Math.min(G.wordBank.length-1,G.wbSel+1);renderQDlg();}
      else if(e.key>='1'&&e.key<='4'){const i=parseInt(e.key)-1;if(i<G.wordBank.length){G.wbSel=i;sfxMenu();renderQDlg();}}
      else if(e.key==='Enter'){e.preventDefault();submitBlank(G.wordBank[G.wbSel]);}
    }else{
      if(e.key==='Enter'){e.preventDefault();submitBlank(G.typedAns);}
      else if(document.activeElement!==_di){
        if(e.key==='Backspace'){G.typedAns=G.typedAns.slice(0,-1);_di.value=G.typedAns;renderQDlg();}
        else if(e.key.length===1){G.typedAns+=e.key;_di.value=G.typedAns;renderQDlg();}
      }
    }
  }
  // boss question — only when the question dialog is actually visible
  if(G.phase==='boss'&&G.bossQ&&document.getElementById('bqDlg').style.display!=='none'){
    if(G.diff==='young'){
      if(e.key==='ArrowLeft'){G.bossSel=Math.max(0,G.bossSel-1);renderBQDlg();}
      else if(e.key==='ArrowRight'){G.bossSel=Math.min(G.bossWB.length-1,G.bossSel+1);renderBQDlg();}
      else if(e.key>='1'&&e.key<='4'){const i=parseInt(e.key)-1;if(i<G.bossWB.length){G.bossSel=i;sfxMenu();renderBQDlg();}}
      else if(e.key==='Enter'){e.preventDefault();submitBossBlank(G.bossWB[G.bossSel]);}
    }else{
      if(e.key==='Enter'){e.preventDefault();submitBossBlank(G.bossTyped);}
      else if(document.activeElement!==_di){
        if(e.key==='Backspace'){G.bossTyped=G.bossTyped.slice(0,-1);_di.value=G.bossTyped;renderBQDlg();}
        else if(e.key.length===1){G.bossTyped+=e.key;_di.value=G.bossTyped;renderBQDlg();}
      }
    }
  }
});

document.getElementById('qCv').addEventListener('click',e=>{
  if(G.phase!=='question'||!G.activeQ)return;
  if(G.diff!=='young')return;
  const rect=e.target.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(640/rect.width);
  const my=(e.clientY-rect.top)*(230/rect.height);
  // detect layout
  const ctx=document.getElementById('qCv').getContext('2d');
  ctx.font='11px monospace';
  const maxW=Math.max(...G.wordBank.map(w=>ctx.measureText(w).width));
  const useTwo=maxW>90||G.wordBank.some(w=>w.length>11);
  if(useTwo){
    const bw=292,bh=26,gap=6,sx=10,sy=154;
    for(let i=0;i<G.wordBank.length;i++){
      const col=i%2,row=Math.floor(i/2);
      const bx=sx+col*(bw+gap),by=sy+row*(bh+gap);
      if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){if(G.wbTap===i){G.wbTap=-1;submitBlank(G.wordBank[i]);}else{G.wbTap=i;G.wbSel=i;sfxMenu();renderQDlg();}break;}
    }
  }else{
    const bw=142,gap=6,sx=10;
    if(my>=154&&my<=188){
      const i=Math.floor((mx-sx)/(bw+gap));
      if(i>=0&&i<G.wordBank.length){if(G.wbTap===i){G.wbTap=-1;submitBlank(G.wordBank[i]);}else{G.wbTap=i;G.wbSel=i;sfxMenu();renderQDlg();}}
    }
  }
});

function skipQ(){
  if(DRILL){sfxBad();G.phase='feedback';G.blankIdx=G.blankIdx||0;showQFeedback(false);return;}
  G.lives=Math.max(0,G.lives-1);G.streak=0;sfxBad();flash('#ff8800',0.2);
  G.activeQ=null;G.filledBlanks=[];G.blankIdx=0;G.typedAns='';_di.value='';
  document.getElementById('qDlg').style.display='none';
  if(G.lives<=0){endWorld(false);return;}
  G.phase='walk';startMapLoop();
}

  F(0,HZ,640,3,'#204a1c');

function bossRoarSFX(){
  try{
    const c=ac();
    const now=c.currentTime;
    const roars=[
      // 0 Doubter: heavy clang of armour + deep war-horn
      ()=>{
        // War-horn sweep down
        const o=c.createOscillator(),g=c.createGain();
        o.type='sawtooth';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(55,now+1.4);
        g.gain.setValueAtTime(0.45,now);g.gain.exponentialRampToValueAtTime(0.001,now+1.8);
        o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+1.8);
        // Metal clang overtones
        [440,660,880].forEach((f2,i)=>{const o2=c.createOscillator(),g2=c.createGain();o2.type='square';o2.frequency.value=f2;g2.gain.setValueAtTime(0.15,now+i*0.06);g2.gain.exponentialRampToValueAtTime(0.001,now+0.3+i*0.05);o2.connect(g2);g2.connect(c.destination);o2.start(now+i*0.06);o2.stop(now+0.4);});
        // Noise burst (sword unsheath)
        const buf=c.createBuffer(1,c.sampleRate*0.18,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2)*0.6;const src=c.createBufferSource();src.buffer=buf;const ng=c.createGain();ng.gain.value=0.7;src.connect(ng);ng.connect(c.destination);src.start(now+0.05);

      ()=>{
        // Hiss (filtered noise)

        for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.25)*0.5*(1+Math.sin(i*0.06)*0.8);
        const src=c.createBufferSource();src.buffer=buf;
        const filt=c.createBiquadFilter();filt.type='bandpass';filt.frequency.setValueAtTime(3000,now);filt.frequency.exponentialRampToValueAtTime(800,now+2);filt.Q.value=0.8;

        src.connect(filt);filt.connect(ng);ng.connect(c.destination);src.start(now);
        // Subsonic rumble
        const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=28;g.gain.setValueAtTime(0.35,now+0.2);g.gain.exponentialRampToValueAtTime(0.001,now+1.5);o.connect(g);g.connect(c.destination);o.start(now+0.2);o.stop(now+1.6);
      },
      // 2 Accuser: piercing demonic shriek — descending tritone

function buildBossWordBank(blanks, idx) {
  const correct = blanks[idx];
  const pool = [correct];
  const cat = detectWordCategory(correct);
  const catPool = shuffle([...(DISTRACTOR_POOL[cat]||DISTRACTOR_POOL.nouns)]
    .filter(d=>blanks.every(b=>b.toLowerCase()!==d.toLowerCase())&&d.toLowerCase()!==correct.toLowerCase()));
  const nounPool = shuffle([...DISTRACTOR_POOL.nouns,...DISTRACTOR_POOL.nouns_concrete]
    .filter(d=>blanks.every(b=>b.toLowerCase()!==d.toLowerCase())&&d.toLowerCase()!==correct.toLowerCase()&&!catPool.includes(d)));
  let added=0;
  for(let i=0;i<catPool.length&&added<3;i++){pool.push(catPool[i]);added++;}
  for(let i=0;i<nounPool.length&&added<3;i++){pool.push(nounPool[i]);added++;}
  return shuffle(pool.slice(0,4));
}
function extractBossBlanks(full) {
  const SKIP = new Set(['where','them','these','those','there','then','when','what','which','whom','would','could','should','shall','must','may','might','being','also','only','upon','unto','am','because','you','yours','own','a','an','the','of','to','in','is','it','by','on','as','at','or','and','but','for','with','that','this','from','into','not','no','be','my','our','us','we','him','his','her','me','do','did','he','she','they','who','how','why','can','has','have','was','were','are','had','been','its','if','so','up','out','all','both','too','very','than','their','your','will','does','just','one','nor','per','yet','any','due','via']);
  const words = full.replace(/[.,!?;:"]/g, '').split(' ');
  const blanks = [];
  words.forEach(w => {
    const lw = w.toLowerCase().trim();
    if (w.length > 1 && !SKIP.has(lw) && /[a-zA-Z]/.test(w)) blanks.push(w.trim());
  });
  return blanks;
}

function startBossBattle(){
  G.bossHP=100;
  // Grant this world's armor piece on entry (before the fight)
  if(!G.armorEarned.includes(G.wIdx))G.armorEarned.push(G.wIdx);
  // boss question = last Q in world, all content words blanked
  const bossQIdx=G.wQs[G.wQs.length-1];
  const bossQ=QS[bossQIdx];
  const bossBlanks=extractBossBlanks(bossQ.full);
  show('bossBattleScr');
  document.getElementById('bqDlg').style.display='none';
  // Play armor grant cinematic first — only set phase+bossQ AFTER it completes
  // This prevents the Enter key dismiss from instantly triggering submitBossBlank
  if(!G.bossQs||!G.bossQs.length)G.bossQs=G.wQs.slice(-Math.min(BOSS_N[G.wIdx]||4,G.wQs.length));
  const begin=()=>{
    G.phase='boss';G.bossQi=0;G.bossDone=0;
    G.bossTotal=G.bossQs.reduce((n,q)=>n+QS[q].blanks.length,0);
    loadBossQ();
    document.getElementById('bqDlg').style.display='block';
    renderBQDlg();
    if(BOSSW[G.wIdx]){useBoss();w0StartIdle();}
  };
  begin();
}

function submitBossBlank(answer){
  if(G.diff!=='young'&&!normAns(answer))return;
  G.bossTap=-1;
  const correct=(G.bossBlanks||G.bossQ.blanks)[G.bossBlankIdx];
  const ok=normAns(answer)===normAns(correct);
  if(ok){
    G.bossMiss=null;sfxBossHit();flash('#f8c840',0.22);G.bossFilledBlanks.push(answer);G.bossBlankIdx++;G.bossDone++;
    const hp=Math.max(0,Math.round(100*(1-G.bossDone/G.bossTotal)));G.lastDmg=G.bossHP-hp;G.bossHP=hp;
    const qDone=G.bossBlankIdx>=G.bossBlanks.length;
    if(qDone){markMastery(G.bossQIdx,!G.bossQMissed);G.correct++;G.totalAnswered++;}
    if(qDone&&G.bossQi>=G.bossQs.length-1){G.bossHP=0;G.score+=200;bossDefeatAnimation();return;}
    G.bossTyped='';G.bossSel=0;_di.value='';
    triggerBossAttackAnim(()=>{if(qDone){G.bossQi++;loadBossQ();}else if(G.diff==='young')G.bossWB=buildBossWordBank(G.bossBlanks,G.bossBlankIdx);renderBQDlg();});
  }else{
    sfxLose();flash('#ff0000',0.3);G.lives=Math.max(0,G.lives-1);G.wrong++;G.totalAnswered++;
    if(!G.bossQMissed){G.bossQMissed=true;markMastery(G.bossQIdx,false);}
    if(G.lives<=0){G.bossLost=true;bossWinsAnimation();return;}
    G.bossMiss=answer;G.bossTyped='';_di.value='';
    if(G.diff==='young'){G.bossWB=G.bossWB.filter(w=>w!==answer);G.bossSel=0;}
    triggerBossCounter(()=>renderBQDlg());
  }
}

function goLeaderboard(fromGameOver){
  if(_lbTimer){clearInterval(_lbTimer);_lbTimer=null;}
  const rankEl=document.getElementById('lbScrRank');
  const cdEl=document.getElementById('lbScrCountdown');
  const rowsEl=document.getElementById('lbScrRows');
  rankEl.style.display='none';
  cdEl.style.display='none';
  rowsEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:12px;text-align:center;">Loading...</div>';
  show('lbScr');

  function renderLbScr(entries){
    rowsEl.innerHTML='';
    if(!entries.length){rowsEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:12px;text-align:center;">No scores yet — be the first!</div>';return;}
    let playerRank=-1;
    if(fromGameOver){
      // Find best matching entry for current player
      playerRank=entries.findIndex(e=>e.name===G.name);
    }
    if(playerRank>=0){
      const rankNum=playerRank+1;
      const medal=rankNum===1?'🥇 ':rankNum===2?'🥈 ':rankNum===3?'🥉 ':'🎖 ';
      rankEl.textContent=medal+G.name.toUpperCase()+' — YOU RANKED #'+rankNum+'!  '+medal;
      rankEl.style.display='block';
      sfxWin();
    } else if(fromGameOver){
      rankEl.textContent='Keep going — hit the leaderboard next time!';
      rankEl.style.display='block';
      rankEl.style.color='#8080c0';
      rankEl.style.borderColor='#404060';
      rankEl.style.background='rgba(0,0,20,0.88)';
    }
    const medals=['🥇','🥈','🥉'];
    entries.forEach((e,i)=>{
      const isPlayer=fromGameOver&&i===playerRank;
      rowsEl.innerHTML+=`<div class="${isPlayer?'lb-player':''}" style="display:grid;grid-template-columns:28px 1fr 58px 1fr;font-size:7px;padding:5px 4px;border-bottom:1px solid #1a1a30;gap:4px;background:${isPlayer?'rgba(248,200,64,0.12)':'transparent'};color:${isPlayer?'#f8c840':'#c0c0ff'};">
        <span style="color:${isPlayer?'#f8c840':'#505080'}">${medals[i]||(i+1)}</span>
        <span style="${isPlayer?'font-weight:bold;':''}">${e.name}</span>
        <span style="color:${isPlayer?'#ffe060':'#f0d060'}">${e.score}</span>
        <span style="color:#505080">${e.date||''}</span>
      </div>`;
    });
    if(playerRank>4){
      setTimeout(()=>{
        const rows=rowsEl.querySelectorAll('div');
        if(rows[playerRank])rows[playerRank].scrollIntoView({behavior:'smooth',block:'center'});
      },400);
    }
  }

  const doFetch=()=>{
    if(_fbDb){
      _fbDb.ref('cq3lb').orderByChild('score').limitToLast(25).once('value',snap=>{
        const entries=[];snap.forEach(c=>entries.push(c.val()));
        entries.sort((a,b)=>b.score-a.score);
        renderLbScr(entries);
      });
    } else {
      renderLbScr(JSON.parse(localStorage.getItem('cq3lb')||'[]'));
    }
  };
  // Small delay when coming from game over to let Firebase write settle
  fromGameOver ? setTimeout(doFetch,600) : doFetch();

  if(fromGameOver){
    let count=18;
    cdEl.style.display='block';
    cdEl.textContent='Returning to title in '+count+'...';
    _lbTimer=setInterval(()=>{
      count--;
      cdEl.textContent='Returning to title in '+count+'...';
      if(count<=0){clearInterval(_lbTimer);_lbTimer=null;goTitle();}
    },1000);
  }
}

let DRILL=null,warmDone=false;
function startDrill(list,title,onDone){
  DRILL={list:list.slice(),n:list.length,i:0,ok:0,title,onDone,before:list.reduce((a,q)=>a+mastery(q).s,0)};
  G.activeQuest=null;G.activeAltarIdx=-1;openQuestion(DRILL.list[0]);

function drillAnswered(good){
  // the first miss comes back once at the end; only first tries count
  const d=DRILL;if(good&&d.i<d.n)d.ok++;else if(!good&&!d.retried){d.retried=true;d.list.push(d.list[d.i]);}
  d.i++;
  if(d.i<d.list.length){openQuestion(d.list[d.i]);return;}
  DRILL=null;d.gained=[...new Set(d.list)].reduce((a,q)=>a+mastery(q).s,0)-d.before;
  d.list=d.list.slice(0,d.n);
  save();d.onDone(d);
}

function warmupQs(w){
  const end=WRANGES[w][0],t=todayStr(),c=[];
  for(let q=0;q<end;q++){const m=mastery(q);if(m.r&&m.d!==t)c.push(q);}

  return c.slice(0,c.length>=30?5:3);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function ihLines(ctx,words,maxW){const L=[];let line=[];words.forEach(w=>{const t=[...line,w].map(x=>x.t).join(' ');if(ctx.measureText(t).width>maxW&&line.length){L.push(line);line=[w];}else line.push(w);});if(line.length)L.push(line);return L;}
function ihWrap(ctx,text,cx,y,maxW,lh){ihLines(ctx,text.split(' ').map(t=>({t})),maxW).forEach((l,i)=>ctx.fillText(l.map(x=>x.t).join(' '),cx,y+i*lh));}
// the full answer, with the memory words in gold
function ihAnswer(ctx,q,cx,y,maxW,lh){
  ctx.font='bold 20px monospace';
  const parts=q.dp.split('___'),words=[];
  parts.forEach((p,i)=>{p.split(' ').filter(Boolean).forEach(t=>words.push({t}));if(i<q.blanks.length)q.blanks[i].split(' ').forEach(t=>words.push({t,b:1}));});
  // glue punctuation that follows a blank onto it
  for(let i=words.length-1;i>0;i--)if(/^[.,;:!?)]+$/.test(words[i].t)){words[i-1].t+=words[i].t;words.splice(i,1);}
  const sp=ctx.measureText(' ').width;
  ihLines(ctx,words,maxW).forEach((l,li)=>{
    const tw=ctx.measureText(l.map(x=>x.t).join(' ')).width;let x=cx-tw/2;ctx.textAlign='left';
    l.forEach(w=>{const ww=ctx.measureText(w.t).width;if(w.b){ctx.fillStyle='#f8e0a0';ctx.fillRect(x-2,y+li*lh-18,ww+4,24);ctx.fillStyle='#8a4a00';}else ctx.fillStyle='#3a2410';ctx.fillText(w.t,x,y+li*lh);x+=ww+sp;});
  });
  ctx.textAlign='center';
}
document.getElementById('ihCv').addEventListener('click',e=>{
  const cv=e.currentTarget,r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(640/r.width),my=(e.clientY-r.top)*(480/r.height);
  if(DRILL)return;
  for(let k=IH.btns.length-1;k>=0;k--){const b=IH.btns[k];if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){b.act();return;}}
  if(IH.mode==='cards'&&!IH.flip&&my>100&&my<390){sfxMenu();IH.flip=true;}
});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('ihScr').classList.contains('on')||DRILL)return;
  if(e.key==='Escape'){e.preventDefault();if(IH.mode==='list')goWM();else{IH.mode='list';IH.msg=null;}return;}
  if(IH.mode!=='cards')return;
  if(IH.ci>=IH.deck.length)return;
  if(!IH.flip&&(e.key===' '||e.key==='Enter')){e.preventDefault();sfxMenu();IH.flip=true;}
  else if(IH.flip&&(e.key==='ArrowRight'||e.key==='Enter'||e.key===' ')){e.preventDefault();sfxOk();if(IH.ci<IH.seen)IH.known++;IH.ci++;IH.flip=false;}
  else if(IH.flip&&e.key==='ArrowLeft'){e.preventDefault();sfxMenu();IH.deck.push(IH.deck[IH.ci]);IH.ci++;IH.flip=false;}
});

drawTitle();
{const m=location.hash.match(/^#boss(\d)?$/);if(m){
  const wi=(+m[1]||1)-1;
  G.name='Preview';G.gender='boy';G.diff='young';G.score=0;G.lives=3;G.worldsDone=[];G.armorEarned=[];for(let i=0;i<=wi;i++)G.armorEarned.push(i);
  beginWorld(wi);if(wi>=2)G.burden=0;stopLoop();G.phase='bossIntro';triggerBossIntro();
}}
// Start title music on first click (audio context needs user gesture)
document.getElementById('titleScr').addEventListener('click',()=>playTitleMusic(),{once:false});
setInterval(()=>{if(document.getElementById('titleScr').classList.contains('on'))drawTitle();},4000);

// ── AUTO-SCALE: fit 640×480 game to any screen size ──────────
(function scaleGame(){
  const gc=document.getElementById('gc');
  function resize(){
    const scaleX=window.innerWidth/648;// 640 + 8px border
    const scaleY=window.innerHeight/488;
    const scale=Math.min(scaleX,scaleY);
    gc.style.transform=`scale(${scale})`;
  }
  resize();
  window.addEventListener('resize',resize);
})();
</script>
