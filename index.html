    }
  }
  // road (perspective) from foreground to the gate
  for(let y=HZ;y<480;y++){
    const t=(y-HZ)/(480-HZ),cx=GX+(W0B.pX+10-GX)*Math.pow(t,1.15),hw=8+t*62;
    const x0=Math.round(cx-hw),x1=Math.round(cx+hw);
    F(x0,y,x1-x0,1,'#9a7850');
    for(let x=x0;x<x1;x++){const h=tHash(x,y);if(h%17===0)F(x,y,1,1,'#7e5f3e');else if(h%19===0)F(x,y,1,1,'#b08e64');}
    F(x0,y,1+Math.floor(t*2),1,'#4a9230');F(x1-1-Math.floor(t*2),y,1+Math.floor(t*2),1,'#4a9230');
  }
  // hedge
  const HY=HZ-18;
  F(0,HY,640,20,'#2f6a2c');
  for(let x=0;x<640;x+=6){const r=4+(tHash(x,1)%4);pcirc(g,x+3,HY+2,r,'#3a7f34');pcirc(g,x+2,HY+1,r-2,'#478f3e');F(x+1,HY-r+2,2,1,'#5aa84a');}
  F(0,HZ,640,3,'#204a1c');
  drawArenaGate(g,GX,HY,'WICKET GATE');
  // distant trees on the horizon
  const small=dwGreenTree(1);
  [[40,HZ+4],[330,HZ+2],[420,HZ+6],[560,HZ+3],[110,HZ+8]].forEach(([x,y])=>g.drawImage(small,x-16,y-38));
  // foreground trees (2x, chunky)
  const big=dwGreenTree(0),big2=dwGreenTree(3);
  g.drawImage(big,-14,150,64,76);g.drawImage(big2,584,128,64,76);
  // foreground grass tufts
  for(let i=0;i<70;i++){const x=(i*97)%640,y=250+((i*53)%220),h=tHash(i,7);if(Math.abs(x-(W0B.pX))<90&&y>250)continue;F(x,y,2,6,'#78c852');F(x+3,y+2,2,4,'#4e9832');F(x-3,y+3,2,3,'#6cbc48');if(h%5===0)F(x,y-2,2,2,'#ffd040');}
  return cv;
}

function w0WordBolt(ctx,word,t,fromX,fromY,toX,toY){
  const x=fromX+(toX-fromX)*t,y=fromY+(toY-fromY)*t-Math.sin(t*Math.PI)*50;
  for(let i=5;i>=1;i--){const bt=Math.max(0,t-i*0.05),bx=fromX+(toX-fromX)*bt,by=fromY+(toY-fromY)*bt-Math.sin(bt*Math.PI)*50;ctx.fillStyle=`rgba(255,230,120,${0.12*(6-i)/5})`;ctx.beginPath();ctx.arc(bx,by,14-i*1.5,0,Math.PI*2);ctx.fill();}
  const gr=ctx.createRadialGradient(x,y,0,x,y,34);gr.addColorStop(0,'rgba(255,255,220,0.9)');gr.addColorStop(0.5,'rgba(255,220,90,0.45)');gr.addColorStop(1,'rgba(255,200,60,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,34,0,Math.PI*2);ctx.fill();
  ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=4;ctx.strokeStyle='#6a4a00';ctx.strokeText(word.toUpperCase(),x,y);
  ctx.fillStyle='#fff8d0';ctx.fillText(word.toUpperCase(),x,y);ctx.textBaseline='alphabetic';
}

  function introTheme(){

      });
    }

    // Fire pillars behind boss (wider, taller)
    if(f>6){
      for(let i=0;i<14;i++){
        const fx=150+Math.random()*320,fy=40+Math.random()*300;

        ctx.fillStyle=`rgba(255,${Math.floor(60+Math.random()*140)},0,${fa})`;ctx.fillRect(fx,fy,fs,fs);
      }

    // BOSS SPRITE — big, centred, with shake
    if(f>4){
      const zoom=Math.min(1,(f-4)/18);
      const bounce=f<28?Math.sin((f-4)/22*Math.PI)*22:0;
      const sc=zoom*(1+bounce*0.012);

      ctx.translate(bx+80,by+80);ctx.scale(sc,sc);ctx.translate(-80,-80);
      drawBossPixel(ctx,0,0,G.wIdx,3.4,f,'idle');
      ctx.restore();

      // ── BOSS TAUNT TEXT in screen space ──
      if(f>30&&f%40<22){
        const taunts=['"Is God even real?"','"Sin doesn\'t matter!"','"You can never be saved!"','"Make your own rules!"','"Religion is just ritual!"','"There is no hope!"'];
        const tauntCols=['#ff5050','#c040ff','#ff6030','#e0c000','#00ddc0','#c060ff'];
        ctx.fillStyle=tauntCols[G.wIdx];ctx.font='bold 18px Courier New';ctx.textAlign='center';
        ctx.fillText(taunts[G.wIdx],320,408);
      }
    }

    // Boss name slams in
    if(f>20){
      const ta=Math.min(1,(f-20)/10);

      ctx.fillStyle=`rgba(180,0,0,${ta*0.65})`;ctx.fillRect(60,285+slam,520,52);
      ctx.strokeStyle='#ff2020';ctx.lineWidth=2.5;ctx.strokeRect(60,285+slam,520,52);
      ctx.strokeStyle='rgba(255,100,100,0.25)';ctx.lineWidth=1;ctx.strokeRect(64,288+slam,512,46);
      ctx.font='bold 26px Courier New';ctx.textAlign='center';
      ctx.fillStyle='rgba(255,0,0,0.45)';ctx.fillText(w.boss.name.toUpperCase(),323,322+slam);
      ctx.fillStyle='rgba(0,0,255,0.45)';ctx.fillText(w.boss.name.toUpperCase(),317,322+slam);
      ctx.fillStyle='#ff5050';ctx.fillText(w.boss.name.toUpperCase(),320,322+slam);
      ctx.restore();
      if(f===21){tone(44,0.35,'sawtooth',0.4);tone(38,0.35,'sawtooth',0.32);}
    }

    // Warning bar
    if(f>32){
      const wa=Math.min(1,(f-32)/12);
      const wblink=Math.floor(f/7)%2===0;
      ctx.save();ctx.globalAlpha=wa;
      ctx.fillStyle=wblink?'#ff1a1a':'#700000';ctx.fillRect(0,350,W,34);
      ctx.strokeStyle='#ff3030';ctx.lineWidth=2;ctx.strokeRect(0,350,W,34);
      ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('⚠  '+w.boss.sub+'  ⚠',320,372);
      ctx.restore();
    }

    // Vignette
    const vg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,400);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.78)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    // Continue prompt
    if(introDone){
      const blink=Math.floor(f/20)%2===0;
      ctx.globalAlpha=blink?1:0.38;
      ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('▶  PRESS ENTER OR CLICK TO FACE THIS FOE  ◀',W/2,462);
      ctx.globalAlpha=1;
    }

    // SFX triggers
    if(f===8){introTheme();}
    if(f===14){bossRoarSFX();shakeX=20;shakeY=16;}
    if(f>=16&&f<45&&f%5===0){shakeX=(Math.random()-0.5)*12;shakeY=(Math.random()-0.5)*9;}

    f++;
    if(f<90)requestAnimationFrame(anim);
    else{introDone=true;requestAnimationFrame(anim);}
  };
  anim();
}

function buildBossDisplayStr(full, blanks) {
  let result = full;
  blanks.forEach(b => {
    const idx = result.indexOf(b);
    if (idx !== -1) result = result.slice(0, idx) + '___' + result.slice(idx + b.length);
  });
  return result;
}
function buildBossWordBank(blanks, idx) {
  const correct = blanks[idx];
  const pool = [correct];
  const cat = detectWordCategory(correct);
  const catPool = shuffle([...(DISTRACTOR_POOL[cat]||DISTRACTOR_POOL.nouns)]
    .filter(d=>blanks.every(b=>b.toLowerCase()!==d.toLowerCase())&&d.toLowerCase()!==correct.toLowerCase()));
  const nounPool = shuffle([...DISTRACTOR_POOL.nouns,...DISTRACTOR_POOL.nouns_concrete]
    .filter(d=>blanks.every(b=>b.toLowerCase()!==d.toLowerCase())&&d.toLowerCase()!==correct.toLowerCase()&&!catPool.includes(d)));
  let added=0;
  for(let i=0;i<catPool.length&&added<3;i++){pool.push(catPool[i]);added++;}
  for(let i=0;i<nounPool.length&&added<3;i++){pool.push(nounPool[i]);added++;}
  return shuffle(pool.slice(0,4));
}
function extractBossBlanks(full) {
  const SKIP = new Set(['them','these','those','there','then','when','what','which','whom','would','could','should','shall','must','may','might','being','also','only','upon','unto','am','because','you','yours','own','a','an','the','of','to','in','is','it','by','on','as','at','or','and','but','for','with','that','this','from','into','not','no','be','my','our','us','we','him','his','her','me','do','did','he','she','they','who','how','why','can','has','have','was','were','are','had','been','its','if','so','up','out','all','both','too','very','than','their','your','will','does','just','one','nor','per','yet','any','due','via']);
  const words = full.replace(/[.,!?;:"]/g, '').split(' ');
  const blanks = [];
  words.forEach(w => {
    const lw = w.toLowerCase().trim();
    if (w.length > 1 && !SKIP.has(lw) && /[a-zA-Z]/.test(w)) blanks.push(w.trim());
  });
  return blanks;
}

function startBossBattle(){
  G.bossHP=100;
  // Grant this world's armor piece on entry (before the fight)
  if(!G.armorEarned.includes(G.wIdx))G.armorEarned.push(G.wIdx);
  // boss question = last Q in world, all content words blanked
  const bossQIdx=G.wQs[G.wQs.length-1];
  const bossQ=QS[bossQIdx];
  const bossBlanks=extractBossBlanks(bossQ.full);
  show('bossBattleScr');
  document.getElementById('bqDlg').style.display='none';
  // Play armor grant cinematic first — only set phase+bossQ AFTER it completes
  // This prevents the Enter key dismiss from instantly triggering submitBossBlank
  const begin=()=>{
    G.phase='boss';
    G.bossQ=bossQ;
    G.bossBlanks=bossBlanks;
    G.bossDisplayStr=buildBossDisplayStr(bossQ.full,bossBlanks);
    G.bossBlankIdx=0;G.bossFilledBlanks=[];G.bossTyped='';G.bossSel=0;_di.value='';G.bossMiss=null;
    G.bossMaxBlanks=bossBlanks.length;
    if(G.diff==='young'){G.bossWB=buildBossWordBank(bossBlanks,0);}
    document.getElementById('bqDlg').style.display='block';
    renderBQDlg();
    if(BOSSW[G.wIdx]){useBoss();w0StartIdle();}
  };
  if(BOSSW[G.wIdx])begin();else triggerArmorGrant(begin);
}

function triggerArmorGrant(onDone){
  const cv=document.getElementById('bbCv'),ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const ap=ARMOR[G.wIdx];
  const apCol=ARMOR_BATTLE_COLS[G.wIdx];
  let f=0,animDone=false,dismissed=false;
  function dismiss(){if(dismissed)return;dismissed=true;cleanup();onDone();}
  function cleanup(){document.removeEventListener('keydown',keyH);cv.removeEventListener('click',clickH);}
  function keyH(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(animDone)dismiss();}}
  function clickH(){if(animDone)dismiss();}
  document.addEventListener('keydown',keyH);
  cv.addEventListener('click',clickH);
  drawBattleBg();
  function anim(){
    if(dismissed)return;
    drawBattleBg();
    const ta=Math.min(1,f/15);
    ctx.fillStyle=`rgba(0,0,20,${ta*0.85})`;ctx.fillRect(0,0,640,480);
    // Light beam
    if(f>5){
      const ba=Math.min(1,(f-5)/18);
      const gr=ctx.createLinearGradient(320,0,320,420);
      gr.addColorStop(0,`rgba(255,240,180,${ba*0.85})`);gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;ctx.fillRect(268,0,104,420);
      const gr2=ctx.createLinearGradient(320,0,320,500);
      gr2.addColorStop(0,`rgba(255,240,180,${ba*0.3})`);gr2.addColorStop(1,'transparent');
      ctx.fillStyle=gr2;ctx.beginPath();ctx.moveTo(200,0);ctx.lineTo(440,0);ctx.lineTo(390,500);ctx.lineTo(250,500);ctx.closePath();ctx.fill();
      // rotating halo
      for(let i=0;i<3;i++){const ra=f*0.05+i*Math.PI*0.66;
        ctx.strokeStyle=`rgba(255,240,180,${0.5*ba-i*0.12})`;ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(320,220,35+i*14+Math.sin(f*0.1+i)*5,14+i*5,ra,0,Math.PI*2);ctx.stroke();}
    }
    // Item drops in
    if(f>8){
      const itemY=Math.max(190,400-Math.min(1,(f-8)/18)*210);
      const glow=Math.sin(f*0.2)*0.12+0.65;
      ctx.fillStyle=`rgba(255,220,80,${glow*0.35})`;ctx.beginPath();ctx.arc(320,itemY,38,0,Math.PI*2);ctx.fill();
      for(let i=0;i<3;i++){ctx.strokeStyle=`rgba(255,240,180,${0.45-i*0.12})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(320,itemY,28+i*13+Math.sin(f*0.14+i)*4,0,Math.PI*2);ctx.stroke();}
      ctx.font='52px serif';ctx.textAlign='center';ctx.fillText(ap.p,320,itemY+18);
    }
    // Text panel
    if(f>22){
      const ta2=Math.min(1,(f-22)/10);
      ctx.fillStyle=`rgba(0,0,20,${ta2*0.92})`;ctx.fillRect(80,308,480,120);
      ctx.strokeStyle=apCol;ctx.lineWidth=3;ctx.strokeRect(80,308,480,120);
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.strokeRect(87,315,466,106);
      ctx.globalAlpha=ta2;
      ctx.fillStyle=apCol;ctx.font='bold 15px Courier New';ctx.textAlign='center';
      ctx.fillText(ap.p+'  '+ap.n.toUpperCase()+'  '+ap.p,320,345);
      ctx.fillStyle='#c0e8ff';ctx.font='9px monospace';ctx.fillText('EQUIPPED FOR BATTLE!',320,365);
      ctx.fillStyle='rgba(255,255,200,0.85)';ctx.font='8px monospace';
      ctx.fillText(ARMOR_BATTLE_DESC[G.wIdx],320,385);
      ctx.globalAlpha=1;
    }
    // "Press Enter" prompt — shown after anim completes
    if(animDone){
      const blink=Math.floor(f/22)%2===0;
      ctx.globalAlpha=blink?1:0.45;
      ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('▶  PRESS ENTER OR CLICK TO CONTINUE  ◀',320,462);
      ctx.globalAlpha=1;
    }
    f++;
    if(f<90){requestAnimationFrame(anim);}
    else{animDone=true;requestAnimationFrame(anim);}// keep animating for blink effect
  }
  anim();
}

// ── Helper: easing ────────────────────────────────────────────
function bEaseOut(t){return 1-Math.pow(1-t,3);}
function bEaseIn(t){return t*t*t;}

// ── Helper: chroma text ───────────────────────────────────────
function bChromaText(ctx,text,x,y,col,size,ab=4){
  ctx.font=`bold ${size}px Courier New`;ctx.textAlign='center';
  ctx.fillStyle='rgba(255,0,0,0.5)';ctx.fillText(text,x+ab,y);
  ctx.fillStyle='rgba(0,0,255,0.5)';ctx.fillText(text,x-ab,y);
  ctx.fillStyle=col;ctx.fillText(text,x,y);
}

// ── Helper: manga speed lines ─────────────────────────────────
function bSpeedLines(ctx,cx,cy,count,r0,r1,col,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;
  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2+(Math.random()-0.5)*0.06;
    const len=r0+Math.random()*(r1-r0);
    ctx.lineWidth=0.5+Math.random()*2;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();
  }
  ctx.restore();
}

// ── World-specific boss death FX ──────────────────────────────
function bossDeath_crumble(ctx,bx,by,f){
  const t=Math.min(1,f/45);
  ctx.save();ctx.globalAlpha=Math.max(0,1-t*1.3);
  drawBossPixel(ctx,bx,by,0,2.8,0,'idle');ctx.restore();
  for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;const sp=2+i%3;
    const px=bx+80+Math.cos(a)*sp*f*0.5,py=by+60+Math.sin(a)*sp*f*0.4+0.12*f*f*0.35;
    ctx.save();ctx.globalAlpha=Math.max(0,1-t*1.1);ctx.translate(px,py);ctx.rotate(a+f*0.08);ctx.scale(0.4,0.4);
    ctx.fillStyle=['#500','#800','#a00','#600','#300','#700','#900','#400'][i];ctx.fillRect(-12,-12,24,24);ctx.restore();}
  for(let i=0;i<5;i++){const a2=i*Math.PI/2.5;ctx.fillStyle=`rgba(180,120,80,${0.28*t})`;ctx.beginPath();ctx.arc(bx+80+Math.cos(a2)*42*t,by+80,14+i*7*t,0,Math.PI*2);ctx.fill();}
}
function bossDeath_dissolve(ctx,bx,by,f){
  const t=Math.min(1,f/48);
  ctx.save();ctx.globalAlpha=Math.max(0,1-t);
  ctx.translate(bx+80,by+60);ctx.scale(1+t*0.3,1+t*0.3);ctx.translate(-80,-60);
  ctx.fillStyle=`rgba(80,0,120,${t*0.65})`;ctx.fillRect(bx,by,160,140);
  drawBossPixel(ctx,bx,by,1,2.8,0,'idle');ctx.restore();
  for(let i=0;i<8;i++){const a=i*Math.PI/4+f*0.04;
    ctx.strokeStyle=`rgba(60,0,100,${t*0.8})`;ctx.lineWidth=3+i%3*2;
    ctx.beginPath();ctx.moveTo(bx+80+Math.cos(a)*20*t,by+80+Math.sin(a)*10*t);
    ctx.lineTo(bx+80+Math.cos(a)*80*t,by+80+Math.sin(a)*110*t+f*2);ctx.stroke();}
}
function bossDeath_scatter(ctx,bx,by,f){
  const t=Math.min(1,f/42);
  ctx.save();ctx.globalAlpha=Math.max(0,1-t*1.2);
  ctx.translate(bx+80,by+60);ctx.scale(1,1-t*0.5);ctx.translate(-80,-60);
  drawBossPixel(ctx,bx,by,2,2.8,0,'idle');ctx.restore();
  for(let i=0;i<12;i++){const a=i*Math.PI/6+f*0.03;const sp=3+i%4;
    const fx=bx+80+Math.cos(a)*sp*f*0.6,fy=by+60+Math.sin(a)*sp*f*0.4-f*0.7;
    ctx.fillStyle=`rgba(255,${80+i*10},0,${Math.max(0,0.9-t)})`;ctx.beginPath();ctx.arc(fx,fy,3+i%3*2,0,Math.PI*2);ctx.fill();}
}
function bossDeath_shatter(ctx,bx,by,f){
  const t=Math.min(1,f/42);
  ctx.save();ctx.globalAlpha=Math.max(0,1-t*1.1);
  ctx.translate(bx+80,by+60);const crack=Math.sin(f*1.1)*t*4;ctx.translate(crack,0);ctx.translate(-80,-60);
  drawBossPixel(ctx,bx,by,3,2.8,0,'idle');ctx.restore();
  for(let i=0;i<10;i++){const a=i*Math.PI/5+f*0.02;const sp=1.5+i%3;
    const sx=bx+80+Math.cos(a)*sp*f*0.7,sy=by+60+Math.sin(a)*sp*f*0.5+0.15*f*f*0.18;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(a+f*0.1);
    ctx.fillStyle=['#333','#555','#444','#222','#666'][i%5];ctx.fillRect(-8,-6,16,12);
    ctx.fillStyle='rgba(200,160,0,0.55)';ctx.fillRect(-3,-2,6,4);ctx.restore();}
  ctx.fillStyle=`rgba(140,100,60,${t*0.35})`;ctx.beginPath();ctx.ellipse(bx+80,by+132,50*t,18*t,0,0,Math.PI*2);ctx.fill();
}
function bossDeath_sink(ctx,bx,by,f){
  const t=Math.min(1,f/52);const sinkY=by+t*110;
  ctx.save();ctx.beginPath();ctx.rect(0,0,640,by+82+t*80);ctx.clip();
  ctx.globalAlpha=Math.max(0,1-t*0.8);ctx.translate(bx+80,sinkY+60);ctx.scale(1,1-t*0.3);ctx.translate(-80,-60);
  drawBossPixel(ctx,bx,sinkY,4,2.8,0,'idle');ctx.restore();
  for(let i=0;i<4;i++){const rr=18+i*17+t*28;ctx.strokeStyle=`rgba(64,160,255,${Math.max(0,0.55-t-i*0.1)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(bx+80,by+80,rr,rr*0.32,0,0,Math.PI*2);ctx.stroke();}
  for(let i=0;i<6;i++){const bx2=bx+48+i*14,by2=by+80-i*11*t-f*0.75;ctx.fillStyle=`rgba(120,200,255,${Math.max(0,0.55-t)})`;ctx.beginPath();ctx.arc(bx2,by2,2+i%3,0,Math.PI*2);ctx.fill();}
}
function bossDeath_ascend(ctx,bx,by,f){
  const t=Math.min(1,f/52);const riseY=by-t*95;
  ctx.save();ctx.globalAlpha=Math.max(0,1-t*1.0);
  ctx.translate(bx+80,riseY+60);ctx.scale(1+t*0.35,1+t*0.35);ctx.translate(-80,-60);
  ctx.fillStyle=`rgba(255,220,80,${t*0.55})`;ctx.fillRect(bx,riseY,160,140);
  drawBossPixel(ctx,bx,riseY,5,2.8,0,'idle');ctx.restore();
  for(let i=0;i<14;i++){const fx=bx+18+i*11,fy=riseY+by/2+Math.sin(f*0.14+i)*18;
    ctx.fillStyle=`rgba(255,${180+i*4},0,${0.65*t})`;ctx.beginPath();ctx.arc(fx,fy,4+i%4*3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,180,${0.45*t})`;ctx.beginPath();ctx.arc(fx,fy-4,2,0,Math.PI*2);ctx.fill();}
}

// Touch controls for overworld — joystick-style drag to move, tap altar to pray
(function(){
  let touchStart=null,moveJoy=null;
  const ow=document.getElementById('owScr');
  ow.addEventListener('touchstart',e=>{
    if(G.phase==='itemGet'){e.preventDefault();return;}
    if(G.phase!=='walk')return;
    const t=e.touches[0];
    const rect=ow.getBoundingClientRect();
    const scale=640/rect.width;
    const tx=(t.clientX-rect.left)*scale,ty=(t.clientY-rect.top)*scale;
    touchStart={x:tx,y:ty};
    moveJoy={x:tx,y:ty};
    e.preventDefault();
  },{passive:false});
  ow.addEventListener('touchmove',e=>{
    if(G.phase!=='walk'||!touchStart)return;
    const t=e.touches[0];
    const rect=ow.getBoundingClientRect();
    const scale=640/rect.width;
    moveJoy={x:(t.clientX-rect.left)*scale,y:(t.clientY-rect.top)*scale};
    const dx=moveJoy.x-touchStart.x,dy=moveJoy.y-touchStart.y;
    keys.up=dy<-12;keys.down=dy>12;keys.left=dx<-12;keys.right=dx>12;
    e.preventDefault();
  },{passive:false});
  ow.addEventListener('touchend',e=>{
    keys.up=keys.down=keys.left=keys.right=false;
    if(G.phase==='itemGet'){if(G.itemT>(G.itemMin||70))G.phase='walk';touchStart=null;moveJoy=null;return;}
    if(touchStart&&moveJoy&&G.phase==='walk'&&G.nearChest&&G.altarsLit>=CHEST_NEED&&!G.chestOpen){
      const dx=moveJoy.x-touchStart.x,dy=moveJoy.y-touchStart.y;
      if(Math.abs(dx)<12&&Math.abs(dy)<12){dwOpenChest();touchStart=null;moveJoy=null;return;}
    }
    // Tap near altar = interact
    if(touchStart&&moveJoy){
      const dx=moveJoy.x-touchStart.x,dy=moveJoy.y-touchStart.y;
      if(Math.abs(dx)<12&&Math.abs(dy)<12&&G.nearAltar&&!G.nearAltar.lit){
        G.activeAltarIdx=G.altarData.indexOf(G.nearAltar);
        openQuestion(G.nearAltar.qIdx);
      }
    }
    touchStart=null;moveJoy=null;
  },{passive:true});
})();

// Attack animation fired on every correct boss answer (non-fatal)
function triggerBossAttackAnim(onDone){
  if(BOSSW[G.wIdx]){useBoss();w0AttackAnim(onDone);return;}
  const cv=document.getElementById('bbCv'),ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const apCol=ARMOR_BATTLE_COLS[G.wIdx],armorIdx=G.wIdx;
  const pX=452,pY=215; // pilgrim standing position
  const bX=168,bY=164; // boss front chest (scale 2.8 from bossX=55,bossY=38)
  const bqDlg=document.getElementById('bqDlg');
  bqDlg.style.display='none';
  let f=0;
  // Quick ascending SFX to signal the strike
  tone(420,0.03,'square',0.13);setTimeout(()=>tone(560,0.03,'square',0.15),90);setTimeout(()=>tone(740,0.04,'square',0.18),170);
  function step(){
    f++;
    renderBossScene();
    if(f<=10){
      // Windup: pilgrim crouches/raises weapon, golden charge ring pulses
      const a=f/10;
      const gr=ctx.createRadialGradient(pX+24,pY+24,0,pX+24,pY+24,46);
      gr.addColorStop(0,`rgba(255,255,180,${a*0.75})`);gr.addColorStop(0.55,`rgba(255,210,60,${a*0.3})`);gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(pX+24,pY+24,46,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.globalAlpha=a*0.7;ctx.strokeStyle=apCol;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(pX+24,pY+24,28+f*1.8,0,Math.PI*2);ctx.stroke();ctx.restore();
      drawArmorWeaponBattle(ctx,pX+56,pY-22,armorIdx,-Math.PI*0.62,3.1);
    } else if(f<=26){
      // Projectile bolt arcs from pilgrim to boss
      const t=(f-10)/16;
      const px=pX+28+(bX-pX-28)*t;
      const py=pY+18+(bY-pY-18)*t-Math.sin(t*Math.PI)*26;
      // Trail ghost copies fading behind
      for(let i=4;i>=1;i--){
        const bt=Math.max(0,t-i*0.065);
        const bpx=pX+28+(bX-pX-28)*bt,bpy=pY+18+(bY-pY-18)*bt-Math.sin(bt*Math.PI)*26;
        ctx.save();ctx.globalAlpha=0.20-i*0.038;ctx.fillStyle=apCol;
        ctx.beginPath();ctx.arc(bpx,bpy,Math.max(1,(5-i)*3.2),0,Math.PI*2);ctx.fill();ctx.restore();
      }
      // Core orb: white center → armor color rim
      const gr=ctx.createRadialGradient(px,py,0,px,py,13);
      gr.addColorStop(0,'#ffffff');gr.addColorStop(0.3,'rgba(255,255,200,0.9)');gr.addColorStop(0.65,apCol);gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(px-1,py-1,3.5,0,Math.PI*2);ctx.fill();
      // Sparks along trail
      ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle='#ffe080';
      ctx.fillRect(px-1,py-3,2,6);ctx.fillRect(px-3,py-1,6,2);ctx.restore();
      drawArmorWeaponBattle(ctx,pX+56,pY-8,armorIdx,-Math.PI*0.28,2.5);
    } else if(f<=38){
      // Impact: burst ring + flash at boss position
      const p=(f-26)/12,flashA=Math.max(0,1-p)*0.85;
      const rr=(f-26)*9;
      // Radial burst
      const gr2=ctx.createRadialGradient(bX,bY,0,bX,bY,rr);
      gr2.addColorStop(0,`rgba(255,255,200,${flashA*0.9})`);gr2.addColorStop(0.4,`rgba(255,210,80,${flashA*0.55})`);gr2.addColorStop(1,'transparent');
      ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(bX,bY,rr+4,0,Math.PI*2);ctx.fill();
      // Expanding ring
      ctx.save();ctx.globalAlpha=flashA*0.95;ctx.strokeStyle=apCol;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(bX,bY,rr,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(bX,bY,rr*0.6,0,Math.PI*2);ctx.stroke();ctx.restore();
      // Spiky cross flash
      ctx.save();ctx.globalAlpha=flashA*0.7;ctx.fillStyle='#fff8c0';
      ctx.fillRect(bX-2,bY-22,4,44);ctx.fillRect(bX-22,bY-2,44,4);ctx.restore();
      drawArmorWeaponBattle(ctx,pX+56,pY-2,armorIdx,-Math.PI*0.12,2.4);
    } else {
      bqDlg.style.display='block';
      triggerBossShudder();
      onDone();
      return;
    }
    requestAnimationFrame(step);
  }
  step();
}

function submitBossBlank(answer){
  const correct=(G.bossBlanks||G.bossQ.blanks)[G.bossBlankIdx];
  const ok=answer.toLowerCase().trim()===correct.toLowerCase().trim();
  if(ok){
    G.bossMiss=null;sfxBossHit();flash('#f8c840',0.22);G.bossFilledBlanks.push(answer);G.bossBlankIdx++;
    const dmgPer=Math.floor(100/G.bossMaxBlanks);G.bossHP=Math.max(0,G.bossHP-dmgPer);showBossDamageNumber(dmgPer);
    if(G.bossBlankIdx>=G.bossMaxBlanks){G.bossHP=0;G.score+=200;G.correct++;G.totalAnswered++;bossDefeatAnimation();}
    else{G.bossTyped='';G.bossSel=0;_di.value='';if(G.diff==='young')G.bossWB=buildBossWordBank(G.bossBlanks||G.bossQ.blanks,G.bossBlankIdx);triggerBossAttackAnim(()=>{renderBQDlg();});}
  }else{
    sfxLose();flash('#ff0000',0.3);G.lives=Math.max(0,G.lives-1);G.wrong++;G.totalAnswered++;
    if(G.lives<=0){G.bossLost=true;bossWinsAnimation();return;}
    G.bossMiss=answer;G.bossTyped='';_di.value='';
    if(G.diff==='young'){G.bossWB=G.bossWB.filter(w=>w!==answer);G.bossSel=0;}
    triggerBossCounter(()=>renderBQDlg());
  }
}

function bossDefeatAnimation(){
  if(BOSSW[G.wIdx]){useBoss();w0Victory();return;}
  document.getElementById('bqDlg').style.display='none';
  const cv=document.getElementById('bbCv'),ctx=cv.getContext('2d');

  let particles=[],shockRings=[],embers=[];
  let animPhase='epicCharge',f=0,screenShakeX=0,screenShakeY=0,whiteFlash=0;
  const coinsList=[];for(let i=0;i<22;i++)coinsList.push({x:Math.random()*620+10,y:-30-Math.random()*280,vy:1.6+Math.random()*2,vx:(Math.random()-0.5)*1.2,spin:Math.random()*Math.PI*2});

  function addRing(cx,cy,col,speed=20,maxR=360){shockRings.push({x:cx,y:cy,r:8,maxR,col,life:1,speed});}
  function addEmbers(cx,cy,count=25,cols=['#f8c840','#ff8020','#fff']){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*7;embers.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,decay:0.011+Math.random()*0.016,col:cols[Math.floor(Math.random()*cols.length)]});}}
  function sfxCharge(){[330,370,420,480,560,660].forEach((n,i)=>setTimeout(()=>tone(n,0.04,'square',0.14),i*45));}
  function sfxImpact(){tone(80,0.05,'sawtooth',0.4);setTimeout(()=>tone(55,0.1,'sawtooth',0.28),45);}
  function drawHUD(){ctx.fillStyle='rgba(0,0,10,0.93)';ctx.fillRect(0,0,640,22);ctx.fillStyle='#200020';ctx.fillRect(0,20,640,2);ctx.fillStyle='#ff4040';ctx.fillRect(0,21,640,1);ctx.fillStyle='#f8c840';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('⭐'+G.score,8,15);ctx.fillStyle='#ff6060';ctx.textAlign='center';ctx.font='bold 9px monospace';ctx.fillText('⚔  BOSS BATTLE  ⚔',320,15);}
  function step(){
    f++;screenShakeX*=0.72;screenShakeY*=0.72;
    ctx.save();if(Math.abs(screenShakeX)>0.3||Math.abs(screenShakeY)>0.3)ctx.translate(Math.round(screenShakeX),Math.round(screenShakeY));
    drawBattleBg();ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(pilgrimX+24,275+10,28,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(bossX+bossOffX+80,275+10,44,9,0,0,Math.PI*2);ctx.fill();drawHUD();
    if(animPhase==='epicCharge'){
      // Dark vignette builds in over first 24 frames
      const vigA=Math.min(0.70,f*0.029);
      ctx.fillStyle=`rgba(0,0,0,${vigA})`;ctx.fillRect(0,0,640,480);
      // Boss trembles with escalating fear — re-draw on top of darkness

      // Particles building up
      if(f%4===0)addPx(pilgrimX+24,pilgrimY+24,2,[apCol,'#fff','#ffe080'],3,0.05,3);
      // Weapon raised high with growing scale
      const wSc=Math.min(3.6,2.4+f*0.016),wAng=-Math.PI*0.58-Math.sin(f*0.09)*0.1;
      drawArmorWeaponBattle(ctx,pilgrimX+56,pilgrimY-22,armorIdx,wAng,wSc);
      // Pilgrim with gentle bob
      drawPilgrimCanvas(ctx,pilgrimX,pilgrimY+Math.round(Math.sin(f*0.13)*3),G.armorEarned,2.2);

        // "FINAL BLOW!" persists top-center

      for(let i=1;i<=4;i++){ctx.save();ctx.globalAlpha=0.09;ctx.translate(pilgrimX+24,pilgrimY+pilgrimFallY-i*pilgrimFallVY*0.7+30);ctx.rotate(pilgrimFallAngle-i*4*Math.PI/180);ctx.translate(-24,-30);drawPilgrimCanvas(ctx,0,0,G.armorEarned,2.2);ctx.restore();}
      ctx.save();ctx.translate(pilgrimX+24,pilgrimY+pilgrimFallY+30);ctx.rotate(pilgrimFallAngle);ctx.translate(-24,-30);drawPilgrimCanvas(ctx,0,0,G.armorEarned,2.2);ctx.restore();
      const hx=pilgrimX+24,hy=pilgrimY+pilgrimFallY+4;for(let i=0;i<5;i++){const a=f*0.12+i*Math.PI*0.4,sr=24+Math.sin(f*0.1+i)*4;ctx.fillStyle='rgba(255,220,0,0.82)';ctx.font='10px serif';ctx.textAlign='center';ctx.fillText('★',hx+Math.cos(a)*sr,hy+Math.sin(a)*sr*0.4);}
      const arFX=pilgrimX+42+30*6+f*2,arFY=pilgrimY-150+f*3.2;if(arFY<350){ctx.globalAlpha=Math.max(0,1-f*0.025);drawArmorWeaponBattle(ctx,arFX,arFY,armorIdx,f*0.17,Math.max(0.6,2.2-f*0.025));ctx.globalAlpha=1;}
      if(pilgrimFallY>85&&pilgrimFallVY>0){pilgrimFallVY=-1.9;addPx(pilgrimX,pilgrimY+88,15,['#c8a050','#909060'],4,0.1,4);}
      ctx.save();ctx.translate(bossX+bossOffX+80,bossY+60);ctx.scale(bossScale,bossScale);ctx.translate(-80,-60);drawBossPixel(ctx,bossX,bossY,G.wIdx,2.8,0,'idle');ctx.restore();
      if(f>70){animPhase='cameraZoom';f=0;darkAlpha=0;}
    }
    if(animPhase==='cameraZoom'){
      darkAlpha=Math.min(0.84,f*0.016);ctx.fillStyle=`rgba(0,0,0,${darkAlpha})`;ctx.fillRect(0,0,640,480);
      const zs=1+bEaseOut(Math.min(1,f/42))*0.85;
      ctx.save();ctx.translate(bossX+80,bossY+60);ctx.scale(zs,zs);ctx.translate(-80,-60);ctx.globalAlpha=Math.min(1,f/14);drawBossPixel(ctx,bossX,bossY,G.wIdx,2.8,0,'idle');ctx.globalAlpha=1;ctx.restore();
      const pulse2=Math.sin(f*0.19)*0.1+0.3,dr2=ctx.createRadialGradient(bossX+80,bossY+60,0,bossX+80,bossY+60,105*zs);dr2.addColorStop(0,`rgba(180,0,0,${pulse2})`);dr2.addColorStop(1,'transparent');ctx.fillStyle=dr2;ctx.beginPath();ctx.arc(bossX+80,bossY+60,105*zs,0,Math.PI*2);ctx.fill();
      bSpeedLines(ctx,bossX+80,bossY+60,52,82*zs,310,'#ff0000',0.06+Math.sin(f*0.1)*0.025);
      ctx.save();ctx.globalAlpha=0.38;ctx.translate(pilgrimX+24,pilgrimY+pilgrimFallY+30);ctx.rotate(pilgrimFallAngle);ctx.translate(-24,-30);drawPilgrimCanvas(ctx,0,0,G.armorEarned,2.2);ctx.restore();
      if(f>50){animPhase='defeatBanner';f=0;}
    }
    if(animPhase==='defeatBanner'){
      const t=Math.min(1,f/30);ctx.fillStyle='rgba(0,0,0,0.87)';ctx.fillRect(0,0,640,480);
      const zs=1.82;ctx.save();ctx.translate(bossX+80,bossY+60);ctx.scale(zs,zs);ctx.translate(-80,-60);ctx.globalAlpha=0.52;drawBossPixel(ctx,bossX,bossY,G.wIdx,2.8,0,'idle');ctx.globalAlpha=1;ctx.restore();
      const dr3=ctx.createRadialGradient(bossX+80,bossY+80,0,bossX+80,bossY+80,168);dr3.addColorStop(0,'rgba(160,0,0,0.33)');dr3.addColorStop(1,'transparent');ctx.fillStyle=dr3;ctx.beginPath();ctx.arc(bossX+80,bossY+80,168,0,Math.PI*2);ctx.fill();
      const panY=480-Math.min(480,bEaseOut(t)*318);ctx.fillStyle='rgba(8,0,0,0.97)';ctx.fillRect(48,panY,544,290);ctx.strokeStyle='#800000';ctx.lineWidth=4;ctx.strokeRect(48,panY,544,290);ctx.strokeStyle='rgba(200,0,0,0.22)';ctx.lineWidth=1;ctx.strokeRect(56,panY+8,528,274);
      if(t>0.42){const tsc=t>0.68?1:0.58+(t-0.42)*1.55;ctx.save();ctx.translate(320,panY+82);ctx.scale(tsc,tsc);bChromaText(ctx,'DEFEATED!',0,0,'#ff2020',46,6);ctx.restore();}
      if(t>0.62){ctx.fillStyle='#ff6060';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(w.boss.name.toUpperCase()+' OVERPOWERS YOU!',320,panY+114);}
      if(t>0.76){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(68,panY+128,504,46);ctx.strokeStyle='#600';ctx.lineWidth=1;ctx.strokeRect(68,panY+128,504,46);const blink=Math.floor(f/14)%2===0;ctx.fillStyle=blink?apCol:'#604010';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(ARMOR[G.wIdx].p+' '+ARMOR[G.wIdx].n.toUpperCase()+' LOST',320,panY+150);ctx.fillStyle='#ff8060';ctx.font='8px monospace';ctx.fillText('Defeat '+w.boss.name+' to reclaim it!',320,panY+166);}
      if(t>0.9){ctx.fillStyle='#8080c0';ctx.font='8px monospace';ctx.fillText('"Study God\'s Word and return stronger."',320,panY+202);ctx.fillStyle='rgba(120,120,200,0.55)';ctx.fillText('2 Timothy 2:15',320,panY+220);}
    }
    shockRings.forEach(r=>{r.r+=r.speed;r.life=Math.max(0,1-r.r/r.maxR);if(r.life>0){ctx.strokeStyle=r.col;ctx.lineWidth=Math.max(1,5*r.life);ctx.globalAlpha=r.life;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}});shockRings=shockRings.filter(r=>r.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.97;p.life-=p.decay;if(p.life>0){ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1;}});particles=particles.filter(p=>p.life>0);
    ctx.restore();if(animPhase==='defeatBanner'&&f>190){setTimeout(()=>endWorld(false),300);return;}requestAnimationFrame(step);
  }
  step();
}

function endWorld(won){
  stopLoop();G.win=won;
  G.retryBoss=!won&&G.bossLost;
  if(G.retryBoss){G.lives=3;}
  G.bossLost=false;G.bossMiss=null;
  const w=WORLDS[G.wIdx];
  if(won){
    if(!G.worldsDone.includes(G.wIdx)){G.worldsDone.push(G.wIdx);G.score+=300;}
    if(!G.armorEarned.includes(G.wIdx))G.armorEarned.push(G.wIdx);
  }
  save();
  if(!won&&G.lives<=0){showGameOver();return;}
  const acc=G.correct+G.wrong>0?Math.round(G.correct/(G.correct+G.wrong)*100):100;
  document.getElementById('resIcon').textContent=won?(acc===100?'🏆':acc>=80?'🎉':'😊'):'💀';
  document.getElementById('resTitle').textContent=won?'WORLD COMPLETE!':'DEFEATED...';
  document.getElementById('resSub').textContent=won?w.boss.name+' has been vanquished! +300 bonus points!':'The enemy was too strong this time. Keep learning!';
  document.getElementById('rRight').textContent=G.correct;
  document.getElementById('rWrong').textContent=G.wrong;
  document.getElementById('rScore').textContent=G.score;
  const am=document.getElementById('armorMsg');
  if(won&&G.armorEarned.includes(G.wIdx)){am.style.display='block';am.textContent=ARMOR[G.wIdx].p+' '+ARMOR[G.wIdx].n+' EARNED!';}
  else am.style.display='none';
  const nw=WORLDS[G.wIdx+1];
  document.getElementById('nextWBtn').style.display=won&&nw?'block':'none';
  document.getElementById('retryBtn').style.display=won?'none':'block';
  document.getElementById('retryBtn').textContent=G.retryBoss?'↺ FIGHT '+w.boss.name.toUpperCase()+' AGAIN':'↺ TRY AGAIN';
  const cv=document.getElementById('resCv'),ctx=cv.getContext('2d');
  const gr=ctx.createLinearGradient(0,0,0,480);
  gr.addColorStop(0,won?'#001800':'#180000');gr.addColorStop(1,'#000');
  ctx.fillStyle=gr;ctx.fillRect(0,0,640,480);
  if(won){for(let i=0;i<25;i++){ctx.fillStyle=`rgba(248,200,64,${Math.random()*0.25})`;ctx.beginPath();ctx.arc(Math.random()*640,Math.random()*480,Math.random()*4+1,0,Math.PI*2);ctx.fill();}}
  show('resultScr');
}

function goNextWorld(){if(G.wIdx<5)beginWorld(G.wIdx+1);else goWM();}
function retryWorld(){
  if(G.retryBoss){G.retryBoss=false;stopLoop();G.phase='bossIntro';G.bossHP=100;startBossBattle();return;}
  beginWorld(G.wIdx);
}

// GAME OVER
// ===============================
let _goTimer=null;
function showGameOver(){
  stopLoop();
  if(_goTimer){clearInterval(_goTimer);_goTimer=null;}
  const cv=document.getElementById('goCv'),ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const gr=ctx.createLinearGradient(0,0,0,480);
  gr.addColorStop(0,'#1a0000');gr.addColorStop(0.5,'#0a0000');gr.addColorStop(1,'#000');
  ctx.fillStyle=gr;ctx.fillRect(0,0,640,480);
  for(let i=0;i<120;i++){ctx.fillStyle=`rgba(180,0,0,${Math.random()*0.07})`;ctx.fillRect(Math.random()*640,Math.random()*480,Math.random()*3+1,1);}
  ctx.font='72px serif';ctx.textAlign='center';ctx.fillText('💀',320,150);
  ctx.font='bold 52px Courier New';
  ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillText('GAME OVER',324,238);
  ctx.fillStyle='#5a0000';ctx.fillText('GAME OVER',322,236);
  ctx.fillStyle='#a00000';ctx.fillText('GAME OVER',320,234);
  ctx.fillStyle='#ff2020';ctx.fillText('GAME OVER',318,232);
  ctx.fillStyle='#8080c0';ctx.font='10px monospace';
  ctx.fillText("All lives lost — study God's Word and return stronger.",320,270);
  ctx.fillStyle='rgba(100,100,160,0.55)';ctx.fillText('2 Timothy 2:15',320,288);
  ctx.fillStyle='rgba(0,0,20,0.85)';ctx.fillRect(160,306,320,52);
  ctx.strokeStyle='#400000';ctx.lineWidth=1.5;ctx.strokeRect(160,306,320,52);
  ctx.fillStyle='#f8c840';ctx.font='bold 10px monospace';ctx.textAlign='left';
  ctx.fillText('Final Score:',176,328);ctx.fillText('Worlds:',176,346);
  ctx.fillStyle='#c0c0ff';ctx.textAlign='right';
  ctx.fillText(G.score,464,328);ctx.fillText(G.worldsDone.length+' / 6',464,346);
  ctx.fillStyle='rgba(248,200,64,0.5)';ctx.font='8px monospace';ctx.textAlign='center';
  ctx.fillText('Loading leaderboard...',320,400);
  show('gameOverScr');
  // After 2.5s transition to leaderboard
  _goTimer=setTimeout(()=>{_goTimer=null;goLeaderboard(true);},2500);
}

let _lbTimer=null;
function lbBack(){
  if(_lbTimer){clearInterval(_lbTimer);_lbTimer=null;}
  goTitle();
}
function goLeaderboard(fromGameOver){
  if(_lbTimer){clearInterval(_lbTimer);_lbTimer=null;}
  const rankEl=document.getElementById('lbScrRank');
  const cdEl=document.getElementById('lbScrCountdown');
  const rowsEl=document.getElementById('lbScrRows');
  rankEl.style.display='none';
  cdEl.style.display='none';
  rowsEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:12px;text-align:center;">Loading...</div>';
  show('lbScr');

  function renderLbScr(entries){
    rowsEl.innerHTML='';
    if(!entries.length){rowsEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:12px;text-align:center;">No scores yet — be the first!</div>';return;}
    let playerRank=-1;
    if(fromGameOver){
      // Find best matching entry for current player
      playerRank=entries.findIndex(e=>e.name===G.name);
    }
    if(playerRank>=0){
      const rankNum=playerRank+1;
      const medal=rankNum===1?'🥇 ':rankNum===2?'🥈 ':rankNum===3?'🥉 ':'🎖 ';
      rankEl.textContent=medal+G.name.toUpperCase()+' — YOU RANKED #'+rankNum+'!  '+medal;
      rankEl.style.display='block';
      sfxWin();
    } else if(fromGameOver){
      rankEl.textContent='Keep going — hit the leaderboard next time!';
      rankEl.style.display='block';
      rankEl.style.color='#8080c0';
      rankEl.style.borderColor='#404060';
      rankEl.style.background='rgba(0,0,20,0.88)';
    }
    const medals=['🥇','🥈','🥉'];
    entries.forEach((e,i)=>{
      const isPlayer=fromGameOver&&i===playerRank;
      rowsEl.innerHTML+=`<div class="${isPlayer?'lb-player':''}" style="display:grid;grid-template-columns:28px 1fr 58px 1fr;font-size:7px;padding:5px 4px;border-bottom:1px solid #1a1a30;gap:4px;background:${isPlayer?'rgba(248,200,64,0.12)':'transparent'};color:${isPlayer?'#f8c840':'#c0c0ff'};">
        <span style="color:${isPlayer?'#f8c840':'#505080'}">${medals[i]||(i+1)}</span>
        <span style="${isPlayer?'font-weight:bold;':''}">${e.name}</span>
        <span style="color:${isPlayer?'#ffe060':'#f0d060'}">${e.score}</span>
        <span style="color:#505080">${e.date||''}</span>
      </div>`;
    });
    if(playerRank>4){
      setTimeout(()=>{
        const rows=rowsEl.querySelectorAll('div');
        if(rows[playerRank])rows[playerRank].scrollIntoView({behavior:'smooth',block:'center'});
      },400);
    }
  }

  const doFetch=()=>{
    if(_fbDb){
      _fbDb.ref('cq3lb').orderByChild('score').limitToLast(25).once('value',snap=>{
        const entries=[];snap.forEach(c=>entries.push(c.val()));
        entries.sort((a,b)=>b.score-a.score);
        renderLbScr(entries);
      });
    } else {
      renderLbScr(JSON.parse(localStorage.getItem('cq3lb')||'[]'));
    }
  };
  // Small delay when coming from game over to let Firebase write settle
  fromGameOver ? setTimeout(doFetch,600) : doFetch();

  if(fromGameOver){
    let count=18;
    cdEl.style.display='block';
    cdEl.textContent='Returning to title in '+count+'...';
    _lbTimer=setInterval(()=>{
      count--;
      cdEl.textContent='Returning to title in '+count+'...';
      if(count<=0){clearInterval(_lbTimer);_lbTimer=null;goTitle();}
    },1000);
  }
}

// ===============================
// PAUSE / RESUME / SOUND
// ===============================
function _updateSoundBtn(){
  const b=document.getElementById('soundBtn');
  if(b)b.textContent=(soundOn?'🔊':'🔇')+' SOUND: '+(soundOn?'ON':'OFF');
}
function pauseGame(){
  if(G.phase==='bossIntro')return;
  G.paused=true;
  _updateSoundBtn();
  const po=document.getElementById('pauseOverlay');
  po.style.display='flex';
}
function resumeGame(){
  G.paused=false;
  document.getElementById('pauseOverlay').style.display='none';
}
function pauseSave(){
  save();
  const btn=document.querySelector('#pauseOverlay .pbtn:nth-child(3)');
  // Flash the button text briefly to confirm
  const saveBtn=Array.from(document.querySelectorAll('#pauseOverlay .pbtn')).find(b=>b.textContent.includes('SAVE'));
  if(saveBtn){const orig=saveBtn.textContent;saveBtn.textContent='✓ SAVED!';saveBtn.style.color='#60ff60';setTimeout(()=>{saveBtn.textContent=orig;saveBtn.style.color='';},1200);}
}
function pauseQuitWM(){
  G.paused=false;
  document.getElementById('pauseOverlay').style.display='none';
  goWM();
}
function pauseQuitTitle(){
  G.paused=false;
  document.getElementById('pauseOverlay').style.display='none';
  goTitle();
}
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem('cqSound',soundOn?'on':'off');
  _updateSoundBtn();
}

// ===============================
// NAME / GENDER / DIFF SELECTORS
// ===============================
function selG(g){sel.g=g;['boy','girl'].forEach(x=>document.getElementById('g'+x.charAt(0).toUpperCase()+x.slice(1)).style.borderColor=g===x?'#40d040':'#404040');sfxMenu();}
function selD(d){sel.d=d;['young','older'].forEach(x=>document.getElementById('d'+x.charAt(0).toUpperCase()+x.slice(1)).style.borderColor=d===x?'#40d040':'#404040');sfxMenu();}

function startJourney(){
  const n=document.getElementById('nameInp').value.trim();
  if(!n){document.getElementById('nameInp').focus();return;}
  G.name=n;G.gender=sel.g;G.diff=sel.d;
  G.score=0;G.lives=3;G.worldsDone=[];G.armorEarned=[];G.totalAnswered=0;G.qIdx=0;G.correct=0;G.wrong=0;
  sfxMenu();save();goWM();
}

function doLoad(){
  const saves=JSON.parse(localStorage.getItem('cq3s')||'{}');
  const names=Object.keys(saves);
  if(!names.length){alert('No saved games found!');return;}
  const nm=names[names.length-1],s=saves[nm];
  G.name=nm;G.gender=s.gender||'boy';G.diff=s.diff||'young';
  G.score=s.score||0;G.lives=s.lives||3;
  G.worldsDone=s.worldsDone||[];G.armorEarned=s.armorEarned||[];G.totalAnswered=s.totalAnswered||0;
  sfxMenu();goWM();
}

// ===============================
// PARENT MODE
// ===============================
function buildParent(){
  const saves=JSON.parse(localStorage.getItem('cq3s')||'{}');
  const lbEl=document.getElementById('lbRows');
  lbEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:8px">Loading scores...</div>';
  function renderLb(entries){
    lbEl.innerHTML='';
    if(!entries.length){lbEl.innerHTML='<div style="font-size:7px;color:#6060a0;padding:8px">No scores yet!</div>';return;}
    entries.forEach((e,i)=>{
      const m=['🥇','🥈','🥉'];
      lbEl.innerHTML+=`<div style="display:grid;grid-template-columns:28px 1fr 55px 1fr;font-size:7px;color:#c0c0ff;padding:4px 0;border-bottom:1px solid #202040;gap:4px;"><span style="color:#f8c840">${m[i]||(i+1)}</span><span>${e.name}</span><span style="color:#f8c840">${e.score}</span><span style="color:#8080a0">${e.date||''}</span></div>`;
    });
  }
  if(_fbDb){
    _fbDb.ref('cq3lb').orderByChild('score').limitToLast(25).once('value',snap=>{
      const entries=[];snap.forEach(c=>entries.push(c.val()));
      entries.sort((a,b)=>b.score-a.score);renderLb(entries);
    });
  } else {
    const lb=JSON.parse(localStorage.getItem('cq3lb')||'[]');renderLb(lb);
  }
  const si=document.getElementById('savesInfo');si.innerHTML='';
  Object.entries(saves).forEach(([n,s])=>{
    const d=new Date(s.ts).toLocaleDateString();
    si.innerHTML+=`📂 ${n} — Score: ${s.score} | Worlds: ${(s.worldsDone||[]).length}/6 | Mode: ${s.diff||'young'} | ${d}<br>`;
  });
  if(!Object.keys(saves).length)si.innerHTML='No saved games.';
}
function clearAll(){if(confirm('Clear ALL data?')){localStorage.removeItem('cq3s');localStorage.removeItem('cq3lb');buildParent();}}

// ===============================
// INIT
// ===============================
drawTitle();
{const m=location.hash.match(/^#boss(\d)?$/);if(m){
  const wi=(+m[1]||1)-1;
  G.name='Preview';G.gender='boy';G.diff='young';G.score=0;G.lives=3;G.worldsDone=[];G.armorEarned=[];for(let i=0;i<=wi;i++)G.armorEarned.push(i);
  beginWorld(wi);if(wi>=2)G.burden=0;stopLoop();G.phase='bossIntro';triggerBossIntro();
}}
// Start title music on first click (audio context needs user gesture)
document.getElementById('titleScr').addEventListener('click',()=>playTitleMusic(),{once:false});
setInterval(()=>{if(document.getElementById('titleScr').classList.contains('on'))drawTitle();},4000);

// ── AUTO-SCALE: fit 640×480 game to any screen size ──────────
(function scaleGame(){
  const gc=document.getElementById('gc');
  function resize(){
    const scaleX=window.innerWidth/648;// 640 + 8px border
    const scaleY=window.innerHeight/488;
    const scale=Math.min(scaleX,scaleY);
    gc.style.transform=`scale(${scale})`;
  }
  resize();
  window.addEventListener('resize',resize);
})();
</script>
